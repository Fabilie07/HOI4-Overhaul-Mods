 inf_rifled_barrel:0 "Rifled Barrel"
 inf_rifled_barrel_desc:0 "Small grooves are added to the inside of the barrel, which spin the round as it travels down it. This increases the in-flight stability of the round."
 inf_smooth_barrel:0 "Smooth Barrel"
 inf_smooth_barrel_desc:0 "The inside of the barrel is exactly the same size as the round, increasing the propellant's efficiency."
 
 brass_casing_tt:0 "Brass casings are cheap to produce, but they need to be slightly thicker than stronger materials."
 steel_casing_tt:0 "Steel can withstand significant explosive force, so more powder can be packed into casings made of this material."
 rimmed_casing_tt:0 "Rimmed casings are less complex to eject, since they can simply be blown out by their own recoil."
 rimless_casing_tt:0 "Rimless casings can cycle into the chamber easier, but they need to be ejected with a custom-made part."
 inf_casing_brass_rimmed:0 "Rimmed Brass Casing"
 inf_casing_brass_rimmed_desc:0 "$brass_casing_tt$ $rimmed_casing_tt$"
 inf_casing_brass_rimless:0 "Rimless Brass Casing"
 inf_casing_brass_rimless_desc:0 "$brass_casing_tt$ $rimless_casing_tt$"
 inf_casing_steel_rimmed:0 "Rimmed Steel Casing"
 inf_casing_steel_rimmed_desc:0 "$steel_casing_tt$ $rimmed_casing_tt$"
 inf_casing_steel_rimless:0 "Rimless Steel Casing"
 inf_casing_steel_rimless_desc:0 "$steel_casing_tt$ $rimless_casing_tt$"
 
 inf_receiver_metal:0 "Metal Receiver"
 inf_receiver_metal_desc:0 "Steel offers many advantages: It is easy to manufacture and stury, but complex parts need special maintenance to prevent rust."
 inf_receiver_plastic:0 "Polymer Receiver"
 inf_receiver_plastic_desc:0 "A lighter material offers many advantages, however the brittle nature of current plastics makes this a rarely used option."
 
 inf_stock_wood:0 "Wooden Stock"
 inf_stock_wood_desc:0 "A fully wooden stock has been a standard for Rifles since the times of the musket. There is significant experience in its processing."
 inf_stock_metal_highlights:0 "Partially Metal Stock"
 inf_stock_metal_highlights_desc:0 "Producing critical parts from metal allows the gun to be balanced between strength, cost and weight."
 inf_stock_metal:0 "Metal Stock"
 inf_stock_metal_desc:0 "A stock made from Steel is heavy, but also very robust."
 
 inf_backplate_metal:0 "Metal Plate"
 inf_backplate_metal_desc:0 "A simple plate made from metal spreads the recoil from firing out among the shooter's shoulder."
 inf_backplate_rimmed:0 "Rimmed Plate"
 inf_backplate_rimmed_desc:0 "Adding grooves or other deformities to the plate's surface allows the shooter to aim it more precisely, since it offers more grip."
 inf_backplate_rubber:0 "Rubber Plate"
 inf_backplate_rubber_desc:0 "The elasticity of rubber allows it to absorb more recoil, as well as offering the same grip as an uneven metal plate."
 
 inf_bipod:0 "Bipod"
 inf_bipod_desc:0 "A bipod allows a weapon to be mounted on the ground or cover, improving aiming and recoil control."
 inf_foregrip_standard:0 "Foregrip"
 inf_foregrip_standard_desc:0 "A foregrip helps with recoil control, especially on fully automatic weapons."
 inf_foregrip_mag:0 "Magazine as Foregrip"
 inf_foregrip_mag_desc:0 "A stick magazine can be used as a primitive foregrip, if the design accounts for it to be used as such."