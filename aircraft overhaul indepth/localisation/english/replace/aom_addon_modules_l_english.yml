 # Special Modules
 armor_piercing_bombs: "AP Bomb Type"
 armor_piercing_bombs_desc: "Bombs that carry a penetration fuse and a nose designed for punching through armor can deal devastating damage to large ships. They carry less explosives, making them inefficient for regular targets."
 leading_edge_slats: "Leading Edge Slats"
 leading_edge_slats_desc: "Leading edge slats can be deflected, improving maneuverability at high speeds."
 wing_fences: "Wing Fences"
 wing_fences_desc: "At trans- and supersonic speeds, airflow changes its properties. To accomodate for both high and low speed airflow, wing fences channel air and prevent wing stalls."
 tail_radar: "Tail-Warning Radar"
 tail_radar_desc: "A backwards-mounted radar emitting a warning when detecting an enemy aircraft tailing the plane."
 radar_warning_receiver: "Radar Warning Receiver"
 radar_warning_receiver_short: "RWR"
 radar_warning_receiver_desc: "Several Radar Antennae are placed around the aircraft. They record when the plane is hit by radar waves, displaying the contact direction to the pilot."
 
 plane_radio_1: "Basic Radio"
 plane_radio_1_desc: "Aircraft equipped with radio equipment can communicate without hand signals, allowing them to more easily support eachother."
 plane_radio_2: "Improved Radio"
 plane_radio_2_desc: "A longer range and better sound quality allows larger groups of planes to coordinate their operations."
 plane_radio_3: "Advanced Radio"
 plane_radio_3_desc: "Stronger radio waves can break through clouds and rain, allowing communication even during bad weather."
 
 auto_pilot: "Auto Pilot"
 auto_pilot_desc: "The aircraft uses advanced sensors to not only keep its course and altitude, but to navigate towards the target all on its own."
 
 hmg_defense_turret_4x: "Heavy MG Defense Turret 4x"
 hmg_defense_turret_4x_desc: "Four Heavy Machine Guns on a single turret are enough firepower to make any fighter think twice before engaging."
