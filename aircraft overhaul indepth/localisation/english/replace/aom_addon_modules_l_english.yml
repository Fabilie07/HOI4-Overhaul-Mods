 ### Modules
 
 # Ammunition
 
 plane_ammo_ap: "Armor Piercing"
 plane_ammo_ap_short: "AP"
 plane_ammo_ap_desc: "Full-steel projectiles with aerodynamic tips are meant for piercing through enemy airframes and puncturing fuel lines and other vital parts."
 plane_ammo_api: "Armor Piercing Incendiary"
 plane_ammo_ap_short: "AP-I"
 plane_ammo_api_desc: "Projectiles with incendiary bases. They set flammable substances on fire, disabling anything they hit directly."
 plane_ammo_aphe: "Armor Piercing High Explosive"
 plane_ammo_aphe_short: "AP-HE"
 plane_ammo_aphe_desc: "Armor piercing bullets with explosive fillers that detonate after penetrating the enemy. Can be used against air and ground targets."
 plane_ammo_hvap: "High Velocity Armor Piercing"
 plane_ammo_hvap_short: "HVAP"
 plane_ammo_hvap_desc: "Heavy Projectiles made from rare materials, made to penetrate thick armor."
 plane_ammo_he: "High Explosive Fragmentation"
 plane_ammo_he_short: "HE-F"
 plane_ammo_he_desc: "Shells with large explosive fillers that detonate on hits, sending shrapnel into the surrounding area."
 plane_ammo_minengeschoss: "Minengeschoss"
 plane_ammo_minengeschoss_desc: "Delayed fuses and thin shell casings use the blast rather than shrapnel created from an explosion."
 
 high_explosive_fragmentation_bombs: "High Explosive Fragmentation Bombs"
 high_explosive_fragmentation_bombs_short: "HE Bombs"
 high_explosive_fragmentation_bombs_desc: "Standard bombs packed with explosives designed to disperse shrapnel over large areas."
 incendiary_bombs: "Incendiary Bombs"
 incendiary_bombs_desc: "Bombs filled with flammable mixtures that ignite once they are dropped."
 napalm_bombs: "Napalm Bombs"
 napalm_bombs_desc: "Incendiary bombs using napalm fuel cause much hotter fires that are very hard to put out."
 depth_charge_bombs: "Depth Fused Bombs"
 depth_charge_bombs_desc: "Bombs with pressure fuses meant for engaging submarines or smaller vessels."
 skip_bomb_locks: "Skip Bombs"
 skip_bomb_locks_desc: "Conventional bombs with their fuzes set to a few seconds delay allow low-flying aircraft to skip them along the surface of the water in order to accurately hit enemy ships."
 high_drag_bombs: "High-Drag Bombs"
 high_drag_bombs_desc: "Using some form of deploying parachute mechanism, these so-called retarded bombs break their fall. This allows aircraft to exit the blast radius before detonation."
 
 contact_fuse_torp: "Torpedo w/ Contact Fuse"
 contact_fuse_torp_desc: "A contact fuse detonates the torpedo when hitting the side of an enemy ship. A simple, reliable mechanism, but it can fail when hitting the ship at too great an angle."
 magnetic_fuse_torp: "Torpedo w/ Magnetic Fuse"
 magnetic_fuse_torp_desc: "A metal ship distorts the magnetic field around its hull. This fuse reacts to that change, allowing torpedos to detonate below the keel, causing significant damage."
 wood_tip_torp: "Wood Tipped Torpedo"
 wood_tip_torp_desc: "A wooden ring is placed around the head of the torpedo, allowing it to level out quickly after entering the water. This allows aircraft to fire torpedos in very shallow water."
 
 he_rockets: "HE Warhead"
 he_rockets_desc: "Rockets are filled with explosives. They are most effective against soft targets."
 heat_rockets: "HEAT Warhead"
 heat_rockets_desc: "A shaped charge allows rockets to easily penetrate concrete or armor."
 
 # Airframe
 
 triplane: "Triple Wing Setup"
 triplane_desc: "Three wings offer good lift, especially at low speeds, but also increase drag tremendously."
 inverted_gull_wings: "Inverted Gull Wings"
 inverted_gull_wings_desc: "These wings bend near the fuselage, giving the plane a "W" shape. Landing gear can be shorter and therefore more resilient."
 gull_wings: "Gull Wings"
 gull_wings_desc: "Like a seagull's wings, the wings are bent upwards near the fuselage. This allows engines and control surfaces to be mounted away from the ground or water."
 clipped_wings: "Clipped Wings"
 clipped_wings_desc: "A simple conversion of Elliptical wings, improving roll rate and reducing drag."
 forward_swept_wings: "Forward Swept Wings"
 forward_swept_wings_desc: "These wings have a leading edge that is angled forwards. It allows the plane to fly at high speeds, but causes stability issues."
 swept_wings_1: "Swept Wings"
 swept_wings_1_desc: "These wings are swept backwards at an angle of 10-40 degrees, reducing drag at high speeds."
 swept_wings_2: "Highly Swept Wings"
 swept_wings_2_desc: "These wings increase the angle to above 45 degrees, reducing drag at supersonic speeds but making handling harder at low speed."
 swing_wings: "Variable Sweep Wings"
 swing_wings_desc: "These wings can adjust their angle, providing excellent performance at all speeds. Their complicated construction must be built around."
 
 single_tail: "Single Tail"
 single_tail_desc: "A single Tail and Horizontal Stabilizer is the most common layout. It offers good stability and maneuverability."
 t_tail: "T-Tail"
 t_tail_desc: "This tail mounts the elevators on top of the horizontal stabilizer. This removes them from the turbulent airflow near the fuselage."
 angled_taileron_tail: "Angled Tailerons"
 angled_taileron_tail_desc: "Instead of vertical stabilizers, tailerons are used. They can be deflected in their entirety and provide constant downforce."
 cruciform_tail: "Cruciform Tail"
 cruciform_tail_desc: "The elevators are mounted in the middle of the horizontal stabilizer. This design provides stability, but the assembly of the rudder is more complicated."
 twin_tail: "Twin Tail"
 twin_tail_desc: "Two horizontal stabilizers improve the planes stability and allow rear gunners to fire straight behind the plane."
 v_tail: "V-Tail"
 v_tail_desc: "Instead of seperate horizontal and vertical stabilizers, two angled stabilizers are used. They can act both as rudders and elevators."
 triple_tail: "Triple Tail"
 triple_tail_desc: "Three horizontal stabilizers improve the aircraft's stability, but back gunners have very limited arcs of fire."
 twin_boom: "Twin Boom"
 twin_boom_desc: "A twin boom Tail allows the aircraft to carry additional fuel or complicated cooling systems."
 tailless: "Vertical Stabilizer"
 tailless_desc: "This design features no horizontal stabilizers. Their roles are instead fulfilled by the ailerons."
 tailless_2: "Horizontal Stabilizer"
 tailless_2_desc: "This design features no vertical stabilizer. Its role is instead fulfilled by tilting the aircraft."
 tailless_3: "Tailless"
 tailless_3_desc: "This design removes the tail entirely. It is controlled completely by the ailerons and the lift of the wings."
 back_porch: "Back Porch"
 back_porch_desc: "A back porch is a vertical stabilizer that is simply an extension of the wings."
 
 wooden_skeleton: "Wood Truss"
 wooden_skeleton_desc: "A skeleton made from plywood or other wood types is light and cheap, but it lacks integrity when compared to metal frames."
 steel_skeleton: "Steel Truss"
 steel_skeleton_desc: "Steel is very resistant to damage, but its heavy weight makes it unsuitable for aircraft."
 aluminium_alloy_skeleton: "Aluminium Alloy Truss"
 aluminium_alloy_skeleton_desc: "By using an alloy instead of pure aluminium, the material cost is reduced. It does have some drawbacks though."
 aluminium_skeleton: "Aluminium Truss"
 aluminium_skeleton_desc: "Aluminium is both light and strong, making it a perfect material for aerospace engineering."
 titanium_skeleton: "Aluminium Truss with Titanium Segments"
 titanium_skeleton_desc: "Titanium offers a new level of strength-to-weight ratio. Titanium parts are excellent load bearers, but it is rare and difficult to work with."
 wooden_skeleton_large: "Wood Truss"
 wooden_skeleton_large_desc: "A skeleton made from plywood or other wood types is light and cheap, but it lacks integrity when compared to metal frames."
 steel_skeleton_large: "Steel Truss"
 steel_skeleton_large_desc: "Steel is very resistant to damage, but its heavy weight makes it unsuitable for aircraft."
 aluminium_alloy_skeleton_large: "Aluminium Alloy Truss"
 aluminium_alloy_skeleton_large_desc: "By using an alloy instead of pure aluminium, the material cost is reduced. It does have some drawbacks though."
 
 simplified_plane_construction: "Simplified Alloy Truss"
 simplified_plane_construction_desc: "This truss is streamlined to be produced quickly. Its simple shape allows it to be assembled very quickly, but does not provide as much stability."
 simplified_plane_construction_large: "Simplified Alloy Truss"
 simplified_plane_construction_large_desc: "This truss is streamlined to be produced quickly. Its simple shape allows it to be assembled very quickly, but does not provide as much stability."
 
 paper_skin: "Paper Airframe"
 paper_skin_desc: "Paper is very light and cheap, but it provides much less structural integrity and protection than other skin types."
 smooth_metal_skin: "One-Piece Metal Airframe"
 smooth_metal_skin_desc: "Fabricating the complete skin of an aircraft out of one singular metal piece is very complex, but eliminates all rivets, welds or bumps that could impact aerodynamic performance."
 
 fixed_wooden_wheels: "Fixed Wood Wheels"
 fixed_wooden_wheels_desc: "Wheels made from wood have been replaced with rubber tires long ago, but if rubber is unavailable, they are better than nothing at all."
 big_fixed_wooden_wheels: "Fixed Wood Wheels"
 big_fixed_wooden_wheels_desc: "Wheels made from wood have been replaced with rubber tires long ago, but if rubber is unavailable, they are better than nothing at all."
 
 open_cockpit: "Open Cockpit"
 open_cockpit_desc: "A non-enclosed cockpit offers no protection against wind and temperature. With planes getting increasingly faster, it is all but obsolete."
 canopy: "Box Canopy"
 canopy_desc: "A fully enclosed canopy with windows. It somewhat limits visibility."
 reinforced_canopy: "Reinforced Canopy"
 reinforced_canopy_desc: "The structure of the canopy is strengthened, improving the protection it offers."
 bubble_canopy: "Bubble Canopy"
 bubble_canopy_desc: "A canopy made almost entirely of glass. It offers very good visibility, but its aerodynamic features leave things to be desired."
 fuselage_extension: "In-Fuselage Cockpit"
 fuselage_extension_desc: "Merging the Canopy with the Fuselage makes looking behind the plane hard, but it is very aerodynamic."
 large_cockpit: "Large Cockpit"
 large_cockpit_desc: "A cockpit that is large enough to house multiple flight crew members and to walk around in while flying."
 
 fuel_tank_concentrated: "Compact Fuel Layout"
 fuel_tank_concentrated_desc: "The majority of fuel is stored in a single tank in the fuselage. The most efficient layout, but very prone to damage."
 fuel_tank_dispersed: "Dispersed Fuel Layout"
 fuel_tank_dispersed_desc: "The fuel is spread into multiple tanks with individual fuel lines. This way, when a tank is punctured, less fuel is lost."
 fuel_tank_self_sealing: "Self-Sealing Tanks"
 fuel_tank_self_sealing_desc: "The outer hull of the tanks is hollow and contains a hardening mixture. When the tank is pierced and air comes in contact with it, it plugs the hole up."
 
 flaps_0: "No Flaps"
 flaps_0_desc: "These wings have no variable parts that could increase lift on-demand."
 flaps_1: "Two-Position Flaps"
 flaps_1_desc: "These flaps can fully extend or retract, with no room for angle adjustment. They are mainly used for takeoff and landing."
 flaps_2: "Three-Position Flaps"
 flaps_2_desc: "Adding another possible position allows the flaps to be used while maneuvering, increasing lift for short periods of time."
 flaps_3: "Fully Controllable Flaps"
 flaps_3_desc: "These flaps can be finely adjusted to whatever angle the pilot needs."
 flaps_automatic: "Automatic Flap Control"
 flaps_automatic_desc: "The plane only extends the flaps further when the current airspeed allows it. This not only improves energy maneuverability but also prevents the flaps from ripping off."
 
 controls_wire: "Direct Wire Controls"
 controls_wire_desc: "The control stick is connected to the control surfaces via cables. This means that the pilot must physically move them, a feat that is not easy at high speeds."
 controls_assisted: "Motor Assisted Controls"
 controls_assisted_desc: "Small electric motors assist with aligning the control surfaces. As a result of this, they lock up at higher speeds."
 controls_hydraulic: "Hydraulic Controls"
 controls_hydraulic_desc: "By using hydraulic tubes and push rods, the controls are simplified a lot. However, these systems must be built redundantly to prevent the plane from losing controls due to damage."
 
 
 # Engine
 engine_1x: "One Engine"
 engine_1x_desc: "A single engine is light and can still output a lot of power."
 engine_2x: "Two Engines"
 engine_2x_desc: "Two engines allow flexible design, both large and compact."
 engine_3x: "Three Engines"
 engine_3x_desc: "Triple engines are somewhat awkward due to their asymmetric nature. Most designers prefer even engine numbers."
 engine_4x: "Four Engines"
 engine_4x_desc: "Four engines mean a large carrying capacity while maintaining many favorable qualities."
 engine_5x: "Five Engines"
 engine_5x_desc: "Some few designs are powered by five engines, but very few aircraft need that kind of power."
 engine_6x: "Six Engines"
 engine_6x_desc: "Only the heaviest of aircraft are powered by six engines."
 engine_7x: "Seven Engines"
 engine_7x_desc: "This configuration is not practical, but it does promise a lot of power."
 engine_8x: "Eight Engines"
 engine_8x_desc: "An eight-engined aircraft is a true titan of the skies, with the wing space required to mount them alone requiring a gargantuan size."
 
 engine_type_straight: "Inline Engine"
 engine_type_straight_desc: "A straight engine places all cylinders next to each other. Sometimes, another row is added on the opposite side of the crank shaft."
 engine_type_rotary: "Rotary Engine"
 engine_type_rotary_desc: "The crank shaft is fixed, with cylinders placed around it on a movable ring. The propeller is fixed to that ring, turning with the cylinders."
 engine_type_vee: "V-Engine"
 engine_type_vee_desc: "Two rows of cylinders are positioned at an angle, forming a "V" shape when looked at from the front. Its compact shape and high power to weight ratio make this a favorite layout."
 engine_type_radial: "Radial Engine"
 engine_type_radial_desc: "The cylinders are placed around the crank shaft in a circle shape. Multiple banks of cylinders can be placed behind one another. This engine offers a large amount of power, but is not as aerodynamic as some others."
 engine_type_push: "Pusher Engine"
 engine_type_push_desc: "The propeller is mounted backwards. This allows for a new perspective on plane design, like moving the wings backwards and mounting more Weapons in the nose."
 engine_type_push_pull: "Push-Pull Engine"
 engine_type_push_pull_desc: "Propellers are mounted in sets of two, one pushing and the other pulling the aircraft."
 engine_type_turboprop: "Turboprop Engine"
 engine_type_turboprop_desc: "A jet turbine is connected to a crank shaft that turns a propeller. This design uses the tremendous power of a jet and combines it with the acceleration of a propeller."
 engine_type_jet: "Jet Engine"
 engine_type_jet_desc: "A turbine fan burns enriched air, propelling it with tremendous force. The engine of the future."
 engine_type_jet_afterburner: "Afterburning Jet Engine"
 engine_type_jet_afterburner_desc: "After exiting the combustion chamber, extra fuel can be injected into the airflow to vastly improve the power output."
 rocket_engine_1: "Rocket Engine"
 rocket_engine_1_desc: "A rocket engine uses highly flammable substances that expand upon lighting on fire to create a powerful flow of air. Very strong, but volatile and hard to control."
 
 prop_carburetor: "Float-Valve Carburetor"
 prop_carburetor_desc: "The pressure from the fuel flow operates a valve that allows fuel to enter the cylinder. A simple system, but not well suited for aircraft that need to perform maneuvers in all three dimensions or at altitude."
 prop_injection: "Fuel Injection"
 prop_injection_desc: "Forcefully injecting the fuel ensures a constant flow at all times. Is less prone to failure and provides higher power, but is also more complex."
 prop_water_injection: "Water Injection"
 prop_water_injection_desc: "A normal fuel injection system that allows water to be added into the cylinder to cool it down. Allows for short bursts of increased power."
 prop_methanol_injection: "Methanol-Water Injection"
 prop_methanol_injection_desc: "Instead of water, a mixture of methanol and water is injected. Improves the engine's performance further."
 prop_nitrous_injection: "Nitrous Oxide Injection"
 prop_nitrous_injection_desc: "An injection of nitrous oxide can improve performance, especially at high altitude. This is because it carries oxygen which is increasingly hard to access at low pressure."
 jet_turbojet: "Turbojet"
 jet_turbojet_desc: "All intake air is fed into the jet fan and combusted."
 jet_low_bypass: "Low Bypass"
 jet_low_bypass_desc: "Less than half of the inake air is led around the combustion chamber."
 jet_medium_bypass: "Medium Bypass"
 jet_medium_bypass_desc: "Around half of the inake air is led around the combustion chamber."
 jet_high_bypass: "High Bypass"
 jet_high_bypass_desc: "More than half of the inake air is led around the combustion chamber."
 rocket_no_injection: "Solid Fuel Block"
 rocket_no_injection_desc: "Solid fuel is stored in the combustion chamber. It does not need injection, but once it is lit, there is no control over it anymore."
 rocket_injection_holes: "Pressurized Holes"
 rocket_injection_holes_desc: "Rocket fuel is pumped into the combustion chamber through a series of holes which atomize and mix the fuel before it is ignited."
 rocket_engine_2: "Centripetal Injector"
 rocket_engine_2_desc: "A swirling head is used to disperse and mix the fuel. It achieves more controllable results."
 rocket_engine_3: "Impinging Injector"
 rocket_engine_3_desc: "The fuel is injected at an angle with crossing streams, atomizing it more evenly."
 
 plane_no_cowling: "No Cowling"
 plane_no_cowling_desc: "The engine has no mantling, allowing the air to directly cool it. This increases drag, especially at high speeds."
 plane_air_cooling: "Air Cooling"
 plane_air_cooling_desc: "External air is vented through the engine, absorbing its heat."
 plane_airodynamic_cooling: "Aerodynamic Nozzle"
 plane_airodynamic_cooling_desc: "A type of air cooling system which vents the air back outside through a nozzle pointing backwards, creating some thrust to offset the drag caused by the cooling system."
 plane_water_cooling: "Water Cooling"
 plane_water_cooling_desc: "Water is used to transport the heat away from the engine. An effective system, but the need for radiators increase drag. When the lines are punctured, the water spills, rendering the cooling system nonfunctional."
 plane_oil_cooling: "Oil Cooling"
 plane_oil_cooling_desc: "Oil is used as the primary heat sink. It is more effective than water, but can catch fire when hit."
 
 no_supercharger: "No Supercharger"
 no_supercharger_desc: "Combustion engines do not need air compression, but designs without superchargers are outdated."
 supercharger_single_speed: "Single Speed Supercharger"
 supercharger_single_speed_desc: "A Supercharger is a compression turbine that is driven by the engine shaft. It condenses air before feeding it into the engine, making it richer in oxygen."
 supercharger_twin_speed: "Twin Speed Supercharger"
 supercharger_twin_speed_desc: "This supercharger uses a gearbox to adjust its turn rate for low or high altitude performance."
 supercharger_triple_speed: "Triple Speed Supercharger"
 supercharger_triple_speed_desc: "Another Gear is added, ensuring a smooth transition of power at all altitudes."
 basic_turbocharger: "Turbocharger"
 basic_turbocharger_desc: "A turbocharger works similar to a supercharger, but it is powered by the exhaust gases of the engine."
 improved_turbocharger: "Dual Charger"
 improved_turbocharger_desc: "Combining super- and turbochargers to get the best of both worlds is possible, although complex."
 centrifugal_compressor: "Centrifugal Compressor"
 centrifugal_compressor_desc: "This compressor is quite complicated, but produces power in little space."
 axial_compressor_1: "4-Stage Axial Compressor"
 axial_compressor_1_desc: "Axial compressors are less powerful, but their simple construction allows them to be placed behind each other in stages."
 axial_compressor_2: "5-Stage Axial Compressor"
 axial_compressor_2_desc: "Axial compressors are less powerful, but their simple construction allows them to be placed behind each other in stages."
 axial_compressor_3: "6-Stage Axial Compressor"
 axial_compressor_3_desc: "Axial compressors are less powerful, but their simple construction allows them to be placed behind each other in stages."
 axial_compressor_4: "7-Stage Axial Compressor"
 axial_compressor_4_desc: "Axial compressors are less powerful, but their simple construction allows them to be placed behind each other in stages."
 axial_compressor_5: "8-Stage Axial Compressor"
 axial_compressor_5_desc: "Axial compressors are less powerful, but their simple construction allows them to be placed behind each other in stages."
 axial_compressor_6: "9-Stage Axial Compressor"
 axial_compressor_6_desc: "Axial compressors are less powerful, but their simple construction allows them to be placed behind each other in stages."
 axial_compressor_7: "10-Stage Axial Compressor"
 axial_compressor_7_desc: "Axial compressors are less powerful, but their simple construction allows them to be placed behind each other in stages."
 axial_compressor_8: "11-Stage Axial Compressor"
 axial_compressor_8_desc: "Axial compressors are less powerful, but their simple construction allows them to be placed behind each other in stages."
 axial_compressor_9: "12-Stage Axial Compressor"
 axial_compressor_9_desc: "Axial compressors are less powerful, but their simple construction allows them to be placed behind each other in stages."
 two_spool_compressor: "2-Spool Compressor"
 two_spool_compressor_desc: "Pressure rises along the length of an axial compressor. Using two sets of compressor stages, a low-pressure and high-pressure set respectively, increases maximum compression while preventing compressor stalls."
 three_spool_compressor: "3-Spool Compressor"
 three_spool_compressor_desc: "Another spool of stages increases fuel efficiency, but diminishes power."
 rocket_solid_fuel: "Solid Fuel"
 rocket_solid_fuel_desc: "Solid Fuel can be very powerful, but it is limited by design, because there is no way to feed additional fuel into the combustion chamber."
 rocket_solid_fuel_oxidizer: "Solid Fuel w/ Oxidizer"
 rocket_solid_fuel_oxidizer_desc: "Adding an oxidizer to solid-fuel rockets is not as simple as it might seem. It must be dispersed evenly throughout the fuel block."
 rocket_liquid_fuel: "Liquid Fuel"
 rocket_liquid_fuel_desc: "Liquid fuel has the advantage of being injected into the combustion chamber, allowing greater range and control over the engine."
 rocket_liquid_fuel_2: "Multi-Type Liquid Fuel"
 rocket_liquid_fuel_2_desc: "Using and mixing multiple fuel types can improve the engines efficiency, but it increases the engines complexity."
 rocket_liquid_fuel_oxidizer: "Liquid Fuel w/ Oxidizer"
 rocket_liquid_fuel_oxidizer_desc: "An oxidizer improves the burning properties of the fuel. It must be mixed with the fuel during the injection process."
 rocket_liquid_fuel_2_oxidizer: "Multi-Type Liquid Fuel w/ Oxidizer"
 rocket_liquid_fuel_2_oxidizer_desc: "Injecting three liquids into the engine compartment at once is difficult, but it improves the efficiency and therefore range of the engine."
 
