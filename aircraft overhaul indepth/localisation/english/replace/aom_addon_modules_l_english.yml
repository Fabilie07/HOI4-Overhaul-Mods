 parasite_engine_glider: "Glider Parasite Planes"
 parasite_engine_glider_desc: "Glider planes have no propulsion. This means that they have limited time in the air to perform their attacks, but they are far easier to produce."
 parasite_engine_prop: "Propeller Parasite Planes"
 parasite_engine_prop_desc: "A standard propeller engine is used to propel the parasite planes."
 parasite_engine_jet: "Jet Parasite Planes"
 parasite_engine_jet_desc: "A powerful jet engine is used to propel the parasite planes."
 parasite_engine_rocket: "Rocket Parasite Planes"
 parasite_engine_rocket_desc: "Parasite Planes can take advantage of rocket engine's potential without being limited by their short range."
 
 parasite_dock_fuselage: "Fuselage Dock"
 parasite_dock_fuselage_desc: "The parasite aircraft are attached to the fuselage. This makes docking and undocking easy, but limits the available space."
 parasite_dock_wings: "Wing Dock"
 parasite_dock_wings_desc: "The parasite aircraft are docked onto pods on the wings of the mothership. This method ensures a lot of space, but is significantly more difficult."
 parasite_dock_bomb_bay: "Bomb Bay Dock"
 parasite_dock_bomb_bay_desc: "Carrying aircraft in an internal bay improves the aerodynamic performance of the mothership, but only a few aircraft can be carried at a time."
 parasite_dock_hangar: "Internal Hangar"
 parasite_dock_hangar_desc: "A dedicated hangar allows for swift docking and undocking, as well as carrying multiple parasite aircraft."