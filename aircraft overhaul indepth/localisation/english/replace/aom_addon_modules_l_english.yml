 # HUD
 plane_crosshair_1: "Crosshair"
 plane_crosshair_1_desc: "A simple sight is mounted to the plane, showing the trajectory of the guns."
 plane_crosshair_2: "Reflex Sight"
 plane_crosshair_2_desc: "The sight is projected onto a piece of glass. The advantage of this is that even if the pilot moves their head, the crosshair remains centered on the target."
 plane_crosshair_3: "Gyroscopic Gunsight"
 plane_crosshair_3_desc: "This gunsight can be adjusted to show the lead needed to hit an enemy aircraft. The pilot needs to manually adjust the reticle to fit the wingspan of the target."
 plane_bomb_reticle_1: "Bomb Reticle"
 plane_bomb_reticle_1_desc: "A sight showing the rough impact point of bombs while dive bombing. Is mostly used to line up on the target."
 plane_bomb_reticle_2: "Gyroscopic Bomb Reticle"
 plane_bomb_reticle_2_desc: "This sight adjusts itself based on the aircraft's speed and angle to predict where the bombs will land when released at the otimal altitude."
 plane_turret_crosshair: "Turret Reflex Sight"
 plane_turret_crosshair_desc: "The turrets are mounted with sights enabling the gunners to more accurately track and shoot down their targets."
 plane_torp_reticle_1: "Torpedo Sight"
 plane_torp_reticle_1_desc: "A sight that can be aligned with a ship to show roughly where the torpedo must be dropped to hit it."
 plane_torp_reticle_2: "Improved Torpedo Sight"
 plane_torp_reticle_2_desc: "This sight can be manually adjusted with the target's heading and speed to improve accuracy."
 
 
 # Propellers
 propeller_wood_2: "2-Bladed Wooden Propeller"
 propeller_wood_2_desc: "Wood is lighter than metal, but its integrity is far weaker. Only old engines can use this type of propeller without risking damaging it."
 propeller_wood_3: "3-Bladed Wooden Propeller"
 propeller_wood_3_desc: "Wood is lighter than metal, but its integrity is far weaker. Only old engines can use this type of propeller without risking damaging it."
 propeller_fixed_2: "2-Bladed Fixed Propeller"
 propeller_fixed_2_desc: "This propeller is made from metal, but its blade's angles can not be adjusted. This reduces the effectiveness of the propeller."
 propeller_fixed_3: "3-Bladed Fixed Propeller"
 propeller_fixed_3_desc: "This propeller is made from metal, but its blade's angles can not be adjusted. This reduces the effectiveness of the propeller."
 propeller_2: "2-Bladed Propeller"
 propeller_2_desc: "Two rotor blades are not enough to transfer the power modern engines produce into thrust. This type of propeller is outdated."
 propeller_3: "3-Bladed Propeller"
 propeller_3_desc: "Three blades can propel more air than two, reducing the necessary diameter of the propeller."
 propeller_4: "4-Bladed Propeller"
 propeller_4_desc: "More blades can generate more thrust, but the rotational drag is increased as well. Finding the sweet spot for when to up the blade count is paramount in aircraft design."
 propeller_5: "5-Bladed Propeller"
 propeller_5_desc: "Only the most powerful of engines can run effectively using five rotor blades. The upside is that it provides unmatched thrust."
 propeller_6: "6-Bladed Propeller"
 propeller_6_desc: "Six blades can improve the thrust of the propeller, but their high drag makes them only viable under very specific conditions."
 propeller_automatic_2: "2-Bladed Constant Speed Propeller"
 propeller_automatic_2_desc: "This propeller uses a mechanical adjuster to automatically adjust the angle of the blades. This allows the engine to operate at optimal RPM at all times."
 propeller_automatic_3: "3-Bladed Constant Speed Propeller"
 propeller_automatic_3_desc: "This propeller uses a mechanical adjuster to automatically adjust the angle of the blades. This allows the engine to operate at optimal RPM at all times."
 propeller_automatic_4: "4-Bladed Constant Speed Propeller"
 propeller_automatic_4_desc: "This propeller uses a mechanical adjuster to automatically adjust the angle of the blades. This allows the engine to operate at optimal RPM at all times."
 propeller_automatic_5: "5-Bladed Constant Speed Propeller"
 propeller_automatic_5_desc: "This propeller uses a mechanical adjuster to automatically adjust the angle of the blades. This allows the engine to operate at optimal RPM at all times."
 propeller_automatic_6: "6-Bladed Constant Speed Propeller"
 propeller_automatic_6_desc: "This propeller uses a mechanical adjuster to automatically adjust the angle of the blades. This allows the engine to operate at optimal RPM at all times."
 propeller_counter_2: "2-Bladed Contra Rotating Propeller"
 propeller_counter_2_desc: "Contra-rotating propellers feature two sets of blades that turn in opposite directions. This cancels out any drift caused by the powerful torque."
 propeller_counter_3: "3-Bladed Contra Rotating Propeller"
 propeller_counter_3_desc: "Contra-rotating propellers feature two sets of blades that turn in opposite directions. This cancels out any drift caused by the powerful torque."
 propeller_counter_4: "4-Bladed Contra Rotating Propeller"
 propeller_counter_4_desc: "Contra-rotating propellers feature two sets of blades that turn in opposite directions. This cancels out any drift caused by the powerful torque."
 
 jet_fixed_nozzle: "Fixed Nozzle"
 jet_fixed_nozzle_desc: "A simple nozzle that condenses the air jet exiting the fan and releases it from the aircraft, propelling it forwards."
 jet_variable_nozzle: "Variable Nozzle"
 jet_variable_nozzle_desc: "A nozzle with variable geometry allows the efficient usage of an afterburner, improving performance for short periods."
 jet_turning_nozzle: "Movable Nozzle"
 jet_turning_nozzle_desc: "This nozzle allows for thrust to be vectored downwards, allowing planes to takeoff and land vertically."
 
