 HANDBOOK_TEXT:0 "[nom_handbook_text]"
 HANDBOOK_TEXT_1:0 "Page 2: Fleets \nPage 3: Screens \nPage 4: Capital Ships \nPage 5: Carriers \nPage 6: Submarines \nPage 7: Convoys \n\nThis handbook is meant to help you understand the Mechanics behind Naval Combat and how this Mod alters them. \n\nFor those people who already have an understanding of the way Naval Combat works, here are some of the more important changes that this Mod does opposed to Vanilla: \n\nCarrier Stack Penalty over 4 Carriers: 20% --> 10% \nCarrier Interception Multiplier: 6 --> 10 \nCarrier Strike Multiplier: 10 --> 6 \nCarrier Planes Sortie Hours: 3 --> 2 \n\nScreens necessary to screen Capital Ships: 3 --> 2"
 HANDBOOK_TEXT_2:0 "Fleets consist of one or several Task Forces. They can be accessed by pressing F2 (standard) or clicking the map icon on the bottom righthand side of the screen. Every ship that a country has is assigned a Fleet and Task Force, so there are never any ships that are not in any Fleets and Task Forces. Newly built ships are typically put in the Reserve Fleet that can not operate, unless you specify a different Fleet for it in the Production Tab. \n\nEach Fleet can be assigned to perform certain Tasks. Be aware that Task Forces can be assigned independently, so when forming a new Task Force you must make sure to give them new orders (can be seen by wether the Tasks light is yellow or green). They also have different Levels of Aggression that can be set, deciding when your ships engage and retreat. \nBased on these Settings and their Tasks, Task Forces can engage enemy Task Forces. This means that they will hunt them down. Two Task Forces of countries that are at war will start battling when they are in the same Sea Province, the subsection of Sea Zones you can can see in the Navy Map Mode. \n\nA Task Force's Speed and Range is always as low as the slowest/short-rangest ship within, so keep that in mind when designing Task Forces that are meant to hunt down enemy ships. \n\nWhen a battle breaks out, you can view it by clicking on its Icon on the map. \nAll ships will fire upon the enemy with their weaponry. They will target an enemy based on four Factors: If they can target it, what type of ship it is, how much Strength it has and how much Damage it has already taken."
 HANDBOOK_TEXT_3:0 "Screens are your Task Force's Light Cruisers and Destroyers. They have three main purposes: Shield your Capital Ships from Torpedo Attacks, Destroy the enemies Screens and attack the enemy Capitals with Torpedos once their Screens are sunk. Each Capital Ship will need 2 Screens to protect it from Torpedos with maximum efficiency, but Modifiers such as Positioning can reduce their effectiveness so it does not hurt to have a Ratio of 3:1 from Screens to Capital Ships. \n\nScreens typically have two types of Weapons: \nLight guns can only target the enemy Screens. They can only attack Capital ships once there are no Screens left. \nTorpedos can target all enemies but will try to sink the enemy Capital Ships, even if they are still sufficiently screened. They can deal devastating damage once the Screen is gone. Torpedos only fire once every 4 hours. \n\nScreens are also very good at spotting enemy ships and submarines while not draining as much fuel, so they are generally good picks for the Patrol and Convoy Defence Tasks. Modules like Sonar, Radar and Aircraft Launchers can be very helpful in those situations."
 HANDBOOK_TEXT_4:0 "Capital Ships are your Task Force's Heavy Cruisers, Battlecruisers and Battleships. They function as damage dealers, as well as a last line of defense for your Backline. As described in the Screen Section, it is crucial that they are sufficiently screened to prevent a sudden case of Explosion. A Carrier can only function at full capacity when it is screened by at least one Capital ship. \n\nCapital ships have a high Naval Supremacy rating and can provide Shore Bombardment, so they are a natural choice for countries that want to perform Naval Invasions. \n\nCapital Ships can use Torpedos and Secondaries, which function exactly as they would on Screens. Additionally, their Main Guns perform Heavy Attacks. These can target the first two active groups of the enemy Task Force. For example, against a fleet of Screens, Capital Ships and Carriers, the Heavy Guns can target the enemy Screens and Capital Ships. They will however almost never target the screens, because their preferred Target are Heavy Ships. Once the Screen is sunk, the Heavy Guns can target the Capital Ships and Carriers of the enemy."
 HANDBOOK_TEXT_5:0 "Carriers are part of your Task Forces Backline, together with Convoys. They can bring Aircraft directly into a Naval Combat, which can deal massive damage to enemy Carriers and Capital Ships. Do note that, unless it's a Hybrid Carrier, Aircraft Carriers will only use their guns while they are retreating. \n\nAll Naval Bombers and Close Air Support planes on an Aircraft Carrier that are not performing other tasks will automatically attack enemy ships when entering Combat, while Fighters will try to stop enemy plane attacks. Carrier Planes get a pretty significant boost to their Damage against Ships when their Carrier is in the same Battle. They will try to target enemy Carriers and Battleships first. The only AA that will fire on enemy planes is that of the ship they are targeting, so it is advised for Carriers and Battleships to have a solid AA Defense, as it can reduce the damage taken significantly. \n\nCarriers have two Modifiers that you have to keep in mind when building a Carrier Task Force: When more than 4 Carriers are deployed at once, for every Carrier that is above the limit, 10% less Carrier Planes will participate in the Battle. This will affect the Carriers that are lower in the list first and has no effect on Fighters, so you can have a 5th or 6th Carrier filled with Fighters. \nCarriers can carry more Planes than they have space for, but will begin to suffer from a Penalty. This Penalty will be 2% for every 1% of capacity overcrowded. This can be offset with Doctrines and Admiral Traits. For example, a Penalty Reduction of 20% allows you to fully operate another Airwing from a Carrier with 100 Deck Space."
 HANDBOOK_TEXT_6:0 "Submarines are cheap and hard to spot. This makes them perfect for countries that can not contest with the surface fleets of their enemies. They can wreak havoc on shipping lines and even engage enemy warships. \n\nSubmarines can not be attacked while they are unspotted. They can either be spotted or reveal themselves while attacking. How likely this is to happen is mostly reliant on the Sub's Visibility and the enemy Ship's Sub Detection. Once spotted, a Submarine can be attacked for 20 Hours. \n\nThe Torpedo Attacks a Submarine carries out follows the same rules as all other Torpedos fired from surface ships. Each time a Submarine attacks, there is a chance that it reveals itself to the enemy. Without any modifiers applied, that chance is 3.5%, but it can be influenced by a multitude of factors."
 HANDBOOK_TEXT_7:0 "Convoys function seperately from all other ships. They are not assigned to Task Forces or Fleets and can not be manually moved across the Map as physical units. All of their Tasks are automatically assigned and executed. They are necessary for Trade, Supplying Troops overseas, Transporting Resources from your overseas Territories and transporting Troops. Denying an enemy the sea lanes will not win you the war on its own, but it can cripple their Economy and certain Theaters, depending on the Situation. It can also deny them help from overseas Allies. \n\nConvoys travel the seas, even though you can not see them doing it. They can be intercepted along the way and are especially vulnerable when they are transporting Troops. Protecting them is necessary if you are somewhat reliant on sea routes. Their most prevalent threat are submarines, which can be dealt with using Destroyers or Light Cruisers. Convoys will try to escape the combat once they are intercepted. \n\nConvoys have some limited ability to defend themselves, but it usually is not enough to protect them when faced with actual warships."