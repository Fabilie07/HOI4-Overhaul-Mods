 NOM_trade.1.title:0 "[FROM.GetNameDefCap] wants to sign a Trade Deal"
 NOM_trade.1.desc:0 "Today, a diplomatic request from [FROM.GetNameDef] has reached our foreign ministry. They intend to expand their navy, and for those purposes, have sent a request to sign a Trade Deal with our nation that would allow them to commission various ships to be built in our dockyards. The [FROM.GetOldAdjective] Minister of Trade has sent a delegation to negotiate terms favorable to both sides. The question now is how we should respond to this proposal."
 NOM_trade.1.a:0 "Demand economic compensation"
 NOM_trade.1.b:0 "Propose resource shipments"
 NOM_trade.1.c:0 "Their goodwill is enough"
 NOM_trade.1.d:0 "We don't have any capacity to spare"
 NOM_trade.2.title:0 "[FROM.GetNameDefCap] demands economic compensation"
 NOM_trade.2.desc:0 "Word from our trade delegation is that [FROM.GetNameDef] is pushing us to give economic concessions in return for signing a Trade Deal. This has sparked debates, with some claiming that [FROM.GetNameDef] is treating us unfair and others reminding them that the needs of our navy must be met. Opinions on how to respond to their demands are split."
 NOM_trade.2.a:0 "Accept their demands"
 NOM_trade.2.b:0 "We will look elsewhere!"
 NOM_trade.3.title:0 "[FROM.GetNameDefCap] wants raw materials"
 NOM_trade.3.desc:0 "[FROM.GetNameDefCap] has proposed an exchange of raw materials for their signing of the Trade Deal. They envision our country providing them with critical resources, a good portion of which will go straight to the ships they are building for us. Our economists encourage an agreement to this arrangement."
 NOM_trade.3.a:0 "Provide the materials for the ships"
 NOM_trade.3.b:0 "Send rare metals"
 NOM_trade.3.c:0 "Our Chromium will be used by their welders"
 NOM_trade.3.d:0 "Provide rubber shipments"
 NOM_trade.4.title:0 "[FROM.GetNameDefCap] agrees to sign the Trade Deal"
 NOM_trade.4.desc:0 "Surprisingly, our [FROM.GetOldAdjective] negotiation partners have agreed to sign the Trade Deal without demanding serious compensation. They seem to be interested in continued positive relations rather than immediate benefit. Because of this, nothing is stopping the signing of the Deal."
 NOM_trade.4.a:0 "To longlasting relations!"
 NOM_trade.5.title:0 "Negotiations fail"
 NOM_trade.5.desc:0 "There has been very little interest by [FROM.GetNameDef] to enter a prolonged agreement regarding the building of ships for our nation. Our delegation was unable to come to terms with them, notifying us that there will be no Deal signed with [FROM.GetNameDef]."
 NOM_trade.5.a:0 "Too bad"
 NOM_trade.6.title:0 "[FROM.GetNameDefCap] signs the Deal"
 NOM_trade.6.desc:0 "It seems as though the people responsible for the Trade Deal in [FROM.GetNameDef] have agreed to the terms we negotiated. After some final details were worked out, both parties signed the necessary documents, entering into an official alliance concerning ship commissions."
 NOM_trade.6.a:0 "Wonderful!"
 NOM_trade.7.title:0 "[FROM.GetNameDefCap] refuses to sign the Deal"
 NOM_trade.7.desc:0 "After careful consideration, the delegation sent by [FROM.GetNameDef] has declared that the terms we proposed are to unfavorable for them. They will not be signing the Deal and are preparing to leave the country."
 NOM_trade.7.a:0 "It's their loss"
 NOM_trade.8.title:0 "[FROM.GetNameDefCap] withdraws from our Trade Deal"
 NOM_trade.8.desc:0 "This morning we received a telegram from [FROM.GetNameDef]. In it, they explained that their navy's goals have been met and that therefore, they will be withdrawing from the Trade Deal we had previously signed. Any ships that are in commission will still be built and paid for, but afterwards, our ship trade relations will end."
 NOM_trade.8.a:0 "Unfortunate"
 
 NOM_trade.10.title:0 "[FROM.GetNameDefCap] agrees to build the Ship"
 NOM_trade.10.desc:0 "[FROM.GetNameDefCap] has sent us a message letting us know that they have agreed to build a [nom_ship_title_loc] according to the specifications that were negotiated. We will be sent the ship once it is completed, and only minor changes and customizations are to be done in our own country's dockyards."
 NOM_trade.10.a:0 "Wonderful news!"
 NOM_trade.10.b:0 "We reconsidered the offer"
 NOM_trade.19.title:0 "[FROM.GetNameDefCap] refuses to build the Ship"
 NOM_trade.19.desc:0 "[FROM.GetNameDefCap] has sent us a message explaining that they do not have the naval facilities to spare to build a [nom_ship_title_loc] for us. Wether this is the truth or simply an excuse not to provide a potential rival with a vessel and knowledge to reproduce it is heavily discussed by the leaders of our navy."
 NOM_trade.19.a:0 "A shame"
 NOM_trade.11.title:0 "[FROM.GetNameDefCap] wants to be compensated"
 NOM_trade.11.desc:0 "Regarding our request for them to build a [nom_ship_title_loc], [FROM.GetNameDef] has informed us that they will build the ship only if significant economic concessions are made. Our top economists are unsure of how to respond to such demands."
 NOM_trade.11.a:0 "Accept their demands"
 NOM_trade.11.b:0 "Refuse"
 NOM_trade.13.title:0 "[FROM.GetNameDefCap] proposes a resource exchange"
 NOM_trade.13.desc:0 "After [FROM.GetNameDef] has received our request to build a [nom_ship_title_loc], they seem to have decided to negotiate a treaty that would allow them to use a portion of our country's raw materials in exchange for building the ship."
 NOM_trade.13.a:0 "Provide the materials for the ships"
 NOM_trade.13.b:0 "Send rare metals"
 NOM_trade.13.c:0 "Our Chromium will be used by their welders"
 NOM_trade.13.d:0 "Provide rubber shipments"
 NOM_trade.15.title:0 "[FROM.GetNameDefCap] wants us to build a Capital Ship"
 NOM_trade.15.desc:0 "A telegram has reached our Admiralty from [FROM.GetNameDef], asking us to build a [FROM.nom_ship_title_loc] for them. They are willing to pay for the ship's construction as well as a market-value percentage on top of that. However, the construction would still take up 4 dockyards that could otherwise be used by our own navy. The construction is projected to take [?FROM.nom_ship_trade_duration] days."
 NOM_trade.15.a:0 "Demand Economic Compensation"
 NOM_trade.15.b:0 "Demand Resources"
 NOM_trade.15.c:0 "A fair deal"
 NOM_trade.15.d:0 "We have no dockyards to spare"
 NOM_trade.16.title:0 "[FROM.GetNameDefCap] wants us to build a Ship"
 NOM_trade.16.desc:0 "A telegram has reached our Admiralty from [FROM.GetNameDef], asking us to build a [FROM.nom_ship_title_loc] for them. They are willing to pay for the ship's construction as well as a market-value percentage on top of that. However, the construction would still take up 2 dockyards that could otherwise be used by our own navy. The construction is projected to take [?FROM.nom_ship_trade_duration] days."
 NOM_trade.30.title:0 "A Capital Ship is finished"
 NOM_trade.30.desc:0 "We have finished the construction of a Capital Ship for a foreign country. It has left the docks en course to its new owner, and all payments have been finalized."
 NOM_trade.30.a:0 "A trade well done"
 NOM_trade.31.title:0 "A Screen Ship is finished"
 NOM_trade.31.desc:0 "We have finished the construction of a Screen Ship for a foreign country. It has left the docks en course to its new owner, and all payments have been finalized."
 
