 ship_torpedo_sub_1_short:0 "Torpedo Tubes I"
 ship_torpedo_sub_1_desc:0 "A basic set of torpedo tubes that can be reloaded from inside the submarine."
 ship_torpedo_sub_2:0 "6x 450mm Torpedo Tubes"
 ship_torpedo_sub_2_short:0 "Torpedo Tubes II"
 ship_torpedo_sub_2_desc:0 "A larger torpedo room allows more torpedo tubes to be mounted. It also provides slightly more living space for the crew."
 ship_torpedo_sub_3:0 "4x 533mm Torpedo Tubes"
 ship_torpedo_sub_3_short:0 "Torpedo Tubes III"
 ship_torpedo_sub_3_desc:0 "A set of larger torpedo tubes allows submarines to launch bigger torpedoes."
 ship_torpedo_sub_4:0 "6x 533mm Torpedo Tubes"
 ship_torpedo_sub_4_short:0 "Torpedo Tubes IV"
 ship_torpedo_sub_4_desc:0 "The addition of an electric loading ram allows torpedo tubes to be reloaded within minutes."
 sub_missile_launcher:0 "Submarine Missile Launcher"
 sub_missile_launcher_desc:0 "A submarine-mounted launcher for guided and ballistic missiles."
 slbm_launcher:0 "Submarine Nuclear Missile Launcher"
 slbm_launcher_desc:0 "A submarine-mounted launcher for nuclear ballistic missiles."
 ship_engine_sub_aip_1:0 "Air-Independent Propulsion"
 ship_engine_sub_aip_1_desc:0 "First iteration of the new engine types, allowing submarine to remain operational underwater for a longer time, at the cost of vastly increased fuel consumption and reduced ship range."
 ship_engine_sub_aip_2:0 "AIP-Diesel Combination Engine"
 ship_engine_sub_aip_2_desc:0 "New version of the air-independent propulsion systems, offering better performance at the lower fuel consumption."
 ship_engine_sub_aip_3:0 "High Speed Walter Engines"
 ship_engine_sub_aip_3_desc:0 "We have reached the pinnacle of what we think can be achieved with AIP Engines. This engine offers excellent speed, while at the same time retaining fuel consumption at acceptable levels."
 ship_anechoic_tile:0 "Anechoic Tiles"
 ship_anechoic_tile_desc:0 "Rubber tile coating that is designed to reduce the range at which ship can be detected by both passive and active sonar."
 ship_torpedo_sub_nuclear:0 "Nuclear Torpedo"
 ship_torpedo_sub_nuclear_desc:0 "Torpedoes that carry a nuclear warhead, providing a highly effective weapon against enemy ships, at the cost of higher risk for accidents."

 ship_anti_air_1:0 ".50 cal. MG"
 ship_anti_air_1_short:0 "Anti-Air I"
 ship_anti_air_1_desc:0 "A set of heavy machine guns provides a small amount of close-in defence against airplanes."
 ship_anti_air_2:0 "20mm AA"
 ship_anti_air_2_short:0 "Anti-Air II"
 ship_anti_air_2_desc:0 "A small automatic cannon throws a significantly larger shell, killing an attacking aircraft in a few hits."
 ship_anti_air_3:0 "37mm AA"
 ship_anti_air_3_short:0 "Anti-Air III"
 ship_anti_air_3_desc:0 "Previous calibers of guns have proven too light to reliably kill an attacking airplane before they can release their ordinance. A larger shell requires a bigger gun, but has a significantly higher chance of destroying the target when they actually hit."
 ship_anti_air_4:0 "40mm Quad AA"
 ship_anti_air_4_short:0 "Anti-Air IV"
 ship_anti_air_4_desc:0 "The latest model of anti-air guns features a powered mount to be able to track fast-flying targets and an advanced director system to coordinate the fire of several gun positions against a single target."

 ship_mine_layer_1:0 "Minelaying Rails"
 ship_mine_layer_1_desc:0 "Modifications for a surface ship to carry and deploy naval mines."
 ship_mine_sweeper_1:0 "Minesweeping Gear"
 ship_mine_sweeper_1_desc:0 "Gear to deploy the various sweeping equipments."
 ship_mine_layer_sub:0 "Minelaying Tubes"
 ship_mine_layer_sub_desc:0 "Modifications to the hull of a submarine, allowing it to deploy a number of mines."

 ship_depth_charge_1:0 "Depth Charge Rails"
 ship_depth_charge_1_short:0 "Depth Charge I"
 ship_depth_charge_1_desc:0 "A simple set of rails allows depth charges to be rolled off the stern of the ship when the ship drives over the submerged target."
 ship_depth_charge_2:0 "Depth Charge Thrower"
 ship_depth_charge_2_short:0 "Depth Charge II"
 ship_depth_charge_2_desc:0 "Using a small explosive charge, this device throws a depth charge quite some distance, allowing a single ship to drop a pattern of depth charges across a larger area."
 ship_depth_charge_3:0 "Anti-submarine Mortar"
 ship_depth_charge_3_short:0 "Depth Charge III"
 ship_depth_charge_3_desc:0 "A projector for a smaller depth charge with a contact fuze, allowing the ship to engage a target without breaking sonar contact."
 ship_depth_charge_4:0 "Advanced Anti-submarine Mortar"
 ship_depth_charge_4_short:0 "Depth Charge IV"
 ship_depth_charge_4_desc:0 "An evolution of the previous model, this mortar can fire a significantly larger charge over a longer distance."

 ship_sub_snorkel_1:0 "Basic Schnorkel"
 ship_sub_snorkel_1_desc:0 "A device that allows the submarine to run its main engines underwater, enabling it to recharge its batteries without exposing itself to attack by surfacing."
 ship_sub_snorkel_2:0 "Improved Schnorkel"
 ship_sub_snorkel_2_desc:0 "Improvements to the design of the schnorkel reduce the problems when using the main engines in heavy seas while reducing the probability of the schnorkel being detected on radar."

 ship_airplane_launcher_1:0 "Floatplane Catapult"
 ship_airplane_launcher_1_desc:0 "A simple airplane launcher propels a small scout plane into the air."
 ship_airplane_launcher_2:0 "Improved Floatplane Catapult"
 ship_airplane_launcher_2_desc:0 "An improved launch mechanism that allows the ship to launch a larger plane with greater range and speed."
 
 ship_seaplane_tender_1:0 "Seaplane Tender"
 ship_seaplane_tender_1_desc:0 "Equipment for refueling and recovering seaplanes, keeping them operational with less reliance on shore-based resupply."
 ship_seaplane_tender_2:0 "Improved Seaplane Tender"
 ship_seaplane_tender_2_desc:0 "While the earliest seaplane tenders were converted merchant ships, newer types are purpose-built and have greatly improved seaplane support capabilities."

 ship_plane_elevator_1:0 "Single Aircraft Elevator"
 ship_plane_elevator_1_desc:0 "Elevators transport Aircraft between the Hangar and the Flight Deck. The more elevators a carrier has, the more planes it can move at once."
 ship_plane_elevator_2:0 "Double Aircraft Elevator"
 ship_plane_elevator_2_desc:0 "Elevators transport Aircraft between the Hangar and the Flight Deck. The more elevators a carrier has, the more planes it can move at once."
 ship_plane_elevator_3:0 "Triple Aircraft Elevator"
 ship_plane_elevator_3_desc:0 "Elevators transport Aircraft between the Hangar and the Flight Deck. The more elevators a carrier has, the more planes it can move at once."
 
 ship_carrier_hangar_none:0 "Deck Storage"
 ship_carrier_hangar_none_desc:0 "This Carrier has no Storage compartment, all Planes are parked on the Deck."
 ship_carrier_hangar_double_deck:0 "Double Deck"
 ship_carrier_hangar_double_deck_desc:0 "This Carrier's Hangar is directly connected to a second flight deck. Aircraft can launch faster."
 ship_carrier_hangar_triple_deck:0 "Triple Deck"
 ship_carrier_hangar_triple_deck_desc:0 "Three Flight Decks are stacked ontop of each other, allowing planes to be quickly launched from their storage hangars."
 ship_carrier_hangar_small:0 "Small Hangar"
 ship_carrier_hangar_small_desc:0 "A Hangar is used, from which Aircraft are lifted onto the deck to take off."
 ship_carrier_hangar_medium:0 "Medium Hangar"
 ship_carrier_hangar_medium_desc:0 "More Aircraft are stored, either by increasing the Hangar Size or adding another underneath it."
 ship_carrier_hangar_large:0 "Large Hangar"
 ship_carrier_hangar_large_desc:0 "Two or three Hangars are placed ontop of each other. A large amount of aircraft can be carried, but operations are complex and dangerous."
 
 ship_carrier_superstructure_0:0 "Early Tower"
 ship_carrier_superstructure_0_desc:0 "Early Carriers had very little space for Superstructures. Most only had a small tower to direct aircraft."
 ship_carrier_superstructure_1:0 "Carrier Tower I"
 ship_carrier_superstructure_1_desc:0 "A Superstructure from which Planes and Crew can be directed."
 ship_carrier_superstructure_2:0 "Carrier Tower II"
 ship_carrier_superstructure_2_desc:0 "More visibility and communication allows Carriers to communicate with their pilots while they are in the air."
 ship_carrier_superstructure_3:0 "Carrier Tower III"
 ship_carrier_superstructure_3_desc:0 "Dedicated Partners are keeping contact with the Air Wing at all times."


 ship_sonar_1:0 "Hydrophones"
 ship_sonar_1_desc:0 "A simple set of hydrophones to track a submerged target by the sound it makes."
 ship_sonar_2:0 "Active Sonar"
 ship_sonar_2_desc:0 "An active noise emitter that sends a short 'ping' into the water, then listens for the echo from a submerged submarine hull."
 ship_sonar_3:0 "Improved Sonar"
 ship_sonar_3_desc:0 "Capable of tracking submarines at greater ranges."
 ship_sonar_4:0 "Advanced Sonar"
 ship_sonar_4_desc:0 "Covering more angles and filtering unwanted noise makes this sonar very capable of spotting and tracking submarines."

 ship_radar_1:0 "Decimetric Naval Search Radar"
 ship_radar_1_short:0 "Radar I"
 ship_radar_1_desc:0 "A simple radar set that operates in the 50 cm wavelength range allows the detection of surface ships even in bad weather at a range of more than 10 kilometers."
 ship_radar_2:0 "Improved Decimetric Naval Search Radar"
 ship_radar_2_short:0 "Radar II"
 ship_radar_2_desc:0 "An improved radar set working in the 30cm wavelength range can accurately measure the range and bearing of even a small ship at ranges of over 25 kilometers."
 ship_radar_3:0 "Centrimetric Gunnery Radar"
 ship_radar_3_short:0 "Radar III"
 ship_radar_3_desc:0 "Equipped with cavity magnetrons, this radar set allows not only the detection of very small targets but even detecting the splashes of shells. This allows for true blind-fire against targets, even at night or in bad weather."
 ship_radar_4:0 "Integrated Fire Control Radar"
 ship_radar_4_short:0 "Radar IV"
 ship_radar_4_desc:0 "Working in the centimeter wavelength range, this radar set is fully integrated into the ships gunnery control and allows highly accurate gunfire control in all weather conditions."

 ship_smoke_generator:0 "Smoke Mixture Injection"
 ship_smoke_generator_short:0 "Smoke Generator"
 ship_smoke_generator_desc:0 "Adding certain chemicals in the engine and exhaust ducts can produce thick, white smoke that covers a retreat."
 ship_extra_fuel_tank:0 "Extra Fuel Tanks"
 ship_extra_fuel_tank_desc:0 "Extended fuel storage allows greater operational range."
 ship_extra_fuel_tank_2:0 "Extra Fuel Tanks II"
 ship_extra_fuel_tank_2_desc:0 "Extended fuel storage allows greater operational range."

 ship_arresting_cable:0 "Arresting Cable"
 ship_arresting_cable_desc:0 "A metal cable can be caught by hooks on the tailend of carrier aircraft, slowing them down to a stop. Significantly decreases risk while landing."
 ship_catapult:0 "Carrier Catapult"
 ship_catapult_desc:0 "An enlarged version of the pressure catapults found on cruisers and battleships. Allows heavier planes to takeoff from aircraft carriers."
 
 ship_very_light_battery_sub:0 "90 mm Cannon"
 ship_very_light_battery_sub_desc:0 "A rotating cannon of small caliber, capable of sinking unarmored vessels."
 ship_light_battery_sub:0 "10.5 cm Cannon"
 ship_light_battery_sub_desc:0 "A top-mounted cannon, capable of sinking small vessels."
 ship_medium_battery_sub:0 "2x 20.3 cm Cannon"
 ship_medium_battery_sub_desc:0 "A powerful set of cannons capable of damaging armored ships and land targets."
 ship_airplane_launcher_sub:0 "Internal Plane Hangar"
 ship_airplane_launcher_sub_desc:0 "This submarine carries multiple seaplanes to provide reconnaissance, support and to strike targets in the vicinity of the coast."

 sub_ballast_tank:0 "Ballast Tank"
 sub_ballast_tank_desc:0 "Extra Ballast Tanks increase the level of control over the submarines depth, making it harder to target."
 sub_watertight_compartment:0 "Watertight Compartment"
 sub_watertight_compartment_desc:0 "Subdividing a submarine increases its chances of staying afloat when the hull is breached."
 sub_advanced_reload:0 "Assisted Tube Reloading"
 sub_advanced_reload_desc:0 "Automated drainage and ramming processes shorten the time it takes to reload the torpedo tubes on a submarine."

 ship_sub_sonar_1:0 "Underwater Hydrophone I"
 ship_sub_sonar_1_desc:0 "This hydrophone is very sensitive, but can only be used by a submarine due to the noise created by the water surface."
 ship_sub_sonar_2:0 "Underwater Hydrophone II"
 ship_sub_sonar_2_desc:0 "Further microphones are added to increase the hydrophone's accuracy."
 ship_sub_sonar_3:0 "Underwater Hydrophone III"
 ship_sub_sonar_3_desc:0 "The hydrophone is placed in a bulb on the bottom of the ship, eliminating most blind spots."
 ship_sub_sonar_4:0 "Underwater Hydrophone IV"
 ship_sub_sonar_4_desc:0 "This device combines both active and passive sonar to detect every vessel in a large radius."
 ship_sub_radar_1:0 "Passive Radar I"
 ship_sub_radar_1_desc:0 "This antenna can detect radar frequencies, warning submarines that a ship or aircraft carrying radar is nearby."
 ship_sub_radar_2:0 "Passive Radar II"
 ship_sub_radar_2_desc:0 "A more sensitive antenna increases the range at which enemy radars are detected, as well as more accurate bearing information."
 sub_periscope_1:0 "Periscope I"
 sub_periscope_1_desc:0 "Using two mirrors, light can be redirected into a submarine that is submerged, allowing it to monitor its surroundings."
 sub_periscope_2:0 "Periscope II"
 sub_periscope_2_desc:0 "Clearer lenses as well as a camouflaged periscope head increase a submarines vision while keeping it hidden."
 sub_torpedo_computer_1:0 "Torpedo Computer I"
 sub_torpedo_computer_1_desc:0 "A mechanical device that creates a targeting solution based on the target's speed, range and bearing."
 sub_torpedo_computer_2:0 "Torpedo Computer II"
 sub_torpedo_computer_2_desc:0 "This machine uses more factors like the submarine's speed, water temperature and movement to more accurately fire torpedos."
 sub_torpedo_computer_3:0 "Torpedo Computer III"
 sub_torpedo_computer_3_desc:0 "Upgrading the computer to a digital device and automating a lot of target information improves accuracy even further."
 sub_batteries_1:0 "Batteries I"
 sub_batteries_1_desc:0 "Batteries are crucial to continue operating while submerged. More power storage means extended engine usage without needing to resurface."
 sub_batteries_2:0 "Batteries II"
 sub_batteries_2_desc:0 "Batteries are crucial to continue operating while submerged. More power storage means extended engine usage without needing to resurface."
 sub_batteries_3:0 "Batteries III"
 sub_batteries_3_desc:0 "Batteries are crucial to continue operating while submerged. More power storage means extended engine usage without needing to resurface."

 #Engines
 light_ship_engine_0:0 "26,000 Shp Engine"
 light_ship_engine_0_short:0 "Light Engine 0"
 light_ship_engine_0_desc:0 "An outdated steam turbine engine that is cheap but underpowered."
 light_ship_engine_1:0 "35,000 Shp Engine"
 light_ship_engine_1_short:0 "Light Engine I"
 light_ship_engine_1_desc:0 "A small set of steam turbines can propell a small ship at great speed or power a larger ship at slower speeds."
 light_ship_engine_2:0 "40,000 Shp Engine"
 light_ship_engine_2_short:0 "Light Engine II"
 light_ship_engine_2_desc:0 "Using high-pressure boilers, the same weight and space of machinery can produce a higher output."
 light_ship_engine_3:0 "45,000 Shp Engine"
 light_ship_engine_3_short:0 "Light Engine III"
 light_ship_engine_3_desc:0 "New developments in materials allow for much higher steam pressure and thus greater power output."
 light_ship_engine_4:0 "50,000 Shp Engine"
 light_ship_engine_4_short:0 "Light Engine IV"
 light_ship_engine_4_desc:0 "Improved engine layouts and turbine gearing allow higher efficiency for the same amount of weight."

 sub_ship_engine_1:0 "1,000 Shp Engine"
 sub_ship_engine_1_short:0 "Submarine Engine I"
 sub_ship_engine_1_desc:0 "A combination of diesel and electric engines allow a submarine to operate underwater at a reasonable speed."
 sub_ship_engine_2:0 "2,000 Shp Engine"
 sub_ship_engine_2_short:0 "Submarine Engine II"
 sub_ship_engine_2_desc:0 "A more powerful diesel engine gives the submarine the ability to sprint into position when it detects a target."
 sub_ship_engine_3:0 "3,000 Shp Engine"
 sub_ship_engine_3_short:0 "Submarine Engine III"
 sub_ship_engine_3_desc:0 "New materials and production methods allow for the creation of engines that can run longer at full power."
 sub_ship_engine_4:0 "4,000 Shp Engine"
 sub_ship_engine_4_short:0 "Submarine Engine IV"
 sub_ship_engine_4_desc:1 "Advanced engines with turbochargers are able to run much faster for a brief period, either to chase targets or to recharge the batteries quicker."
 sub_ship_nuclear_engine_1: "Nuclear Submarine Reactor"
 sub_ship_nuclear_engine_1_short: "Submarine Reactor"
 sub_ship_nuclear_engine_1_desc: "A small reactor that provides nuclear propulsion for submarines, ensuring extended underwater endurance and efficient operation for modern naval fleets"

 cruiser_ship_engine_0:0 "46,000 Shp Engine"
 cruiser_ship_engine_0_short:0 "Cruiser Engine 0"
 cruiser_ship_engine_0_desc:0 "An outdated steam turbine engine that is cheap but underpowered."
 cruiser_ship_engine_1:0 "60,000 Shp Engine"
 cruiser_ship_engine_1_short:0 "Cruiser Engine I"
 cruiser_ship_engine_1_desc:0 "A basic set of boilers providing steam to an ungeared turbine."
 cruiser_ship_engine_2:0 "70,000 Shp Engine"
 cruiser_ship_engine_2_short:0 "Cruiser Engine II"
 cruiser_ship_engine_2_desc:0 "A steam turbine equipped with gearing is dramatically more efficient, allowing the extra weight to be used for additional power."
 cruiser_ship_engine_3:0 "80,000 Shp Engine"
 cruiser_ship_engine_3_short:0 "Cruiser Engine III"
 cruiser_ship_engine_3_desc:0 "Improved boiler arrangements give higher steam pressure for more power."
 cruiser_ship_engine_4:0 "90,000 Shp Engine"
 cruiser_ship_engine_4_short:0 "Cruiser Engine IV"
 cruiser_ship_engine_4_desc:0 "Advanced materials make this engine able to run much longer at high load."

 heavy_ship_engine_0:0 "28,000 Shp Engine"
 heavy_ship_engine_0_short:0 "Heavy Engine 0"
 heavy_ship_engine_0_desc:0 "An outdated steam turbine engine that is cheap but underpowered."
 heavy_ship_engine_1:0 "45,000 Shp Engine"
 heavy_ship_engine_1_short:0 "Heavy Engine I"
 heavy_ship_engine_1_desc:0 "Intended to free up weight for guns and armor, this engine was never designed to give particularly high speed."
 heavy_ship_engine_2:0 "90,000 Shp Engine"
 heavy_ship_engine_2_short:0 "Heavy Engine II"
 heavy_ship_engine_2_desc:0 "Dramatically more powerful than previous designs, this engine is intended to give a heavy ship a comfortable speed margin over older models."
 heavy_ship_engine_3:0 "150,000 Shp Engine"
 heavy_ship_engine_3_short:0 "Heavy Engine III"
 heavy_ship_engine_3_desc:0 "As guns and armor grow in weight, this engine was designed to allow for higher speeds to chase down fleeing enemies or keep the range open against superior enemies."
 heavy_ship_engine_4:0 "210,000 Shp Engine"
 heavy_ship_engine_4_short:0 "Heavy Engine IV"
 heavy_ship_engine_4_desc:0 "Designed with new materials and improved boiler design, this powerplant is intended to allow a modern battleship to keep up with fast carriers and cruisers."
 heavy_ship_nuclear_engine_1: "Nuclear Heavy Ship Reactor"
 heavy_ship_nuclear_engine_1_short: "Heavy Ship Reactor"
 heavy_ship_nuclear_engine_1_desc: "A powerful nuclear reactor, capable of powering the heaviest of ships without need for refuelling."

 carrier_ship_engine_0:0 "9,000 Shp Engine"
 carrier_ship_engine_0_short:0 "Carrier Engine 0"
 carrier_ship_engine_0_desc:0 "A diesel engine meant for escort carriers."
 carrier_ship_engine_1:0 "50,000 Shp Engine"
 carrier_ship_engine_1_short:0 "Carrier Engine I"
 carrier_ship_engine_1_desc:0 "A basic set of engines allow a mid-sized carrier to reach the speeds necessary for the safe operation of aircraft."
 carrier_ship_engine_2:0 "120,000 Shp Engine"
 carrier_ship_engine_2_short:0 "Carrier Engine II"
 carrier_ship_engine_2_desc:0 "This new powerplant is designed to allow a carrier to outpace most older cruisers and some destroyers, allowing it to evade enemy surface forces."
 carrier_ship_engine_3:0 "150,000 Shp Engine"
 carrier_ship_engine_3_short:0 "Carrier Engine III"
 carrier_ship_engine_3_desc:0 "An engine designed to allow even large carriers to move at very high speeds."
 carrier_ship_engine_4:0 "210,000 Shp Engine"
 carrier_ship_engine_4_short:0 "Carrier Engine IV"
 carrier_ship_engine_4_desc:0 "This powerplant was designed to equip a modern 'fast carrier' intended to function as the centerpiece of a carrier group."
 carrier_ship_nuclear_engine_1: "Nuclear Carrier Reactor"
 carrier_ship_nuclear_engine_1_short: "Carrier Reactor"
 carrier_ship_nuclear_engine_1_desc: "A powerful nuclear reactor, capable of powering colossal carriers without need them needing to refuel."

 funnel_1x:0 "1 Funnel"
 funnel_1x_desc:0 "A single funnel allows for easier installation of systems meant to reduce smoke visibility."
 funnel_2x:0 "2 Funnels"
 funnel_2x_desc:0 "Two funnels offer a balance between engine efficiency and smoke generation."
 funnel_3x:0 "3 Funnels"
 funnel_3x_desc:0 "Three funnels allow a lot of exhaust smoke to be released, improving engine performance."
 funnel_4x:0 "4 Funnels"
 funnel_4x_desc:0 "Mostly outdated due to improvements in funnel design, but four funnels offer the greatest efficiency for ship engines."

 #Armor
 light_ship_armor_1:0 "10mm Belt"
 light_ship_armor_1_short:0 "Light Armor I"
 light_ship_armor_1_desc:0 "The minimum of protection for any kind of warship."
 light_ship_armor_2:0 "15mm Belt"
 light_ship_armor_2_short:0 "Light Armor II"
 light_ship_armor_2_desc:0 "Enough armor to stop shrapnel and small explosions."
 light_ship_armor_3:0 "20mm Belt"
 light_ship_armor_3_short:0 "Light Armor III"
 light_ship_armor_3_desc:0 "Increased protection from near-misses."
 light_ship_armor_4:0 "25mm Belt"
 light_ship_armor_4_short:0 "Light Armor IV"
 light_ship_armor_4_desc:0 "This armor can actually stop small-caliber high explosive shells."

 medium_ship_armor_1:0 "50mm Belt"
 medium_ship_armor_1_short:0 "Medium Armor I"
 medium_ship_armor_1_desc:0 "The minimum of protection for light cruisers."
 medium_ship_armor_2:0 "100mm Belt"
 medium_ship_armor_2_short:0 "Medium Armor II"
 medium_ship_armor_2_desc:0 "An increase in protection against smaller calibers."
 medium_ship_armor_3:0 "125mm Belt"
 medium_ship_armor_3_short:0 "Medium Armor III"
 medium_ship_armor_3_desc:0 "This armor offers good protection."
 medium_ship_armor_4:0 "150mm Belt"
 medium_ship_armor_4_short:0 "Medium Armor IV"
 medium_ship_armor_4_desc:0 "Thicker cruiser armor that can deflect even larger shells."

 ship_armor_bc_1:0 "203mm Belt"
 ship_armor_bc_1_short:0 "Battlecruiser Armor I"
 ship_armor_bc_1_desc:0 "Thin Armor that can withstand cruiser-caliber shells."
 ship_armor_bc_2:0 "305mm Belt"
 ship_armor_bc_2_short:0 "Battlecruiser Armor II"
 ship_armor_bc_2_desc:0 "Adequate protection for large warships."
 ship_armor_bc_3:0 "356mm Belt"
 ship_armor_bc_3_short:0 "Battlecruiser Armor III"
 ship_armor_bc_3_desc:0 "This armor elevates a ship from a battlecruiser into the realm of a fast battleship."

 ship_armor_bb_1:0 "356mm Belt"
 ship_armor_bb_1_short:0 "Battleship Armor I"
 ship_armor_bb_1_desc:0 "A thick armored belt that is designed to stop the shells of capital ships at long ranges."
 ship_armor_bb_2:0 "356mm Extended"
 ship_armor_bb_2_short:0 "Battleship Armor II"
 ship_armor_bb_2_desc:0 "Better armor quality and dispersion allows for an increase in protection."
 ship_armor_bb_3:0 "380mm Belt"
 ship_armor_bb_3_short:0 "Battleship Armor III"
 ship_armor_bb_3_desc:0 "With increased belt thickness there is more protection, but also weight as well."
 ship_armor_bb_4:0 "380mm Extended"
 ship_armor_bb_4_short:0 "Battleship Armor IV"
 ship_armor_bb_4_desc:0 "Excellent protection against even large-caliber shells."

 super_heavy_ship_armor:0 "406mm Belt"
 super_heavy_ship_armor_short:0 "Super Heavy Armor"
 super_heavy_ship_armor_desc:0 "The thickest feasible armor plating, meant to make a ship practically immune to its contemporaries."

 light_ship_deck_1:0 "10mm Deck"
 light_ship_deck_1_short:0 "Light Deck I"
 light_ship_deck_1_desc:0 "A small amount of protection for destroyers."
 light_ship_deck_2:0 "15mm Deck"
 light_ship_deck_2_short:0 "Light Deck II"
 light_ship_deck_2_desc:0 "Though it may not stop direct hits, this deck armor does offer protection."
 medium_ship_deck_1:0 "30mm Deck"
 medium_ship_deck_1_short:0 "Medium Deck I"
 medium_ship_deck_1_desc:0 "Enough armor to stop small-caliber weaponry."
 medium_ship_deck_2:0 "60mm Deck"
 medium_ship_deck_2_short:0 "Medium Deck II"
 medium_ship_deck_2_desc:0 "This armor can reduce the effect of plunging fire."
 heavy_ship_deck_1:0 "100mm Deck"
 heavy_ship_deck_1_short:0 "Heavy Deck I"
 heavy_ship_deck_1_desc:0 "Heavy Deck armor to protect against bombs and plunging fire."
 heavy_ship_deck_2:0 "150mm Deck"
 heavy_ship_deck_2_short:0 "Heavy Deck II"
 heavy_ship_deck_2_desc:0 "Thick armor to stop the shells of capital ships and large bombs."
 
 ship_armor_ice_carrier_deck_1:0 "Pykrete Runway Reinforcements"
 ship_armor_ice_carrier_deck_1_desc:0 "Additional construction reinforcements, ensuring stronger and more resilient construction, while also providing better resistance against the elements."
 ship_armor_ice_carrier_deck_2:0 "Steel-Reinforced Pykrete Runway"
 ship_armor_ice_carrier_deck_2_desc: "Steel-Reinforced Pykrete provides sturdier construction, capable of withstanding more damage, while offering better insulation."
 ship_armor_ice_carrier_deck_3:0 "Ice-Composite Runway"
 ship_armor_ice_carrier_deck_3_desc:0 "Materials and methods used offer the best structure resillience and reducing the impact of weather on the ship operations."

 ship_citadel_1:0 "Incremental Armor Scheme"
 ship_citadel_1_desc:0 "Armor is thickest along the midsection and slowly gets weaker towards the bow and stern."
 ship_citadel_2:0 "Light Turtleback"
 ship_citadel_2_desc:0 "Angled Plates behind the Belt Armor deflect shallow penetrations upwards."
 ship_citadel_3:0 "All or Nothing Armor"
 ship_citadel_3_desc:0 "Armor is reduced to minimal protection except for the most crucial areas, allowing more weight to be allocated there."
 ship_citadel_4:0 "Incremental Armor Scheme"
 ship_citadel_4_desc:0 "Armor is thickest along the midsection and slowly gets weaker towards the bow and stern."
 ship_citadel_5:0 "Turtleback Armor"
 ship_citadel_5_desc:0 "Angled Plates behind the Belt Armor deflect shallow penetrations upwards."
 ship_citadel_6:0 "All-or-nothing Armor"
 ship_citadel_6_desc:0 "Armor is reduced to minimal protection except for the most crucial areas, allowing more weight to be allocated there."

 torpedo_protection_1:0 "Torpedo Nets"
 torpedo_protection_1_short:0 "Torpedo Protection I"
 torpedo_protection_1_desc:0 "Nets on swinging crane arms can be deployed to the sides of the ship, catching or prematurely detonating enemy torpedos."
 torpedo_protection_2:0 "Torpedo Belt"
 torpedo_protection_2_short:0 "Torpedo Protection II"
 torpedo_protection_2_desc:0 "An extra section is added to the lower hull sides to stop torpedo detonations from breaching the hull."
 torpedo_protection_3:0 "Double Hull Bottom"
 torpedo_protection_3_short:0 "Torpedo Protection III"
 torpedo_protection_3_desc:0 "Adding a small room underneath the ship increases its chances of surviving a torpedo or mine hit."
 torpedo_protection_4:0 "Advanced Torpedo Belt"
 torpedo_protection_4_short:0 "Torpedo Protection IV"
 torpedo_protection_4_desc:0 "Thicker Torpedo Belts can stop larger warheads."

 water_pump:0 "Water Pumps"
 water_pump_short:0 "Damage Control I"
 water_pump_desc:0 "Powerful pumps can slowly remove water in the not fully flooded sections of the ship."
 dc_lockers:0 "Damage Control Lockers"
 dc_lockers_short:0 "Damage Control II"
 dc_lockers_desc:0 "Dispersing fire hydrants and other equipment in the ship allows every sailor to perform emergency damage control."
 dc_control_room:0 "Damage Control Room"
 dc_control_room_short:0 "Damage Control III"
 dc_control_room_desc:0 "A centralized damage control room can coordinate efforts to keep the ship afloat and send out damage control parties."
 dc_advanced_automatic:0 "Automated Damage Control Systems"
 dc_advanced_automatic_short:0 "Damage Control IV"
 dc_advanced_automatic_desc:0 "Automatic Fire Extinguishers and Warning Systems for hull breaches can greatly improve damage control efforts."

######### Ammunition

 cannon_high_explosive:0 "HE Shell Focus"
 cannon_high_explosive_short:0 "HE"
 cannon_high_explosive_desc:0 "The ship carries a large complement of high explosive rounds, which detonate on impact."
 cannon_armor_piercing:0 "AP Shell Focus"
 cannon_armor_piercing_short:0 "AP"
 cannon_armor_piercing_desc:0 "The ship carries a large complement of armor piercing rounds, which detonate after penetrating enemy armor."
 cannon_semi_armor_piercing:0 "SAP Shell Focus"
 cannon_semi_armor_piercing_short:0 "SAP"
 cannon_semi_armor_piercing_desc:0 "The ship carries a large complement of semi armor piercing rounds, which punch through armor or detonate if they are incapable of doing so."
 cannon_variable_time:0 "HE-VT"
 cannon_variable_time_desc:0 "Using a radar fuse allows shells to detonate when in close proximity to another object. On ships, this is used to fire at aircraft with extreme precision."
 cannon_beehive:0 "Beehive"
 cannon_beehive_desc:0 "Timed fragmentation shells fired from large-caliber guns detonate in front of incoming aircraft and shower them with small fragments."

 torpedo_ammo:0 "Torpedos with Contact Fuses"
 torpedo_ammo_short:0 "Torpedo Ammo I"
 torpedo_ammo_desc:0 "Contact fuse torpedos detonate when hitting the side of a ship."
 torpedo_ammo_2:0 "Torpedos with Magnetic Fuses"
 torpedo_ammo_2_short:0 "Torpedo Ammo II"
 torpedo_ammo_2_desc:0 "Contact fuse torpedos detonate when beneath a ship, breaking its keel."
 torpedo_ammo_3:0 "Electric Torpedos"
 torpedo_ammo_3_short:0 "Torpedo Ammo III"
 torpedo_ammo_3_desc:0 "Electric engines produce no bubble trail and less sound than the typical combustion engines used in torpedos, making them far harder to spot."

 oxygen_torpedo_ammo:0 "Pure-Oxygen Torpedos"
 oxygen_torpedo_ammo_desc:0 "Using Pure Oxygen instead of Air for the internal combustion engines has several advantages such as range and visibility. However, it is more volatile as well."

 plane_ammo:0 "Safe Ordenance Stowage"
 plane_ammo_short:0 "Plane Ammo"
 plane_ammo_desc:0 "Bombs, Rockets and Torpedos for use on aircraft are highly flammable and explosive, posing a major risk for the carrier they are stored on. Somewhat mitigating that risk is crucial for surviving enemy attacks."


