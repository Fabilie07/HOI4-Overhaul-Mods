l_english:

 NAVAL_TITLE_AUXILIARY:0 "AUXILIARY" 
 auxiliary_desc:0 "Auxiliary ships fulfill numerous supplementary roles. When used correctly, they can be a significant Force Multiplier."

 basic_cruiser_armor_scheme:0 "Basic Light Armor"
 basic_cruiser_armor_scheme_desc:0 "All modern ships are constructed with Metal Hulls, but additional protection can improve the survivability of even the lightest ships."
 improved_cruiser_armor_scheme:0 "Improved Light Armor"
 improved_cruiser_armor_scheme_desc:0 "New protection schemes are developed to combat modern threats."
 advanced_cruiser_armor_scheme:0 "Advanced Light Armor"
 advanced_cruiser_armor_scheme_desc:0 "Thicker Armor offers better protection, increasing the chance of ships returning afloat."
 
 basic_heavy_armor_scheme:0 "Basic Heavy Armor"
 basic_heavy_armor_scheme_desc:0 "Large Capital Ships need to be appropriatly armored to withstand hits at long ranges."
 improved_heavy_armor_scheme:0 "Improved Heavy Armor"
 improved_heavy_armor_scheme_desc:0 "The All-or-Nothing Armor Scheme protects the most important internals and nothing more."
 advanced_heavy_armor_scheme:0 "Advanced Heavy Armor"
 advanced_heavy_armor_scheme_desc:0 "With Aircraft becoming a larger threat, Deck Armor has to be improved drastically."

 advanced_sonar:0 "Improved Sonar"
 advanced_sonar_desc:0 "Fine-tuning and filtering of sonar noise enhances the technologies accuracy and sensitivity."
 modern_sonar:0 "Modern Sonar"
 modern_sonar_desc:0 "This Sonar has an enlarged search area capable of detecting submarines at any bearing and depth."

 ship_range_improvements:0 "Larger Fuel Tanks"
 ship_range_improvements_desc:0 "Smarter allocation of internal space allows for greater range."
 ship_range_improvements2:0 "Improved Fuel Tanks"
 ship_range_improvements2_desc:0 "Smarter allocation of internal space allows for greater range."

 early_ship_hull_cruiser:0 "$ship_hull_cruiser_1$"
 early_ship_hull_cruiser_desc:0 "$ship_hull_cruiser_1_desc$"
 early_ship_hull_heavy:0 "$ship_hull_heavy_1$"
 early_ship_hull_heavy_desc:0 "$ship_hull_heavy_1_desc$"
 basic_ship_hull_carrier:0 "$ship_hull_carrier_1$"
 basic_ship_hull_carrier_desc:0 "$ship_hull_carrier_1_desc$"
 
 
 naval_engineering:0 "Naval Engineering I"
 naval_engineering_desc:0 "Improved welding techniques and the usage of large cranes speed up the Production and Modification of ships."
 naval_engineering2:0 "Naval Engineering II"
 naval_engineering2_desc:0 "Modern Welding improves the speed at which ships are built. Drydocks, both floating and stationary, speed up repairs of damaged ships."


 basic_shells:0 "Improved Shells"
 basic_shells_desc:0 "Shells with better flight characteristics retain a lot of penetrating power even at long ranges."
 improved_shells:0 "Advanced Shells"
 improved_shells_desc:0 "Caps can increase the penetration at higher angles, increasing the penetrating power especially against the lightly armored decks of enemy ships."
 
 modern_dp_light_battery:0 "Modern Dual-Purpose Battery"
 modern_dp_light_battery_desc:0 "A high angle allows these guns to engage aircraft coming on from straight above."
 latewar_dp_light_battery:0 "Late-War Dual-Purpose Battery"
 latewar_dp_light_battery_desc:0 "Guns designed with larger caliber, higher velocity and proximity fuzed shells in mind are potent against both surface and air threats."
 modern_light_battery:0 "Modern Light Battery"
 modern_light_battery_desc:0 "Higher Velocity and Auto-Loaders improve the lethality of these guns against enemy screens and transports."
 modern_heavy_battery:0 "Modern Heavy Battery"
 modern_heavy_battery_desc:0 "Powerful guns using modern reloading systems and super-heavy shells can easily take out enemy capital ships."
 
 ship_based_sam:0 "Basic Ship-Based SAMs"
 ship_based_sam_desc:0 "Surface-to-Air Missiles are designed to destroy enemy aircraft before they enter the regular AA battery's range."
 ship_based_sam2:0 "Improved Ship-Based SAMs"
 ship_based_sam2_desc:0 "Independent Tracking and improved thrusters increase the range and lethality of Surface-to-Air Missiles."
 ship_based_missile:0 "Basic Anti-Ship Missile"
 ship_based_missile_desc:0 "The development of Ship-to-Ship Missiles was controversial due to their lesser range when compared to aircraft, but first combat usage quickly dispelled all doubts and ensured that Missiles were the future of Surface Warfare."
 
 anti_submarine_missile:0 "Anti-Submarine Missiles"
 anti_submarine_missile_desc:0 "Guided Rockets and Torpedos are used to accurately destroy submarines from above."
 modern_sonar2:0 "Cold-War Sonar"
 modern_sonar2_desc:0 "Active Sonar is becoming much more precise and versatile, making it impossible to hide under water."
 modern_ship_radar:0 "Cold-War Radar"
 modern_ship_radar_desc:0 "Accurate Tracking Radar coupled with digital Fire Control makes both tracking and engaging targets as easy as pressing a button."
 
 
 mtg_amphibious_assault_craft:0 "Amphibious Assault Craft"
 mtg_amphibious_assault_craft_desc:0 "Larger and better protected Assault Transports ensure that Armor and Special Forces can quickly secure a Beachhead without many casualties."
 
 early_submarine_hull_4:0 "$ship_hull_early_submarine_4$"
 early_submarine_hull_4_desc:0 "$ship_hull_early_submarine_4_desc$"
 early_submarine_hull_5:0 "Inter War Submarine"
 early_submarine_hull_5_desc:0 "Submarines in the Interwar years split up into Cruiser and Coastal Submarines, with few nations building the Intermediate Designs that would eventually dominate WW2. This was, in no small part, due to the limits set by the Washington Naval Treaty."

 early_destroyer_hull_4:0 "$ship_hull_early_destroyer_4$"
 early_destroyer_hull_4_desc:0 "$ship_hull_early_destroyer_4_desc$"
 basic_ship_hull_light:0 "Basic Destroyer"
 basic_ship_hull_light_desc:0 "Dual-Purpose Armaments and more advanced Anti-Submarine Technologies allow Destroyers to cover more roles in a fleet."
 
 early_ship_hull_carrier:0 "$ship_hull_carrier_0$"
 early_ship_hull_carrier_desc:0 "Fleet Carriers are fast enough to get into and out of striking distance quickly, while carrying a large complement of aircraft."
 
 auxiliary_hull_2:0 "Basic Auxiliary Ship"
 auxiliary_hull_2_desc:0 "With combat ships becoming more expensive, auxiliary ships occupy more roles such as tending to Seaplanes."
 auxiliary_hull_3:0 "Improved Auxiliary Ship"
 auxiliary_hull_3_desc:0 "No Fleet can operate outside of its own waters without proper support. Different types of Auxiliary Ships provide a multitude of services in order to achieve naval victory."
 auxiliary_hull_4:0 "Advanced Auxiliary Ship"
 auxiliary_hull_4_desc:0 "Modern Repair and Support Ships ensure that our fleets are always combat-ready, no matter where they are operating."