l_english:

 ship_hull_early_submarine_1:0 "Early Military Submarine"
 ship_hull_early_submarine_1_desc:0 "The first Military Submarines were only capable of diving very shallow and for extremely limited time. They were still very experimental craft and have no real military value today."
 ship_hull_early_submarine_2:0 "Improved Military Submarine"
 ship_hull_early_submarine_2_desc:0 "Larger Submarines started to be introduced, increasing range and stability. They also begun carrying more powerful weaponry."
 ship_hull_early_submarine_3:0 "Great War Submarine I"
 ship_hull_early_submarine_3_desc:0 "Submarines in the first World War used their diving capabilities as a means of avoiding blockades, rather than attacking undetected. Often times, their attacks were carried out from the Surface."
 ship_hull_early_submarine_4:0 "Great War Submarine II"
 ship_hull_early_submarine_4_desc:0 "Larger Surface Armaments and more Torpedo Tubes were mounted on Submarines with longer ranges and significantly increased dive depths."
 
 ship_hull_coastal_submarine_1:0 "Basic Coastal Submarine"
 ship_hull_coastal_submarine_1_desc:0 "The idea of smaller Submarines with less range to defend coastal waters was born out of the Washington Navy Treaty. Submarines beneath 600 tons of surface displacement were not counted towards the total allowed tonnage, allowing a legal loophole."
 ship_hull_coastal_submarine_2:0 "Improved Coastal Submarine"
 ship_hull_coastal_submarine_2_desc:0 "Coastal Submarines evolve into significantly more compact versions of their larger siblings. Their only significant drawback is their reduced range."
 ship_hull_coastal_submarine_3:0 "Advanced Coastal Submarine"
 ship_hull_coastal_submarine_3_desc:0 "With the advent of ever more advanced Sonar Systems, a reduced size has many advantages. Coastal Submarines are significantly harder to detect and can operate in shallow waters with less threat from enemy aircraft."
 
 ship_hull_cruiser_submarine_1:0 "Great War Cruiser Submarine"
 ship_hull_cruiser_submarine_1_desc:0 "Submarines that could operate outside of the range of Defensive Convoys were an important asset during WW1. Design ideas if the Great War continued on into the Interwar Era."
 ship_hull_cruiser_submarine_2:0 "Interwar Cruiser Submarine"
 ship_hull_cruiser_submarine_2_desc:0 "Large Cruiser Submarines with thousands of tons of displacement were a staple of Interwar Submarine Designs. Many carried large-caliber surface armaments and fulfilled the roles of traditional Cruisers."
 ship_hull_cruiser_submarine_3:0 "Improved Cruiser Submarine"
 ship_hull_cruiser_submarine_3_desc:0 "Modern Cruiser Submarines have done away with the ideas of the Interwar Period, focusing on range and mission efficiency over anything else. To that end, they carry more conventional armaments and can perform extended patrols."
 
 
 ship_hull_torpedoboat_destroyer:0 "Torpedoboat Destroyer"
 ship_hull_torpedoboat_destroyer_desc:0 "The advent of the Torpedo caused a crisis in the world's major navies. Small Boats could suddenly sink large Cruisers and Battleships. To combat this threat, the Torpedoboat Destroyer was born. In the beginning of the 20th century, they too started to carry Torpedos."
 ship_hull_early_destroyer_1:0 "Great War Destroyer I"
 ship_hull_early_destroyer_1_desc:0 "After the lessons learned in the Russo-Japanese War, most major navies emphazised the usage of small and maneuverable Destroyers to both attack enemy Battle Lines and defend their own."
 ship_hull_early_destroyer_2:0 "Great War Destroyer II"
 ship_hull_early_destroyer_2_desc:0 "Due to the outbreak of WW1, Destroyers were forced into new roles, such as defending trade routes. The destroyer, as used in WW2, began to take shape here."
 ship_hull_early_destroyer_3:0 "Inter War Destroyer I"
 ship_hull_early_destroyer_3_desc:0 "In the Interwar Period, Destroyers started to increase in size and torpedo capacity. They also begun getting faster, to still be comfortably able to outrun ships larger than them."
 ship_hull_early_destroyer_4:0 "Inter War Destroyer II"
 ship_hull_early_destroyer_4_desc:0 "With the resurfacing threat of Submarines, Destroyers started to be equipped with Sonar and Depth Charges. New designs favored operational longevity and Anti Air over larger armaments."
 
 ship_hull_destroyer_leader_1:0 "Early Destroyer Leader"
 ship_hull_destroyer_leader_1_desc:0 "Slightly larger Destroyers that were more heavily armed were used to lead Squadrons of Destroyers into battle, since Cruisers could no longer keep up with newer Destroyers. Their superior firepower deterred enemy Destroyers from challenging the squadron."
 ship_hull_destroyer_leader_2:0 "Basic Destroyer Leader"
 ship_hull_destroyer_leader_2_desc:0 "Destroyer Leaders were equipped with more powerful Anti Air defences to continue to provide cover for their Squadrons."
 ship_hull_destroyer_leader_3:0 "Improved Destroyer Leader"
 ship_hull_destroyer_leader_3_desc:0 "With a drastic increase in size and firepower, the line between Destroyer Leader and Light Cruiser started to blur. With new threats to combat, their roles began changing as well."
 
 
 ship_hull_early_cruiser_1:0 "Fast Cruiser"
 ship_hull_early_cruiser_1_desc:0 "Before the doctrine of Light Cruisers had solidified itself, the necessity of faster Medium-Sized Vessels caused the Fast Cruiser to be born. It did away with thick armor and large cannons to focus on speed and maneuverability."
 ship_hull_early_cruiser_2:0 "Great War Cruiser I"
 ship_hull_early_cruiser_2_desc:0 "A longer range and more cannons represented a shift from Fleet Maneuvers to Trade Route Protection in the design of Light Cruisers."
 ship_hull_early_cruiser_3:0 "Great War Cruiser II"
 ship_hull_early_cruiser_3_desc:0 "With modern, oil-fired boilers, Light Cruisers can easily outmaneuver large Battle Lines. As such, they are used in Scouting Roles as well as defending a Fleet against smaller craft."
 ship_hull_early_cruiser_4:0 "Interwar Light Cruiser I"
 ship_hull_early_cruiser_4_desc:0 "A last size increase solidifies the Light Cruiser's role as a defense against Destroyers. At the same time, their increased range allows them to project power globally."
 ship_hull_early_cruiser_5:0 "Interwar Light Cruiser II"
 ship_hull_early_cruiser_5_desc:0 "With the introduction of twin- and triple-barreled turrets, Light Cruiser design becomes more compact and space-efficient. Their survivability and Anti Air capabilities also increased drastically."
 
 
 ship_hull_armored_cruiser_1:0 "Armored Cruiser I"
 ship_hull_armored_cruiser_1_desc:0 "An Armored Cruiser was a cheap and mobile supplementary ship that supported Fleets of Pre-Dreadnoughts, as well as project power to faroff colonies. They were relatively well armored and carried large-caliber cannons."
 ship_hull_armored_cruiser_2:0 "Armored Cruiser II"
 ship_hull_armored_cruiser_2_desc:0 "The advent of the Dreadnought age marked the end of Armored Cruiser construction. The last ones produced were the most well-protected and armed of their class, but they simply had no role to fill anymore."
 ship_hull_early_heavy_cruiser_1:0 "Great War Heavy Cruiser"
 ship_hull_early_heavy_cruiser_1_desc:0 "The outbreak of WW1 made many navies realize that, while they commanded impressive fleets of Dreadnoughts and Battlecruisers, they needed powerful but cheap ships with long ranges to protect their overseas territories. The Heavy Cruiser filled that niche."
 ship_hull_early_heavy_cruiser_2:0 "Interwar Heavy Cruiser I"
 ship_hull_early_heavy_cruiser_2_desc:0 "The Washington Naval Treaty defined a Heavy Cruiser as anything with a Main Armament of up to 8 inches. Due to the strict restrictions placed, designers were forced to prioritize weight efficiency above all else."
 ship_hull_early_heavy_cruiser_3:0 "Interwar Heavy Cruiser II"
 ship_hull_early_heavy_cruiser_3_desc:0 "Heavy Cruiser started to be designed with Anti Aircraft and Carrier Escort duties in mind. Many nations also started to seek for loopholes in the Washington and London Naval Treaties."
 ship_hull_heavy_cruiser_1:0 "Early Heavy Cruiser"
 ship_hull_heavy_cruiser_1_desc:0 "With the world beginning to move towards a war again, Heavy Cruisers exploded in size. Thicker Armor and more Cannons made them a threat to anything smaller than a Battleship."
 ship_hull_heavy_cruiser_2:0 "Basic Heavy Cruiser"
 ship_hull_heavy_cruiser_2_desc:0 "The versatility of Heavy Cruisers allowed them to fill many roles, from Independent Actions to Carrier Escorting. The outbreak of war also meant that no treaties restricted their designs."
 ship_hull_heavy_cruiser_3:0 "Improved Heavy Cruiser"
 ship_hull_heavy_cruiser_3_desc:0 "New Heavy Cruisers started to carry powerful dual-purpose secondaries to protect themselves and their fleet from enemy Aircraft."
 ship_hull_heavy_cruiser_4:0 "Advanced Heavy Cruiser"
 ship_hull_heavy_cruiser_4_desc:0 "Modern Cannons make these Heavy Cruisers into a serious threat, capable of inflicting serious damage among an enemy's screen."
 
 
 ship_hull_dreadnought_1:0 "Dreadnought I"
 ship_hull_dreadnought_1_desc:0 "The advent of the 'All Big Guns' design caused most nations to participate in an Arms Race to secure their Sea Access."
 ship_hull_dreadnought_2:0 "Dreadnought II"
 ship_hull_dreadnought_2_desc:0 "Larger Cannons and thicker Armor distinguish the second generation of Dreadnoughts. They can engage targets from further away and inflict devastating damage."
 ship_hull_super_dreadnought_1:0 "Super Dreadnought I"