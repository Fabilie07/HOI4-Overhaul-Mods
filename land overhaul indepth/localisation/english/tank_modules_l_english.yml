 tank_gasoline_engine:0 "Gasoline Engine"
 tank_gasoline_engine_desc:0 "An Engine running on gasoline will be faster for a given Engine Size, but the fuel will be much more prone to catching fire."
 tank_diesel_engine:0 "Diesel Engine"
 tank_diesel_engine_desc:0 "An Engine running on Diesel fuel is more reliable than a gasoline engine, but not as fast for the same Engine Size."
 tank_petrol_electric_engine:0 "Petrol-Electric Engine"
 tank_petrol_electric_engine_desc:0 "A combination of a petrol-driven engine providing power to an electric motor. Complex, expensive and unreliable, it does however offer unmatched performance in tactical movements."
 tank_gas_turbine_engine:0 "Gas Turbine"
 tank_gas_turbine_engine_desc:0 "An turbine developed from jet engines. High fuel consumption, but the highest speed of any engine at a given Engine Size."
 tank_air_cooling:0 "Air Cooling"
 tank_air_cooling_desc:0 "Air Slits allow for cooling the engine with very little technical complexity."
 tank_filtered_cooling:0 "Air Filters"
 tank_filtered_cooling_desc:0 "Particles in the air can clot both air and cooling intakes, such as sand or dust."
 tank_vent_cooling:0 "Ventilation"
 tank_vent_cooling_desc:0 "By using fans, the engine can be kept cool without problems even while standing still."
 tank_watertight_vents:0 "Water-Tight Vents"
 tank_watertight_vents_desc:0 "Perfectly fitting coverings as well as snorkel extension kits make all air intakes and exhausts resilient against mud, rain and shallow waters."
 
 tank_200_liter:0 "200 Liters"
 tank_200_liter_desc:0 "The internal fuel storage."
 tank_300_liter:0 "300 Liters"
 tank_300_liter_desc:0 "The internal fuel storage."
 tank_400_liter:0 "400 Liters"
 tank_400_liter_desc:0 "The internal fuel storage."
 tank_500_liter:0 "500 Liters"
 tank_500_liter_desc:0 "The internal fuel storage."
 tank_750_liter:0 "750 Liters"
 tank_750_liter_desc:0 "The internal fuel storage."
 tank_1000_liter:0 "1000 Liters"
 tank_1000_liter_desc:0 "The internal fuel storage."

 tank_riveted_armor:0 "Riveted Armor"
 tank_riveted_armor_desc:0 "Armor Plates bolted to the frame and held together by rivets driven into the edges. A very proven technology that is fairly cheap, but the rivetted edges provide weakpoints in the armor and might hurt the crew if the rivets are hit."
 tank_cast_armor:0 "Cast Armor"
 tank_cast_armor_desc:0 "The entire Chassis, including armor, is cast as a single unit. An expensive and time-consuming process that allows for much thicker armor with fewer weakpoints."
 tank_welded_armor:0 "Welded Armor"
 tank_welded_armor_desc:0 "Armor plates are welded to the chassis. A faster process than casting, while still providing good protection."
 tank_lq_welded_armor:0 "Low-Quality Welded Armor"
 tank_lq_welded_armor_desc:0 "These Armor Plates are joined by welding with regular steel. This bypasses the need for rare metals, but the resulting armor is more brittle and the weld seams may break or crack."
 tank_modern_welded_armor:0 "Modern Welded Armor"
 tank_modern_welded_armor_desc:0 "Improvements in manufacture processes make a more durable, sturdy set of Armor."
 NOR_tank_rikstanken_armor: "Makeshift Armor"
 NOR_tank_rikstanken_armor_desc: "Made out of sheets of iron instead of steel to save money. Better than no armor... Probably."

 tank_cast_turret_armor:0 "Multi-Type Armor"
 tank_cast_turret_armor_desc:0 "By welding the hull and only casting the turret, the production cost is reduced while ensuring the superior quality of armor."
 tank_modern_cast_turret_armor:0 "Modern Multi-Type Armor"
 tank_modern_cast_turret_armor_desc:0 "Better welding techniques and advancements in casting technology allow the two types of manufacture to be seamlessly merged."

 tank_torsion_bar_suspension:0 "Torsion Bar"
 tank_torsion_bar_suspension_desc:0 "A fairly reliable suspension system of metal bars fixed to the vehicle chassis that provides a smoother ride than other suspension types."
 tank_christie_suspension:0 "Christie Suspension"
 tank_christie_suspension_desc:0 "Developed by an American inventor, this supension allows for exceptionally high speeds."
 tank_bogie_suspension:0 "Bogie Suspension"
 tank_bogie_suspension_desc:0 "A simple and fairly cheap type of suspension in which the roadwheels are mounted individually, allowing them to be easily replaced if damaged."
 tank_interleaved_suspension:0 "Interleaved Roadwheels"
 tank_interleaved_suspension_desc:0 "By overlapping the roadwheels, more of them can be fit in the same length of the hull, thereby improving mobility as well as providing some additional protection in the flanks."
 tank_improved_christie_suspension:0 "Improved Christie Suspension"
 tank_improved_christie_suspension_desc:0 "This suspension aims to mitigate the weaknesses of Christie's design, namely the slow reverse speed and insufficient shock dampening."
 tank_hvss_suspension:0 "HVSS Suspension"
 tank_hvss_suspension_desc:0 "Horizontal Springs reduce the overall load on the suspension, making it less prone to breaking."

 tank_light_tank_turret:0 "Light Turret"
 tank_light_tank_turret_desc:0 "A light Turret, mounting small Weapons."
 tank_light_tank_turret_2:0 "Improved Light Turret"
 tank_light_tank_turret_2_desc:0 "This turret is larger, allowing for heavier cannons to be used."
 tank_light_tank_big_turret:0 "Oversized Light Turret"
 tank_light_tank_big_turret_desc:0 "An enlargened Turret, offering more room for larger weaponry."
 tank_light_tankette_turret:0 "Light Tankette Superstructure"
 tank_light_tankette_turret_desc:0 "This superstructure houses little space. It is used to reduce the weight of the Tankette."
 tank_light_fixed_superstructure_turret:1 "Light Fixed Superstructure"
 tank_light_fixed_superstructure_turret_desc:0 "A fixed superstructure only allows the main armament to traverse in a small arc without turning the entire vehicle. However, it allows the vehicle to mount a bigger armament while being overall of smaller size, making the vehicle perfect for ambushes."
 tank_light_open_superstructure_turret:1 "Light Open Superstructure"
 tank_light_open_superstructure_turret_desc:0 "This Superstructure has an open roof or back, allowing large armaments to be fitted without increasing the cost."
 tank_light_open_top_turret:0 "Open-Top Turret"
 tank_light_open_top_turret_desc:0 "A fully rotating turret without an armoured roof, allowing not only excellent all-around vision but also the mounting of larger guns due to it being less cramped."
 tank_medium_tank_turret:0 "Medium Turret"
 tank_medium_tank_turret_desc:0 "A medium Turret, housing more space for larger armaments."
 tank_medium_tank_turret_2:0 "Improved Medium Turret"
 tank_medium_tank_turret_2_desc:0 "This turret is larger, allowing for heavier cannons to be used."
 tank_medium_fixed_superstructure_turret:1 "Medium Fixed Superstructure"
 tank_medium_fixed_superstructure_turret_desc:0 "A fixed superstructure only allows the main armament to traverse in a small arc without turning the entire vehicle. However, it allows the vehicle to mount a bigger armament while being overall of smaller size, making the vehicle perfect for ambushes."
 tank_medium_open_superstructure_turret:1 "Open Fixed Superstructure"
 tank_medium_open_superstructure_turret_desc:1 "This Superstructure has an open roof or back, allowing large armaments to be fitted without increasing the cost."
 tank_medium_open_top_turret:0 "Open-Top Turret"
 tank_medium_open_top_turret_desc:0 "A fully rotating turret without an armoured roof, allowing not only excellent all-around vision but also the mounting of larger guns due to it being less cramped."
 tank_heavy_tank_turret:0 "Heavy Turret"
 tank_heavy_tank_turret_desc:0 "A heavy Turret, allowing large armaments to be fitted."
 tank_heavy_tank_turret_2:0 "Improved Heavy Turret"
 tank_heavy_tank_turret_2_desc:0 "This turret is larger, allowing for heavier cannons to be used."
 tank_heavy_tank_big_turret:0 "Oversized Heavy Turret"
 tank_heavy_tank_big_turret_desc:0 "An enlargened Turret, offering more room for crew and larger weaponry."
 tank_heavy_fixed_superstructure_turret:1 "Heavy Fixed Superstructure"
 tank_heavy_fixed_superstructure_turret_desc:0 "A fixed superstructure only allows the main armament to traverse in a small arc without turning the entire vehicle. However, it allows the vehicle to mount a bigger armament while being overall of smaller size, making the vehicle perfect for ambushes."
 tank_super_heavy_tank_turret:0 "Super-Heavy Turret"
 tank_super_heavy_tank_turret_desc:0 "A super-heavy Turret, allowing extremely heavy armaments to be fitted."
 tank_modern_tank_turret:0 "Modern Turret"
 tank_modern_tank_turret_desc:0 "A well-laid out turret allows three crew members to efficiently operate the main armament and keep track of their surroundings."
 NOR_rikstanken_turret: "Improvised Turret"
 NOR_rikstanken_turret_desc: "It houses the gun, and can rotate. When it wants to."
 
