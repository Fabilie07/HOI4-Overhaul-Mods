 tank_super_heavy_he:0 "Super Heavy Explosive"
 tank_super_heavy_he_desc:0 "A thin-walled shell filled with Explosives that detonates on impact."

 tank_smoke:0 "Smoke Canister"
 tank_smoke_desc:0 "Shells filled with Phosphorus and other flammable Chemicals release a thick, heavy cloud of smoke on impact, concealing advances."

