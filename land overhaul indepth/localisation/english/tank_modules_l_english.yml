 armored_car_equipment_0:0 "Inter-War Armored Car"
 armored_car_equipment_0_desc:0 "A civilian wheeled vehicle, redesigned to carry protection against small-caliber fire."
 armored_car_equipment_1:0 "Basic Armored Car"
 armored_car_equipment_1_desc:0 "New armored cars are purpose-built and therefore offer greater protection and driving characteristics."
 armored_car_equipment_2:0 "Improved Armored Car"
 armored_car_equipment_2_desc:0 "With an ever increasing demand for quick reconnaisance as well as new anti-armor measures, the design of armored cars must be approached with renewed ideas."
