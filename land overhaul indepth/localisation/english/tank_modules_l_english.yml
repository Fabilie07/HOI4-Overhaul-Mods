 tank_flags:0 "Flag Communication"
 tank_flags_desc:0 "Communicating via Flags and Hand Signs is an outdated form of coordination."
 tank_radio_1:0 "Basic Radio"
 tank_radio_1_desc:0 "A basic two-way radio allows tanks to coordinate their tactical maneuvers on a small scale."
 tank_radio_2:0 "Improved Radio"
 tank_radio_2_desc:0 "An improved radio allows commanders effective control over larger formations of tanks, permitting large-scale operational maneuvers."
 tank_radio_3:0 "Advanced Radio"
 tank_radio_3_desc:0 "With a more powerful transmitter and better reception, this radio allows communications over dozens of kilometers and in the face of enemy jamming."
 amphibious_drive:0 "Amphibious Drive"
 amphibious_drive_desc:0 "A set of floatation devices and a small screw allow this tank to quickly be rigged to traverse water, either from ship to shore or across a river."
 enclosed_machine_gun:0 "Machine Gun Turret"
 enclosed_machine_gun_desc:0 "A rotating machine gun mount that can be operated from within the tank. It offers greater safety for the crew."
 secondary_turret_hmg:1 "Heavy Machine Gun"
 secondary_turret_hmg_desc:0 "A heavy machine gun in a secondary turret. The placement of the turret limits its arc of fire, lowering the gun's overall effectiveness, but it does allow the tank to engage more targets. This is particularly useful when on the attack."
 secondary_turret_small_cannon:1 "Small Cannon"
 secondary_turret_small_cannon_desc:0 "A small cannon in a secondary turret. The placement of the turret limits its arc of fire, lowering the gun's overall effectiveness, but it does allow the tank to engage more targets. This is particularly useful when on the attack."
 secondary_turret_close_support_gun:1 "Close Support Gun"
 hull_machine_gun:0 "Hull-mounted MG"
 hull_machine_gun_desc:0 "A machine gun in a hull mount can be operated from within the tank."
 hull_heavy_machine_gun:0 "Hull-mounted HMG"
 hull_heavy_machine_gun_desc:0 "A machine gun in a hull mount can be operated from within the tank."
 coaxial_small_cannon:0 "Coaxial Small Cannon"
 coaxial_small_cannon_desc:0 "A cannon of small caliber mounted next to the main weapon to increase the tank's firepower."
 sloped_armor:0 "Sloped Armor"
 sloped_armor_desc:0 "Armor placed at an angle to an incoming shell has a much greater effective thickness than the same amount of armor placed vertically. It also increases the chance that the shell will simply bounce off harmlessly. However, it requires the entire tank to be designed around it, making the vehicle more difficult to assemble."
 stabilizer:0 "Single-Plane Stabilizer"
 stabilizer_desc:0 "A simple gyroscopic stabilizer, keeping the gun and sights level while moving. Improves the tanks accuracy while moving slowly, but does not compensate for changes in direction."
 two_plane_stabilizer:0 "Two-Plane Stabilizer"
 two_plane_stabilizer_desc:0 "A mechanical device to keep the gun pointing in the same direction when the tank is moving. This device compensates for both vertical and horizontal movement."
 smoke_launchers:0 "Smoke Launchers"
 smoke_launchers_desc:0 "A battery of pyrotechnic devices that can be triggered from inside the tank to create a thick cloud of smoke to hide the tank. Very useful when on the defensive or after driving into an ambush."
 extra_ammo_storage:0 "Extra Ammunition Storage"
 extra_ammo_storage_desc:0 "Additional racks of ready ammunition allow the tank to stay in the fight much longer without resupply. However, if the armor is penetrated, the results are likely to be catastrophic. This is particularly problematic when attacking."
 wet_ammo_storage:0 "Wet Ammunition Storage"
 wet_ammo_storage_desc:0 "Water jackets added to ammunition racks dramatically reduce the risk of the ammunition exploding after the tank is hit, which is greatly appreciated by the crews."
 floor_ammo_storage:0 "Floor Ammunition Storage"
 floor_ammo_storage_desc:0 "Relocating the ammunition from the sponsons to the floor of the tank decreases the probability of a devastating ammo hit."
 first_stage_ammo_storage:0 "Fast Access Rack"
 first_stage_ammo_storage_desc:0 "A special ammunition rack is installed in the turret, allowing the loader to quickly load the gun from a comfortable position."
 expanded_fuel_tank:0 "Fuel Drum"
 expanded_fuel_tank_desc:0 "An externally mounted fuel drum designed to extend the operational range of an armored vehicle."
 large_fuel_tank:0 "Larger Fuel Tanks"
 large_fuel_tank_desc:0 "Larger internal fuel tanks increase the risk of catching fire but allow for greater ranges."
 electric_turret_drive:0 "Electric Turret Drive"
 electric_turret_drive_desc:0 "Instead of having to crank the turret by hand, an electric motor powered by the engine is used. This increases the traverse speed of the turret, but requires more training to get used to."
 twin_transmission:0 "Twin Transmission"
 twin_transmission_desc:0 "Instead of having one set of gears, each track can be operated seperately. This makes maneuvering much smoother."
 advanced_optics:0 "Advanced Optics"
 advanced_optics_desc:0 "Improved Sights for the Gunner and Commander allow them to notice threats earlier and engage them more efficiently."

 tank_rocket_launcher:0 "Rocket Launcher"
 tank_rocket_launcher_desc:0 "A multi-barrelled launcher for unguided, high-explosive rockets. The high volume of fire gives it excellent performance against soft targets, but even direct hits do little against armored targets."
 tank_rocket_launcher_2:0 "Improved Rocket Launcher"
 tank_rocket_launcher_2_desc:0 "While there are a number of improvements to accuracy, the main advantage of this improved rocket launcher is that it can hold more rockets to fire at the enemy."
 tank_medium_rocket_mortar:0 "Rocket Mortar"
 tank_medium_rocket_mortar_desc:0 "A barrel-mounted grenade launcher allows tanks to function as demolition projectors, blasting through infantry and fortifications."
 tank_heavy_rocket_mortar:0 "Heavy Rocket Mortar"
 tank_heavy_rocket_mortar_desc:0 "A large Rocket fired by special-built tanks can destroy entire houses with a single hit."
 tank_wheeled_suspension:0 "Wheeled Suspension"
 tank_wheeled_suspension_desc:0 "Derived from a truck chassis, this suspension is very limited in its carrying capacity and has limited cross-country performance, but has the advantage of being very cheap to make."
 tank_half_track_suspension:0 "Half-track Suspension"
 tank_half_track_suspension_desc:0 "A hybrid between a fully-tracked vehicle and a regular wheeled suspension, this setup has a pair of wheels up front for steering and a tracked rear axle to improve cross-country performance. While limited in its carrying capacity, it is still cheaper than a fully-tracked design."
 squeezebore_adaptor:0 "Squeeze-bore Adaptor"
 squeezebore_adaptor_desc:0 "A special adaptor at the end of the gun lowers the diameter of the barrel and squeezes a shell down to a smaller caliber. This significantly increases muzzle velocity and thereby the penetration power of the gun. It does require special ammunition made from rare materials."
 armor_skirts:0 "Armor Skirts"
 armor_skirts_desc:0 "A set of thin metal plates mounted on the side of the vehicle, giving additional protection against anti-tank rifles and shaped charges."
 spaced_armor:0 "Spaced Armor"
 spaced_armor_desc:0 "Plates of Armor-Grade Metal are welded with little spacing to the front of any vulnerable areas, increasing overall thickness and shattering projectiles."
 track_armor:0 "Track Armor"
 track_armor_desc:0 "Track links are mounted to open armor spaces. They have limited use as spares but also increase the protection of the vehicle."
 dozer_blade:0 "Dozer Blade"
 dozer_blade_desc:0 "A dozer blade allows the vehicle to quickly build a fighting position in the field without the support of engineers."
 auto_loader:0 "Auto Loader"
 auto_loader_desc:0 "An auomatic mechanism that loads shells and allows the tank to keep a high rate of fire for a prolonged period of time."
 easy_maintenance:0 "Easy Maintenance"
 easy_maintenance_desc:0 "Hatches around the vehicle give access to many different components of the vehicle, and allow the crew to perform even complex maintenance fairly easily."
 additional_machine_guns:0 "Additional Machineguns"
 additional_machine_guns_desc:0 "A set of machineguns in sponsons and special pintle mounts give the vehicle improved defense against close-in infantry attack."
 additional_heavy_machine_guns:0 "Additional Heavy Machinegun"
 additional_heavy_machine_guns_desc:0 "Heavy Machine Guns can increase the tanks effectiveness when dealing with enemy infantry."
 
 sw_rangefinder:0 "Rangefinder"
 sw_rangefinder_desc:0 "Optical Rangefinders utilize trigonometry to enhance the human eye's range estimation. This allows tanks to engage at large distances accurately."
 sw_night_vision:0 "Night Vision Equipment"
 sw_night_vision_desc:0 "Tanks are equipped with infrared spotlights and vision ports, allowing the commander clear vision at night."
 sw_double_tracks:0 "Double Tracks"
 sw_double_tracks_desc:0 "The increased surface area of two sets of tracks allows heavy tanks to traverse rough terrain."

 tank_light_ap:0 "Light Armor-Piercing"
 tank_light_ap_desc:0 "A solid steel projectile that can tear through enemy armor."
 tank_light_aphe:0 "Light Armor-Piercing Explosive"
 tank_light_aphe_desc:0 "This shell detonates after penetrating armor or concrete."
 tank_light_apcr:0 "Light Composite Rigid"
 tank_light_apcr_desc:0 "A solid core and soft mantle transform this round into a sharp dart when hitting armor."
 tank_light_apds:0 "Light Sabot Discarding"
 tank_light_apds_desc:0 "When fired, the outer part of the shell is discarded, leaving only a high-speed dart with increased penetration."
 tank_light_heat:0 "Light Shaped Charge"
 tank_light_heat_desc:0 "Explosives propel a core of metal through enemy armor upon hitting."
 tank_light_he:0 "Light Explosive"
 tank_light_he_desc:0 "A thin-walled shell filled with Explosives that detonates on impact."
 tank_medium_ap:0 "Medium Armor-Piercing"
 tank_medium_ap_desc:0 "A solid steel projectile that can tear through enemy armor."
 tank_medium_aphe:0 "Medium Armor-Piercing Explosive"
 tank_medium_aphe_desc:0 "This shell detonates after penetrating armor or concrete."
 tank_medium_apcr:0 "Medium Composite Rigid"
