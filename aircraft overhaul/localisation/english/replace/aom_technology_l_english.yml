 branch_exclusive_tt:0 "§RWARNING! The following doctrine branches are mutually exclusive. Only one of them can be researched, until the last doctrine in this tree has been researched.§!"

 1953_small_airframe:0 "Supersonic Small Airframe"
 1953_small_airframe_short:0 "Supersonic Fighter I"
 1953_small_airframe_desc:0 "Single and Twin engine planes offer good drag at high speeds. With advances in jet engine development, they are the first to break the soundbarrier in level flight."
 1960_small_airframe:0 "Supersonic Small Airframe II"
 1960_small_airframe_short:0 "Supersonic Fighter II"
 1960_small_airframe_desc:0 "An increased focus on speed as well as new weapon systems such as air-to-air missiles make small aircraft more potent then ever before."
 1953_medium_airframe:0 "Transonic Medium Airframe"
 1953_medium_airframe_desc:0 "Larger planes can carry fuel and weapons, but their drag increases drastically at high speeds. Current engine technologies struggle to propel them to supersonic speeds."
 1960_medium_airframe:0 "Supersonic Medium Airframe"
 1960_medium_airframe_desc:0 "Newer engines and reductions in drag allow even large planes to break the sound barrier."
 1953_large_airframe:0 "Transonic Large Airframe"
 1953_large_airframe_desc:0 "Larger planes can carry fuel and weapons, but their drag increases drastically at high speeds. Current engine technologies struggle to propel them to supersonic speeds."
 1960_large_airframe:0 "Supersonic Large Airframe"
 1960_large_airframe_desc:0 "Newer engines and reductions in drag allow even large planes to break the sound barrier."
 
 unconventional_aircraft_construction: "Unconventional Design"
 unconventional_aircraft_construction_desc: "There are a lot of experimental design philosophies. Many of them are outclassed by more conventional approaches, but some shine in niche applications or under special circumstances."

 survivability_studies:0 "Armor Plates"
 survivability_studies_2:0 "Self-Sealing Fuel Tanks"
 survivability_studies_2_desc:0 "Self-sealing fuel tanks prevent excessive fuel loss upon damage, greatly increasing the chances of an aircraft making it back home."
 small_plane_airframe_0:0 "Inter-War Airframe"
 agility_focus:0 "Agility Focus"
 agility_focus_desc:0 "Small, lightweight aircraft can outmaneuver enemies and prevent being shot down this way."
 speed_focus:0 "Speed Focus"
 speed_focus_desc:0 "The faster plane will always have an advantage. Pursuing this advantage means investing in engine research."
 aerodynamic_construction:0 "Aerodynamic Construction"
 aerodynamic_construction_desc:0 "By eliminating rivets and weld lines and making sure that every part is as aerodynamic as possible an aircrafts performance can be enhanced."
 simplified_construction:0 "Corner Cutting"
 simplified_construction_desc:0 "Modern systems are costly. There are many ways in which easy construction can be achieved."
 push_rods:0 "Push Rods"
 push_rods_desc:0 "Push Rods are hydraulic pistons that can deflect control surfaces even at high speeds. This prevents control loss at high speeds, but the resulting g-forces are stronger as well."
 fuselage_mounted_jet_engine:0 "Fuselage Mounted Jet Engine"
 fuselage_mounted_jet_engine_desc:0 "Jet Engines need a large and steady supply of intake air. Mounting them on the fuselage means that the intake is more complicated, but it offers an improvement in aerodynamics."
 stability_improvements:0 "Stability Improvements"
 stability_improvements_desc:0 "An aircraft designed for supersonic speed can encounter some unexpected troubles. Wings designed for low drag at high speed can lose lift at slow speeds. This can be prevented in different ways, e.g. by introducing wing fences."
 splitter_plates:0 "Splitter Plates"
 splitter_plates_desc:0 "Airflow near the fuselage of the aircraft is turbulent, impacting performance if it is used by the engine. Seperating the Intakes from the fuselage by using splitter plates prevents this from happening."
 
 enhanced_visibility: "Enhanced Visibility"
 enhanced_visibility_desc: "A large majority of shot-down pilots never saw the plane that attacked them. Improving the visibility out of our planes through All-Glass Canopies sacrifices some aerodynamic performance for a much higher chance of spotting and identifying enemy aircraft."
 enhanced_visibility_2: "Tail Warning Radar"
 enhanced_visibility_2_desc: "Small Search Radars detect aircraft that are behind the plane carrying the device, emitting an audible warning tone. How effective they actually are remains to be seen."
 enhanced_visibility_3: "Identify Friend-Foe System"
 enhanced_visibility_3_short: "IFF System"
 enhanced_visibility_3_desc: "An IFF is a device that detects radar signals from friendly planes, sending back an identification signal. This way, other units can recognize the plane as friendly, preventing blue on blue incidents."
 enhanced_visibility_4: "Radar Warning Receiver"
 enhanced_visibility_4_short: "RWR System"
 enhanced_visibility_4_desc: "Radar Warning systems have been used since the 1940s to varying success. This new device can accurately calculate the direction and range of radar signals hitting the aircraft, as well as if it is in Search or Track mode."
 
 reinforced_cockpits: "Reinforced Cockpits"
 reinforced_cockpits_desc: "Adding additional bars and bulletproof glass to the cockpits of large aircraft increases their survivability, especially at high altitudes where holes in the cockpit can cause freezing air to enter the craft at high speeds."
 ejector_seat: "Ejector Seat"
 ejector_seat_desc: "Small explosive charges are used to eject the pilot together with his seat in the case of an emergency. This way of ejecting is not only faster, but also creates some clearance from the ground at low altitudes."
 redundant_design: "Redundant Design"
 redundant_design_desc: "Smaller systems and controls are built to function even when damaged, increasing the chance of returning from missions."
 automatic_fire_extinguisher: "Automatic Fire Extinguisher"
 automatic_fire_extinguisher_desc: "Engine fires are one of the worst scenarios on an aircraft. This system immediately extinguishes the fire so a restart of the engine can be attempted."
 high_drag_bombs: "High-Drag Bombs"
 high_drag_bombs_desc: "Fins or parachutes are attached to bombs which open once they are released. This slows their descent, allowing the aircraft to get out of the blast radius before they detonate."
 on_board_accomodation: "On-Board Accomodation"
 on_board_accomodation_desc: "With aircraft ranges ever increasing, missions can take longer than 10 hours. Larger aircraft can have toilets and similar accomodations installed to make the crew's life easier."

 large_fuel_tanks:0 "Enlargened Fuel Tanks"
 large_fuel_tanks_desc:0 "Smarter distribution of weight and space allows for greater fuel capacities and therefore range."
 large_fuel_tanks_2:0 "International Focus"
 large_fuel_tanks_2_desc:0 "With conflicts becoming more and more global, planes need to be able to reach far-away targets."
 remote_controlled_turrets:0 "Remote Controlled Turrets"
 remote_controlled_turrets_desc:0 "Though costly, remotely controlling turrets enhances an aircrafts defensive capabilities significantly."
 remote_controlled_turrets_2:0 "Remote Controlled Cannons"
 remote_controlled_turrets_2_desc:0 "Defensive Cannon Turrets can be mounted in places that would usually require danger to crew or reduce aerodynamic capabilities significantly."
 delta_wings: "Delta Wing"
 delta_wings_desc: "Delta Wings offer good lift and little air resistance. They allow for high speed combined with agility."
 delta_wings_2: "Double Delta"
 delta_wings_2_desc: "Double Delta wings create even more lift."
 
 autopilot: "Autopilot"
 autopilot_desc: "The autopilot uses inputs from the flight director to maintain or change a course and can even be used for more complex maneuvers like takeoff and landing."
 space_suit: "Radiation Protection"
 space_suit_desc: "Fitting Bombers with protecting equipment against cosmic radiation allows them to constantly operate at extreme altitudes, making them much harder to hit."
 ballistic_computer_1: "Constantly Calculated Release Point"
 ballistic_computer_1_short: "Ballistic Computer"
 ballistic_computer_1_desc: "This technology releases bombs at the perfect point to hit the target that has previously been marked by the pilot. It can be used to "toss" nuclear bombs, allowing the pilot to escape the blast radius unharmed."
 ballistic_computer_2: "Constantly Calculated Impact Point"
 ballistic_computer_2_short: "Improved Ballistic Computer"
 ballistic_computer_2_desc: "An upgraded ballistic computer calculates the impact point of bombs at all times, displaying the result on the HUD. Can be used to attack from higher angles with great precision."

 rocket_rails_1:0 "Enlargened Rocket Rails"
 rocket_rails_1_desc:0 "By using the entire wingspan of aircraft or stacking rocket rails atop eachother, the capacity for rockets is increased."
 rocket_rails_2:0 "Heavy Rockets"
 rocket_rails_2_desc:0 "Large Rockets have almost the same effect as bombs, but they are more accurate and put the aircraft in less danger."
 rocket_rails_3:0 "Rocket Pods"
 rocket_rails_3_desc:0 "Rocket Pods are not only more aerodynamic than rails but they can also carry more rockets and are able to be refilled, decreasing overall cost."
 aa_rockets: "Air-to-Air Rockets"
 aa_rockets_desc: "Rockets are designed with timed fuses which are pre-set on the ground. They can be fired at groups of bombers, destroying them on direct hits and causing massive amounts of shrapnel."
 bomb_rack: "Bomb Rack"
 bomb_rack_desc: "Adding a Rack to the aircraft's hardpoint allows more bombs to be carried. A three-way-rack can hold triple the payload."
 rocket_rack: "Rocket Pod Rack"
 rocket_rack_desc: "Adding a Rack to the aircraft's hardpoint allows more rocket pods to be carried. A three-way-rack can hold triple the payload."

 aa_hmg_2:0 "Inline MGs"
 aa_hmg_2_desc:0 "Smart design allows for a large amount of heavy MGs to be mounted in a relatively small space."
 aa_hmg_3:0 "Modern Machine Guns"
 aa_hmg_3_desc:0 "Improved Gun Feeding Mechanisms and more durable barrels allow for a higher rate of fire whereas maintenance and replacement of worn gun components increase accuracy and reliability."
 aa_cannon_1_2:0 "Dual Cannons"
 aa_cannon_1_2_desc:0 "Interlocking magazines allow for cannons to be placed next to eachother without too much difficulty."
 tracers_1:0 "Tracer Base"
 tracers_1_desc:0 "Brightly burning chemicals are fitted to the back of bullets, helping the pilots with aiming at enemy aircraft."
 tracers_2:0 "Larger Magazines"
 tracers_2_desc:0 "More bullets mean more time to engage more targets. This enhances aircraft effectiveness per sortie."
 ammo_capacity_upgrade_tt:0 "Enables Ammunition Upgrades of 3 and above."
 tracers_3:0 "Night Tracers"
 tracers_3_desc:0 "Special Tracers that are not as easily spotted allow our aircraft to fight and ambush even during the night."
 rotary_cannon_1: "Minigun"
 rotary_cannon_1_desc: "Multibarreled rotary guns have a very high fire rate, making them excellent for use against fast-moving aircraft. The shorter trigger time can be compensated for by carrying missiles."
 rotary_cannon_2: "Rotary Cannon"
 rotary_cannon_2_desc: "Multibarreled rotary guns have a very high fire rate, making them excellent for use against fast-moving aircraft. The shorter trigger time can be compensated for by carrying missiles."
 
 aam_ir_1: "Infra Red Seeker Missile"
 aam_ir_1_short: "IR Missile I"
 aam_ir_1_desc: "An infrared seeker locks onto a heat signature, in this case a jets engine, and guides the missile towards it."
 aam_rack: "IR Missile Rack"
 aam_rack_desc: "A Rack can carry two IR missiles on one hardpoint."
 aam_ir_2: "Uncaged IR Seeker"
 aam_ir_2_short: "IR Missile II"
 aam_ir_2_desc: "The seeker is mounted on a swiveling head that can both roll and depress. This allows it to keep targeting signatures that are not directly in front of the missile."
 aam_radar_1: "Active Radar Homing Missile"
 aam_radar_1_short: "Radar Missile I"
 aam_radar_1_desc: "A tracking radar is mounted on the missile, locking a target and guiding it towards it."
 aam_radar_2: "Semi-Active Radar Homing Missile"
 aam_radar_2_short: "Radar Missile II"
 aam_radar_2_desc: "This missile guides itself using a radar beam from the aircraft that fired it. It has no need for an onboard radar, making it cheaper and more maneuverable."
 
 propeller_improvements_1: "Metal Propellers"
 propeller_improvements_1_desc: "Early propellers were mainly made from wood. This made them light, but weak. Metal blades can handle faster rotations and are overall stronger."
 propeller_improvements_2: "Variable Speed Propellers"
 propeller_improvements_2_desc: "The blades of this propeller type are not fixed, instead their angle can be adjusted. This improves performance across the board."
 propeller_improvements_3: "Constant Speed Propellers"
 propeller_improvements_3_desc: "The angle of the blades is automatically adjusted. This ensures that the engine runs at its most effective speed at all times."
 propeller_improvements_4: "Contra-Rotating Propellers"
 propeller_improvements_4_desc: "A contra-rotating propeller has two sets of blades that turn in opposite directions. This eliminates the torque a propeller usually produces, making the aircraft more stable."
 
 airborne_tracking_radar: "Airborne Tracking Radar"
 airborne_tracking_radar_desc: "This radar automatically locks onto anything that enters its cone of view. The repeated signals allow accurate tracking of the target."
 search_and_track_radar: "Search and Track Radar"
 search_and_track_radar_desc: "The ability to switch between a wide, sweeping scan and more accurately tracking a single target is combined into a single radar piece."
 pulse_doppler_radar: "Terrain Filtered Radar"
 pulse_doppler_radar_desc: "This technology applies the Pulse Doppler or MTI principle to airborne radar, allowing it to somewhat reliably filtering terrain noise. The application is difficult, because the aircraft's own speed needs to be accounted for, but it already proves to be superior to old systems."

 engine_non_fuel_injection:0 "Non-Fuel Injection"
 engine_non_fuel_injection_desc:0 "Performance of piston engines is improved by injecting non-fuel liquids. These are usually injected into the supercharger or combustion chambers, increasing power for short periods."
 range_improvements_2:0 "Drop Tanks"
 range_improvements_2_desc:0 "Fuel Tanks on the outside of the fuselage and wings that can be dropped when engaging enemies will improve the range of our smaller aircraft without impacting performance as much."
 supercharger_1:0 "Multi-Stage Supercharger"
 supercharger_1_desc:0 "Switching between Supercharger Gears allows smooth performance at many altitudes. It gives a significant edge over enemies lacking such mechanical devices."
 supercharger_2:0 "Turbocharger"
 supercharger_2_desc:0 "A Turbocharger increases performance even further across the board."
 
 jet_improvements_1: "Increased Combustion Chamber Pressure"
 jet_improvements_1_short: "Jet Improvements I"
 jet_improvements_1_desc: "Jet engines are still a novel technology. There are many aspects that can be fine-tuned. Prototypes can show which engine parts need redesigning to endure greater pressures, increasing power and improving engine life cycles."
 jet_improvements_2: "Multiple Spool Compressor"
 jet_improvements_2_short: "Jet Improvements II"
 jet_improvements_2_desc: "High-pressure compressor blades can increase the power output of a jet engine. However, they stall far easier, making them unsuitable for aircraft that need to maneuver and fly at low and high speeds. Using both low and high pressure stages prevents this issue."
 jet_improvements_3: "Bypass Airflow"
 jet_improvements_3_short: "Jet Improvements III"
 jet_improvements_3_desc: "By channelling a part of the air that exits the compressor around the combustion chamber, both fuel efficiency and low speed thrust are increased. The bypass ratio dictates the properties of the engine, with lower ratios favoring power and higher ratios efficiency."
 jet_afterburner: "Afterburning Jet Engine"
 jet_afterburner_desc: "Afterburning compartments have been used in our jet engines for some time now, but the additional power can still be drastically increased. Going beyond conventional reheating, these new burners leave a trail of fire and shock diamonds."
 jet_afterburner_2: "Improved Afterburner"
 jet_afterburner_2_desc: "Increasing the amount of fuel injected into the airflow leaving the turbofan improves jet engines even further. Modern engines are built for prolonged usage of the afterburner."
 
 SP_RESEARCHED_TT:0 "This Technology is automatically unlocked when Special Project $PROJECT|Y$ is researched."
 
 parasitic_rocket_planes:0 "Parasitic Rocket Planes"
 parasitic_rocket_planes_desc:0 "Rocket engines are very small, but powerful. Their main drawback, being unable to carry much fuel, is mitigated by the use of a mothership to refuel them periodically."
 
 collective_pitch:0 "Collective Pitch"
 collective_pitch_desc:0 "A mechanical device is used to automatically adjust the angles of the rotor blades. This allows the Helicopter to maneuver without any additional propellers, simply by adjusting the collective pitch."
 single_rotor_design:0 "Single Rotor Design"
 single_rotor_design_desc:0 "The main advantages of using a single rotor are that it can be larger and less mechanically complex. However, there needs to be a way to prevent the torque from spinning the frame of the helicopter, so a small rotor or similar must be installed."
 bulletproof_glass:0 "Bulletproof Glass"
 bulletproof_glass_desc:0 "Since Helicopters are now used under fire, it is necessary to protect their crews. Protection against small arms fire must be administered."
 increased_transport_space:0 "Increased Transport Room"
 increased_transport_space_desc:0 "As the power of helicopters increases, they can carry more cargo, wether that be supplies or soldiers."
 air_to_ground_missiles:0 "Air-to-Ground Missiles"
 air_to_ground_missiles_desc:0 "Guided Missiles equipped with HEAT warheads are powerful weapons against tanks, bunkers and other hard targets."
 
 helium_usage:0 "Helium Usage"
 helium_usage_desc:0 "Helium is more dense, meaning that more of it is needed to keep an Airship afloat. However, it is far safer to use."
 hydrogen_usage:0 "Hydrogen Usage"
 hydrogen_usage_desc:0 "Hydrogen is the lightest element, making it perfect for usage in Airships. It's easy to produce, but ignites even easier."
 radar_equipped_airships:0 "Radar-Equipped Airships"
 radar_equipped_airships_desc:0 "The patrol blimps and zeppelins are refitted with Radar Antennae, allowing them to spot ships beyond the horizon."
 sonar_buoys:0 "Sonar Buoys"
 sonar_buoys_desc:0 "Floating devices equipped with sonar scan systems can be dropped into the water. They transmit their findings back to the airship, improving their detection capabilities even further."
 
 suicide_charge:0 "Kamikaze Equipment"
 suicide_charge_desc:0 "Dedicated Kamikaze Planes will be able to destroy entire fleets, beating back our enemies with the conviction of a higher cause."
 turboprop:0 "Turboprop Engine"
 turboprop_desc:0 "By combining the large thrust of jet turbines with the low-speed performance of propellers, a powerful form of propulsion is born."
 oxygen_tanks:0 "Oxygen Tanks"
 oxygen_tanks_desc:0 "Planes can carry oxygen to prevent pilots from passing out due to low air density. This allows them to operate more efficiently at high altitudes."
 pressurized_cabin:0 "Pressurized Cabins"
 pressurized_cabin_desc:0 "By keeping the crew at a constant pressure level, they experience far less fatigue due to altitude or changes therein."
