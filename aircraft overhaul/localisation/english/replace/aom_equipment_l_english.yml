 intercontinental_plane_airframe_1:0 "Intercontinental Bomber"
 
 transport_plane_equipment_4:0 "Modern Transport Plane"
 transport_plane_equipment_4_desc:0 "Planes of new size dimensions that can airlift paratroopers or supplies."
 
 mothership_equipment_1:0 "Improved Mothership Aircraft"
 mothership_equipment_1_desc:0 "A larger mothership, carrying more fighters and more supplies. This increases both fire- and staying power."
 
 helicopter_equipment_1:0 "Basic Helicopter"
 helicopter_equipment_1_desc:0 "Helicopters use vertical rotors to stay in the air, allowing them to hover mid-air. They need far shorter runways and can operate with ground crew more easily."
 helicopter_equipment_2:0 "Improved Helicopter"
 helicopter_equipment_2_desc:0 "A more powerful engine and improved construction quality allow this Helicopter to operate more flexibly."
 helicopter_equipment_3:0 "Advanced Helicopter"
 helicopter_equipment_3_desc:0 "A helicopter designed from the ground up to transport supplies and troops, even under fire."
 helicopter_equipment_4:0 "Modern Helicopter"
 helicopter_equipment_4_desc:0 "This helicopter combines powerful engines with modern equipment to allow it to maneuver under the most hostile circumstances."
 
 airship: "Airship"
 airship_equipment: "Airship"
 airship_equipment_desc: "Airships are slow and huge targets, but they can be used to ship supplies to the front. Their long range allows them to reach far beyond Trains or Trucks."
 airship_equipment_1: "Basic Airship"
 airship_equipment_1_desc: "A hull filled with gas lighter than air can float. With additional propellers, it can be steered and travel far distances."
 airship_equipment_2: "Improved Airship"
 airship_equipment_2_desc: "This Airship houses more crew and equipment. It is also built more resilient to weather and damage."
 
 attack_helicopter: "Attack Helicopter"
 attack_helicopter_equipment: "Attack Helicopter"
 attack_helicopter_equipment_desc: "Helicopters equipped with suspended weaponry excell at taking out unprotected ground targets, but any kind of AA presence is deadly to them."
 attack_helicopter_equipment_1: "Basic Attack Helicopter"
 tank_designer_attack_helicopter_equipment: "Attack Helicopter"
 
 attack_helicopter_brigade: "Attack Helicopter"
 attack_helicopter_brigade_desc: "Armed Helicopters provide combat support, by flying short attack runs against enemy troops."
 
