l_english:

 AOM_event.1.t:0 "Joint Development Program"
 AOM_event.1.d:0 "The Aircraft Development Program proposed by [FROM.GetName] has come to an end. This international research program will surely benefit the both of our countries."
 AOM_event.1.a:0 "The fruits of cooperation are sweet"
 AOM_event.2.t:0 "Joint Training Exercise"
 AOM_event.2.d:0 "The international training exercise by [FROM.GetName] helped us gain valuable experience. We will use this knowledge to better prepare our country for any emergencies."
 AOM_event.2.a:0 "The fruits of cooperation are sweet"
 AOM_event.3.t:0 "International Aircraft Development"
 AOM_event.3.d:0 "[FROM.GetName] has started an international commission to advance aircraft development. This will lead to great progress in the field."
 AOM_event.3.a:0 "This will be beneficial"
 AOM_event.4.t:0 "[FROM.GetName] Invites our country's scientists to the Joint Aircraft Research Commission"
 AOM_event.4.d:0 "[FROM.GetName] has started an international commission to advance aircraft development. This will lead to great progress in the field."
 AOM_event.4.a:0 "This will be beneficial"
 AOM_event.4.b:0 "We have no intention of sharing our knowledge"
 AOM_event.5.t:0 "[FROM.GetName] joins the Program"
 AOM_event.5.d:0 "After careful consideration, [FROM.GetName] has decided to join our Aircraft Commission."
 AOM_event.5.a:0 "A wise decision"
 AOM_event.6.t:0 "[FROM.GetName] refuses"
 AOM_event.6.d:0 "After careful consideration, [FROM.GetName] has decided not to join our Aircraft Commission."
 AOM_event.6.a:0 "We have no need for their help"