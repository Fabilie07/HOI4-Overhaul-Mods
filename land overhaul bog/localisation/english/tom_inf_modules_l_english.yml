 inf_bolt_action:0 "Bolt Action"
 inf_bolt_action_desc:0 "A reliable, tested method to load new rounds. A bolt is connected to the firing chamber, ejecting casings when pulled back and loading new ones when pushed forwards."
 inf_lever_action:0 "Lever Action"
 inf_lever_action_desc:0 "This mechanism allows reloading the weapon without changing how it's held. A lever is attached to the stock, which reloads the weapon when used."
 inf_semi_auto:0 "Semi-Automatic"
 inf_semi_auto_desc:0 "The recoil of the gun is used to chamber the next round, allowing succesive shots from simply pressing the trigger again."
 inf_full_auto:0 "Full-Automatic"
 inf_full_auto_desc:0 "Rounds are fired until the trigger is released or the ammo runs out."
 
 inf_sights_1:0 "Fixed Iron Sights"
 inf_sights_1_short:0 "Iron Sights I"
 inf_sights_1_desc:0 "A simple sight, offering no magnification or illumination. Two sights are attached to the rifle so that they overlap when looking straight along it."
 inf_sights_2:0 "Adjustable Iron Sights"
 inf_sights_2_short:0 "Iron Sights II"
 inf_sights_2_desc:0 "The rear sight can be moved up and down to set the target distance. This makes soldiers less reliant on firing ranging shots."
 inf_sights_3:0 "Improved Adjustable Iron Sights"
 inf_sights_3_short:0 "Iron Sights III"
 inf_sights_3_desc:0 "This sight can be adjusted for range and windage, allowing further precision at longer ranges."
 inf_sights_sniper:0 "Telescopic Sight"
 inf_sights_sniper_desc:0 "This optic magnifies the target, allowing precise fire even at long distances. It is hard to manufacture and as such usually only used by specialised sharpshooters."
 inf_sights_night:0 "Infrared Sight"
 inf_sights_night_desc:0 "A large IR flashlight is used to illuminate the target, allowing clear vision in the dark. Experimental technology is used, severely increasing the production cost and size."
 
 inf_backpack_1:0 "Light Backpack"
 inf_backpack_1_desc:0 "A soldiers load dictates how long he can march without growing tired. Ammunition, food and equipment must all be carried on foot."
 inf_backpack_2:0 "Medium Backpack"
 inf_backpack_2_desc:0 "A soldiers load dictates how long he can march without growing tired. Ammunition, food and equipment must all be carried on foot."
 inf_backpack_3:0 "Heavy Backpack"
 inf_backpack_3_desc:0 "A soldiers load dictates how long he can march without growing tired. Ammunition, food and equipment must all be carried on foot."
 
 inf_canteen_1:0 "Water Canteen I"
 inf_canteen_1_desc:0 "A small can capable of carrying enough water to sustain a soldier for a couple of days."
 inf_canteen_2:0 "Water Canteen II"
 inf_canteen_2_desc:0 "A medium-sized can holding enough water for at least a week. Improved seals reduce leaking."
 inf_canteen_3:0 "Water Canteen III"
 inf_canteen_3_desc:0 "A large can easily capable of holding enough water to sustain a soldier in even the harshest climates on earth."
 
 inf_first_aid_1:0 "First-Aid Kit I"
 inf_first_aid_1_desc:0 "A small pouch containing bandages to treat small wounds."
 inf_first_aid_2:0 "First-Aid Kit II"
 inf_first_aid_2_desc:0 "Disinfectants are added to the medicine pouch, increasing the chance to successfully treat surface-level wounds."
 inf_first_aid_3:0 "First-Aid Kit III"
 inf_first_aid_3_desc:0 "Antibiotics and other miscellaneous medicines are carried along. Soldiers can administer proper first-aid without needing a field hospital."
 
 inf_sidearm_pistol:0 "Pistol"
 inf_sidearm_pistol_desc:0 "A handgun with an exchangeable magazine. Offers additional self-defense capabilities."
 inf_sidearm_revolver:0 "Revolver"
 inf_sidearm_revolver_desc:0 "Outdated technologically, the revolver still offers great firepower when needed."
 
 inf_support_carbine_1:0 "Early Carbine"
 inf_support_carbine_1_short:0 "Carbine I"
 inf_support_carbine_1_desc:0 "Carbines are shorter weapons than full-scale rifles. They are better suited to enclosed spaces and short-range engagements."
 inf_support_carbine_2:0 "Improved Carbine"
 inf_support_carbine_2_short:0 "Carbine II"
 inf_support_carbine_2_desc:0 "With the advent of new technologies, the term 'Carbine' starts to become blurry. They can be semi or fully automatic weapons, but their size and ammo capacity is still limited."
 inf_support_shotgun_1:0 "Shotgun"
 inf_support_shotgun_1_desc:0 "Firing shells filled with buckshot makes shotguns less accurate and thus not suited for long-range engagements, but they are perfect for enclosed spaces and shock-and-awe tactics."
 inf_support_smg_1:0 "Early Submachine Gun"
 inf_support_smg_1_short:0 "SMG I"
 inf_support_smg_1_desc:0 "Submachine Guns offer great firepower due to their ability to fire a whole magazine of bullets in a couple of seconds. However, the technology is still in its infancy."
 inf_support_smg_2:0 "Improved Submachine Gun"
 inf_support_smg_2_short:0 "SMG II"
 inf_support_smg_2_desc:0 "This design offers greater reliability, firepower and ergonomics than its predecessor."
 
 inf_grenade_frag:0 "Frag Grenade"
 inf_grenade_frag_desc:0 "A standard fragmentation grenade. Upon activation, a short fuse will detonate it, showering the surroundings with shrapnel."
 inf_grenade_impact:0 "Impact Grenade"
 inf_grenade_impact_desc:0 "A contact fuse ensures that this grenade can not be thrown back, but it is less reliable."
 inf_grenade_bundle:0 "Grenade Bundle"
 inf_grenade_bundle_desc:0 "Multiple grenades are bound to each other, resulting in an improvised anti-armour weapon with a deadly concussive blast."
 inf_grenade_incendiary:0 "Incendiary Grenade"
 inf_grenade_incendiary_desc:0 "Filled with liquids that ignite when in contact with the air, this grenade burns anything it is thrown at: Concrete, Steel and Flesh."
 inf_grenade_smoke:0 "Smoke Grenade"
 inf_grenade_smoke_desc:0 "This grenade releases a cloud of heavy smoke, obscuring vision or marking positions."
 
 inf_rifle_grenade:0 "Rifle Grenade"
 inf_rifle_grenade_desc:0 "This grenade can be mounted to the barrel of a rifle and fired with a blank round. It can fly much further than a thrown grenade."
 inf_portable_at_rocket:0 "Portable AT Rocket"
 inf_portable_at_rocket_desc:0 "A rocket launcher firing HEAT warheads, small enough to be carried and used by a single infantryman."
 inf_shovel:0 "Shovel"
 inf_shovel_desc:0 "An entrenchment tool, but its use cases exceed just digging trenches or foxholes. It can be used as a tool for many purposes or even as a weapon."
 inf_bayonet:0 "Bayonet"
 inf_bayonet_desc:0 "A dagger-like knife that can be attached to the barrel of the rifle. It is effective in close quarters, but ideally it is never used."
 inf_pocket_knife:0 "Pocket Knife"
 inf_pocket_knife_desc:0 "Both parts Self-Defense Weapon and Tool, there are many uses for a knife on the frontlines, from stabbing enemies to opening cans."
 inf_cleaning_kit:0 "Cleaning Kit"
 inf_cleaning_kit_desc:0 "A standard-issue kit including several tools to help with maintaing the rifle. It helps soldiers to always be ready to fight, even on prolonged deployments."
 
 inf_barrel_sawed_off:0 "Sawed-Off Barrel"
 inf_barrel_sawed_off_desc:0 "Sawing the barrel off a weapon is an easy way of making it easier to handle or conceal, but it makes it considerably less accurate and long-ranged."
 inf_barrel_carbine:0 "Carbine Barrel"
 inf_barrel_carbine_desc:0 "A shortened barrel makes a rifle lighter and easier to use in enclosed spaces, but it reduces the amount of propellant that is burned. This decreases the speed and accuracy of fired bullets."
 inf_barrel_rifle:0 "Rifle Barrel"
 inf_barrel_rifle_desc:0 "A standard rifle barrel allows bullets to accelerate to high speeds. Usually, internal rifling will add spin to the bullet, increasing its accuracy."
 inf_barrel_extended:0 "Extended Barrel"
 inf_barrel_extended_desc:0 "Longer barrels increase the velocity of bullets, but it makes it easier for the gun to get stuck on objects. The weight increase and imbalance also has a negative effect on soldiers."
 
 inf_clip_05:0 "5-Round Clip"
 inf_clip_05_desc:0 "Clips are pushed into the chamber, allowing easy reloading of several bullets."
 inf_clip_10:0 "10-Round Clip"
 inf_clip_10_desc:0 "Clips are pushed into the chamber, allowing easy reloading of several bullets."
 inf_magazine_05:0 "5-Round Magazine"
 inf_magazine_05_desc:0 "Pre-loaded magazines are fast to reload and can hold many rounds, but they make ammo management harder."
 inf_magazine_10:0 "10-Round Magazine"
 inf_magazine_10_desc:0 "Pre-loaded magazines are fast to reload and can hold many rounds, but they make ammo management harder."
 inf_magazine_15:0 "15-Round Magazine"
 inf_magazine_15_desc:0 "Pre-loaded magazines are fast to reload and can hold many rounds, but they make ammo management harder."
 inf_magazine_20:0 "20-Round Magazine"
 inf_magazine_20_desc:0 "Pre-loaded magazines are fast to reload and can hold many rounds, but they make ammo management harder."
 inf_magazine_25:0 "25-Round Magazine"
 inf_magazine_25_desc:0 "Pre-loaded magazines are fast to reload and can hold many rounds, but they make ammo management harder."
 inf_magazine_30:0 "30-Round Magazine"
 inf_magazine_30_desc:0 "Pre-loaded magazines are fast to reload and can hold many rounds, but they make ammo management harder."
 
