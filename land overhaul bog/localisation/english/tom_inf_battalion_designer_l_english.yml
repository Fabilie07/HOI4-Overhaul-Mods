 bat_switch_left:0 "Previous Battalion"
 
 tom_inf_support_composition:0 "Battalion Composition"

 TOM_INF_BATTALION_EQUIPMENT_TT:0 "The stats shown here are mostly multiplicative. The base stats are provided by the §YEquipment Types§! fielded in the Battalion. Once an Equipment is added to the Battalion, its stats are added to the Base Value, irregardless of how much of it is added. That value is then multiplied by the values on the right (and other modifiers from Technologies, Doctrines and National Spirits)."
 
