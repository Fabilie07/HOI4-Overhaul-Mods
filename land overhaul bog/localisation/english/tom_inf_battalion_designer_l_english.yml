 tom_inf_battalion_composition:0 "Battalion Designer"
 tom_inf_battalion_composition_desc:0 "Battalions are a subdivision of units in the army. They form Regiments, which subsequently form Divisions. Each Battalion follows a strict template consisting of different types of Companies to achieve specific goals. In this screen, you can choose the composition of different Battalions to fulfill your tactical and strategical needs."

