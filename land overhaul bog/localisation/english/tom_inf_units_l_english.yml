 medium_armored_signal_desc:0 "Command Tanks carry more powerful Radio units, making them capable of communicating with other forces from the frontline."
 heavy_armored_signal:0 "Heavy Command Vehicle Platoon"
 heavy_armored_signal_desc:0 "Command Tanks carry more powerful Radio units, making them capable of communicating with other forces from the frontline."
 
 sniper_support:0 "Sniper Platoon"
