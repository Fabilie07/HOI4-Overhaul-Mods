l_english:

 mountaineers_mechanized:0 "Mechanized Mountaineers"
 mountaineers_mechanized_desc:0 "Special Forces trained to use APCs in the harsh environment of mountains."
 
 rangers_mechanized:0 "Mechanized Rangers"
 rangers_mechanized_desc:0 "These units use the high mobility of APCs to fight in the thick forest."

 
 mechanized_engineer:0 "Mechanized Engineer Company"
 mechanized_engineer_desc:0 "Halftracks are more versatile and mobile than their heavier Counterparts."
 
 armored_military_police:0 "Armored Military Police"
 armored_military_police_desc:0 "Armored Cars offer protection against most weapons a Resistance Force can muster."
 
 vehicle_maintenance_company:0 "Vehicle Maintenance Company"
