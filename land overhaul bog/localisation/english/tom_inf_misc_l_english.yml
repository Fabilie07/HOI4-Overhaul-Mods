 tom_inf_equipment_ai_decisions:0 "Generic Equipment Decisions"
 tom_inf_equipment_ai_decisions_desc:0 "Infantry Equipment is vital for any nation. Due to the way the game works, on the creation of a new Tag, such as at the beginning of a Civil War, no valid Infantry Equipment Design is created. §YIf you're seeing this, you should be in this exact situation.§! In order to ensure a fair and enjoyable game experience, decisions can be used to give these nations an up-to-date, buildable design."
