 mg_standard_barrel:0 "Standard Barrel"
 mg_standard_barrel_desc:0 "This barrel relies on its natural exposure to the surrounding air to vent excess heat."
 mg_watercooled_barrel:0 "Water-Cooled Barrel"
 mg_watercooled_barrel_desc:0 "A water-filled jacket surrounds the barrel and cools it down while firing."
 mg_aircooled_barrel:0 "Air-Cooled Barrel"
 mg_aircooled_barrel_desc:0 "A jacket is placed around the barrel which improves airflow and keeps the gun cool."
 mg_foregrip:0 "Foregrip"
 mg_foregrip_desc:0 "A grip for the offhand is added to the Machine Gun, allowing the Gunner to quickly reposition and even fire on the move."
 mg_bipod:0 "Bipod"
 mg_bipod_desc:0 "Two extendable legs are mounted to the front of the machine gun, giving additional support when firing over walls or ridges."
 mg_tripod:0 "Tripod"
 mg_tripod_desc:0 "A large mount with three legs offers great stability, but it is almost impossible to reposition quickly."
 mg_belt_fed:0 "Belt-Fed"
 mg_belt_fed_desc:0 "A common way of feeding machine guns is to attach the Bullets to a Belt that is running through the Chamber. This assembly is simple, but often needs a second soldier to make sure the Belt runs clean."
 mg_magazine_020:0 "20-Round Magazine"
 mg_magazine_020_desc:0 "Machine Guns can use Rifle-Style Magazines or simple bags in which an Ammo Belt is stored."
 mg_magazine_030:0 "30-Round Magazine"
 mg_magazine_030_desc:0 "Machine Guns can use Rifle-Style Magazines or simple bags in which an Ammo Belt is stored."
 mg_magazine_040:0 "40-Round Magazine"
 mg_magazine_040_desc:0 "Machine Guns can use Rifle-Style Magazines or simple bags in which an Ammo Belt is stored."
 mg_magazine_050:0 "50-Round Magazine"
 mg_magazine_050_desc:0 "Machine Guns can use Rifle-Style Magazines or simple bags in which an Ammo Belt is stored."
 mg_magazine_100:0 "100-Round Magazine"
 mg_magazine_100_desc:0 "Machine Guns can use Rifle-Style Magazines or simple bags in which an Ammo Belt is stored."
 mg_rpm_0400:0 "400 RPM"
 mg_rpm_0400_desc:0 "A higher Fire Rate means more stopping power, but also more mechanical stress."
 mg_rpm_0600:0 "600 RPM"
 mg_rpm_0600_desc:0 "A higher Fire Rate means more stopping power, but also more mechanical stress."
 mg_rpm_0800:0 "800 RPM"
 mg_rpm_0800_desc:0 "A higher Fire Rate means more stopping power, but also more mechanical stress."
 mg_rpm_1000:0 "1000 RPM"
 mg_rpm_1000_desc:0 "A higher Fire Rate means more stopping power, but also more mechanical stress."
 mg_rpm_1200:0 "1200 RPM"
 mg_rpm_1200_desc:0 "A higher Fire Rate means more stopping power, but also more mechanical stress."
 mg_rpm_1400:0 "1400 RPM"
 mg_rpm_1400_desc:0 "A higher Fire Rate means more stopping power, but also more mechanical stress."
 mg_exchangeable_barrel:0 "Quick-Change Barrel"
 mg_exchangeable_barrel_desc:0 "A mechanical lever is used to quickly remove and replace an overheated barrel, allowing for longer sustained firing."
 mg_rifle_cartridge:0 "Standard Rifle Rounds"
 mg_rifle_cartridge_desc:0 "Chambering a Machine Gun to fire the same Rounds as the Standard Service Rifle reduces Ammunition Cost and allows for limited Part Interchangeability. The drawback is that full-length rifle rounds are often too powerful for conventional MGs."
 mg_anti_armor_ammunition:0 "Anti-Armor Rounds"
 mg_anti_armor_ammunition_desc:0 "Rounds using Sabots or Heavy Cores are used, allowing the Machine Gun to penetrate lightly armored Vehicles."