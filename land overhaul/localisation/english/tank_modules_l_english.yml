 tank_super_heavy_four_man_tank_turret:0 "Four Man Turret"
 tank_super_heavy_four_man_tank_turret_desc:0 "A massive turret with additional space for a second loader to service the main gun."
 tank_super_heavy_three_man_tank_turret:0 "Three Man Turret"
 tank_super_heavy_three_man_tank_turret_desc:0 "A turret big enough for the three crew members to divide the tasks of loading and aiming the main armament as well as staying aware of the situation around them."
 tank_modern_tank_turret:0 "Modern Turret"
 tank_modern_tank_turret_desc:0 "A well-laid out turret allows three crew members to efficiently operate the main armament and keep track of their surroundings."
 NOR_rikstanken_turret: "Improvised Turret"
 NOR_rikstanken_turret_desc: "It houses the gun, and can rotate. When it wants to."

 tank_heavy_machine_gun:0 "Heavy Machine Gun"
 tank_heavy_machine_gun_desc:0 "A machine gun provides decent anti-infantry capability for a low cost. Even with special armor-piercing ammunition, its anti-armor performance leaves a lot to be desired."
 flamethrower:0 "Flamethrower"
 flamethrower_desc:0 "A device to project a stream of burning liquid. While very useful in urban combat and against fortifications, it offers no anti-armor capability and has to be used by a specially-trained crew in a separate unit to be effective."
 coaxial_flamethrower:0 "Secondary Flamethrower"
 coaxial_flamethrower_desc:0 "This flamethrower is not mounted instead of a main caliber weapon, but instead coaxially or in a hull mount. This makes the tank less reliant on such a one-sided weapon."
 advanced_flamethrower: "Advanced Flamethrower"
 advanced_flamethrower_desc: "Enhanced flamethrower systems, ideal for clearing fortified positions and inflicting devastating damage in close-quarters combat."
 tank_auto_cannon:0 "Automatic Cannon"
 tank_auto_cannon_desc:0 "Adapted from a fast-firing anti-air gun, this automatic cannon can lay down a hail of fire that is devastating to soft targets. The small caliber does limit its anti-armor performance."
 tank_auto_cannon_2:0 "Improved Automatic Cannon"
 tank_auto_cannon_2_desc:0 "Adapted from a fast-firing anti-air gun, this automatic cannon can lay down a hail of fire that is devastating to soft targets. The small caliber does limit its anti-armor performance."
 tank_machine_gun_2x:0 "2x Machine Gun"
 tank_machine_gun_2x_desc:0 "A set of machine guns that is potent against soft targets."
 tank_heavy_machine_gun_2x:0 "2x Heavy Machine Gun"
 tank_heavy_machine_gun_2x_desc:0 "A set of machine guns that is potent against soft targets."
 tank_heavy_machine_gun_4x:0 "4x Heavy Machine Gun"
 tank_heavy_machine_gun_4x_desc:0 "A set of machine guns that is potent against soft targets."
 tank_anti_air_cannon:0 "Small Anti-Air Autocannon"
 tank_anti_air_cannon_desc:0 "A fast-firing cannon capable of targeting aircraft."
 tank_anti_air_cannon_2x:0 "2x Small Anti-Air Autocannon"
 tank_anti_air_cannon_2x_desc:0 "A set of fast-firing cannons capable of targeting aircraft."
 tank_anti_air_cannon_4x:0 "4x Small Anti-Air Autocannon"
 tank_anti_air_cannon_4x_desc:0 "A set of fast-firing cannons capable of targeting aircraft."
 tank_anti_air_cannon_2:0 "Medium Anti-Air Autocannon"
 tank_anti_air_cannon_2_desc:0 "A fast-firing cannon capable of targeting aircraft."
 tank_anti_air_cannon_2_2x:0 "2x Medium Anti-Air Autocannon"
 tank_anti_air_cannon_2_2x_desc:0 "A set of fast-firing cannons capable of targeting aircraft."
 tank_anti_air_cannon_3:0 "Heavy Anti-Air Cannon"
 tank_anti_air_cannon_3_desc:0 "A large cannon capable of targeting aircraft by using timed explosive shells."
 tank_medium_howitzer:0 "Medium Howitzer"
 tank_medium_howitzer_desc:0 "A medium field howitzer adapted to be mounted in a vehicle. Its primary purpose is indirect fire support against soft targets, but it can be fired directly at a target if necessary. Carrying only a small amount of armor-percing ammunition, it is ill-suited for anti-tank work."
 tank_medium_howitzer_2:0 "Improved Medium Howitzer"
 tank_medium_howitzer_2_desc:0 "A medium field howitzer adapted to be mounted in a vehicle. Its primary purpose is indirect fire support against soft targets, but it can be fired directly at a target if necessary. Carrying only a small amount of armor-percing ammunition, it is ill-suited for anti-tank work."
 tank_heavy_howitzer:0 "Heavy Howitzer"
 tank_heavy_howitzer_desc:0 "A heavy field howitzer adapted to be mounted in a vehicle. Its primary purpose is indirect fire support against soft targets, but it can be fired directly at a target if necessary. Carrying only a small amount of armor-percing ammunition, it is ill-suited for anti-tank work."
 tank_small_cannon:0 "Small Cannon"
 tank_small_cannon_desc:0 "A small and cheap cannon, able to fire both anti-infantry and anti-armor rounds. Its small caliber limits its usefulness."
 tank_small_cannon_2:0 "Improved Small Cannon"
 tank_small_cannon_2_desc:0 "A small and cheap cannon, able to fire both anti-infantry and anti-armor rounds. Its small caliber limits its usefulness."
 tank_medium_cannon:0 "Medium Cannon"
 tank_medium_cannon_desc:0 "A general-purpose weapon well suited to a wide variety of tasks. It excells at neither anti-infantry nor anti-tank work, but it provides a vehicle with a lot of flexibility."
 tank_medium_cannon_2:0 "Improved Medium Cannon"
 tank_medium_cannon_2_desc:0 "A general-purpose weapon well suited to a wide variety of tasks. It excells at neither anti-infantry nor anti-tank work, but it provides a vehicle with a lot of flexibility."
 tank_medium_velocity_cannon:0 "Medium-Velocity Cannon"
 tank_medium_velocity_cannon_desc:0 "A cannon that can effectively engage both soft and armored targets, however it is lacking in effective range."
 tank_small_high_velocity_cannon:0 "Small High-Velocity Cannon"
 tank_small_high_velocity_cannon_desc:0 "A cannon specifically designed to achieve a high muzzle velocity. Using specialized ammunition, it has superb anti-armor characteristics, but its performance against soft targets suffers."
 tank_high_velocity_cannon:0 "Basic High-Velocity Cannon"
 tank_high_velocity_cannon_desc:0 "A cannon specifically designed to achieve a high muzzle velocity. Using specialized ammunition, it has superb anti-armor characteristics, but its performance against soft targets suffers."
 tank_high_velocity_cannon_2:0 "Improved High-Velocity Cannon"
 tank_high_velocity_cannon_2_desc:0 "A cannon specifically designed to achieve a high muzzle velocity. Using specialized ammunition, it has superb anti-armor characteristics, but its performance against soft targets suffers."
 tank_high_velocity_cannon_3:0 "Advanced High-Velocity Cannon"
 tank_high_velocity_cannon_3_desc:0 "A cannon specifically designed to achieve a high muzzle velocity. Using specialized ammunition, it has superb anti-armor characteristics, but its performance against soft targets suffers."
 tank_heavy_cannon:0 "Basic Heavy Cannon"
 tank_heavy_cannon_desc:0 "A weapon that can fire a large shell. With exceptional armor penetration and decent performance against soft targets, its biggest drawbacks are the sheer size and cost, which make it too unwieldly to be mounted in most vehicles not specifically designed to carry it."
 tank_heavy_cannon_2:0 "Improved Heavy Cannon"
 tank_heavy_cannon_2_desc:0 "A weapon that can fire a large shell. With exceptional armor penetration and decent performance against soft targets, its biggest drawbacks are the sheer size and cost, which make it too unwieldly to be mounted in most vehicles not specifically designed to carry it."
 tank_heavy_cannon_3:1 "Advanced Heavy Cannon"
 tank_heavy_cannon_3_desc:0 "A weapon that can fire a large shell. With exceptional armor penetration and decent performance against soft targets, its biggest drawbacks are the sheer size and cost, which make it too unwieldly to be mounted in most vehicles not specifically designed to carry it."
 tank_heavy_cannon_4:0 "Modern Heavy Cannon"
 tank_heavy_cannon_4_desc:0 "A weapon that can fire a large shell. With exceptional armor penetration and decent performance against soft targets, its biggest drawbacks are the sheer size and cost, which make it too unwieldly to be mounted in most vehicles not specifically designed to carry it."
 tank_super_heavy_cannon:0 "Super-Heavy Cannon"
 tank_super_heavy_cannon_desc:0 "An absurdly large weapon with unmatched performance. There are very few things that this weapon can not destroy, and none of them have any business shooting at a tank."
 tank_super_heavy_cannon_2:0 "Improved Super-Heavy Cannon"
 tank_super_heavy_cannon_2_desc:0 "An absurdly large weapon with unmatched performance. There are very few things that this weapon can not destroy, and none of them have any business shooting at a tank."
 tank_close_support_gun:0 "Close Support Gun"
 tank_close_support_gun_desc:0 "A small weapon designed to fire high-explosive shells against enemy field fortifications to help the infantry on the attack. While capable of engaging tanks, its short barrel and limited ammunition make it unable to deal with more powerful enemy tanks."
 tank_modern_cannon:0 "Modern Cannon"
 tank_modern_cannon_desc:0 "A long, high-caliber weapon that can fire modern ammunition over great distances to devastating effect."
 tank_modern_cannon_2:0 "Improved Modern Cannon"
 tank_modern_cannon_2_desc:0 "A long, high-caliber weapon that can fire modern ammunition over great distances to devastating effect."

 tank_medium_velocity_cannon_hull:0 "Hull-Mounted Medium Velocity Cannon"
 tank_medium_velocity_cannon_hull_desc:0 "A hull-mounted Gun with limited arc of fire."
 tank_medium_howitzer_hull:0 "Hull-Mounted Howitzer"
 tank_medium_howitzer_hull_desc:0 "A hull-mounted Gun with limited arc of fire."

 tank_flags:0 "Flag Communication"
 tank_flags_desc:0 "Communicating via Flags and Hand Signs is an outdated form of coordination."
 tank_radio_1:0 "Basic Radio"
 tank_radio_1_desc:0 "A basic two-way radio allows tanks to coordinate their tactical maneuvers on a small scale."
 tank_radio_2:0 "Improved Radio"
 tank_radio_2_desc:0 "An improved radio allows commanders effective control over larger formations of tanks, permitting large-scale operational maneuvers."
 tank_radio_3:0 "Advanced Radio"
 tank_radio_3_desc:0 "With a more powerful transmitter and better reception, this radio allows communications over dozens of kilometers and in the face of enemy jamming."
 amphibious_drive:0 "Amphibious Drive"
 amphibious_drive_desc:0 "A set of floatation devices and a small screw allow this tank to quickly be rigged to traverse water, either from ship to shore or across a river."
 secondary_turret_hmg:1 "Heavy Machine Gun"
 secondary_turret_hmg_desc:0 "A heavy machine gun in a secondary turret. The placement of the turret limits its arc of fire, lowering the gun's overall effectiveness, but it does allow the tank to engage more targets. This is particularly useful when on the attack."
 secondary_turret_small_cannon:1 "Small Cannon"
 secondary_turret_small_cannon_desc:0 "A small cannon in a secondary turret. The placement of the turret limits its arc of fire, lowering the gun's overall effectiveness, but it does allow the tank to engage more targets. This is particularly useful when on the attack."
 secondary_turret_close_support_gun:1 "Close Support Gun"
 hull_machine_gun:0 "Hull-mounted MG"
 hull_machine_gun_desc:0 "A machine gun in a hull mount can be operated from within the tank."
 hull_heavy_machine_gun:0 "Hull-mounted HMG"
 hull_heavy_machine_gun_desc:0 "A machine gun in a hull mount can be operated from within the tank."
 coaxial_small_cannon:0 "Coaxial Small Cannon"
 coaxial_small_cannon_desc:0 "A cannon of small caliber mounted next to the main weapon to increase the tank's firepower."
 sloped_armor:0 "Sloped Armor"
 sloped_armor_desc:0 "Armor placed at an angle to an incoming shell has a much greater effective thickness than the same amount of armor placed vertically. It also increases the chance that the shell will simply bounce off harmlessly. However, it requires the entire tank to be designed around it, making the vehicle more difficult to assemble."
 stabilizer:0 "Single-Plane Stabilizer"
 stabilizer_desc:0 "A simple gyroscopic stabilizer, keeping the gun and sights level while moving. Improves the tanks accuracy while moving slowly, but does not compensate for changes in direction."
 two_plane_stabilizer:0 "Two-Plane Stabilizer"
 two_plane_stabilizer_desc:0 "A mechanical device to keep the gun pointing in the same direction when the tank is moving. This device compensates for both vertical and horizontal movement."
 smoke_launchers:0 "Smoke Launchers"
 smoke_launchers_desc:0 "A battery of pyrotechnic devices that can be triggered from inside the tank to create a thick cloud of smoke to hide the tank. Very useful when on the defensive or after driving into an ambush."
 extra_ammo_storage:0 "Extra Ammunition Storage"
 extra_ammo_storage_desc:0 "Additional racks of ready ammunition allow the tank to stay in the fight much longer without resupply. However, if the armor is penetrated, the results are likely to be catastrophic. This is particularly problematic when attacking."
 wet_ammo_storage:0 "Wet Ammunition Storage"
 wet_ammo_storage_desc:0 "Water jackets added to ammunition racks dramatically reduce the risk of the ammunition exploding after the tank is hit, which is greatly appreciated by the crews."
 floor_ammo_storage:0 "Floor Ammunition Storage"
 floor_ammo_storage_desc:0 "Relocating the ammunition from the sponsons to the floor of the tank decreases the probability of a devastating ammo hit."
 expanded_fuel_tank:0 "Fuel Drum"
 expanded_fuel_tank_desc:0 "An externally mounted fuel drum designed to extend the operational range of an armored vehicle."
 large_fuel_tank:0 "Larger Fuel Tanks"
 large_fuel_tank_desc:0 "Larger internal fuel tanks increase the risk of catching fire but allow for greater ranges."

 tank_rocket_launcher:0 "Rocket Launcher"
 tank_rocket_launcher_desc:0 "A multi-barrelled launcher for unguided, high-explosive rockets. The high volume of fire gives it excellent performance against soft targets, but even direct hits do little against armored targets."
 tank_rocket_launcher_2:0 "Improved Rocket Launcher"
 tank_rocket_launcher_2_desc:0 "While there are a number of improvements to accuracy, the main advantage of this improved rocket launcher is that it can hold more rockets to fire at the enemy."
 tank_medium_rocket_mortar:0 "Rocket Mortar"
 tank_medium_rocket_mortar_desc:0 "A barrel-mounted grenade launcher allows tanks to function as demolition projectors, blasting through infantry and fortifications."
 tank_heavy_rocket_mortar:0 "Heavy Rocket Mortar"
 tank_heavy_rocket_mortar_desc:0 "A large Rocket fired by special-built tanks can destroy entire houses with a single hit."
 tank_wheeled_suspension:0 "Wheeled Suspension"
 tank_wheeled_suspension_desc:0 "Derived from a truck chassis, this suspension is very limited in its carrying capacity and has limited cross-country performance, but has the advantage of being very cheap to make."
 tank_half_track_suspension:0 "Half-track Suspension"
 tank_half_track_suspension_desc:0 "A hybrid between a fully-tracked vehicle and a regular wheeled suspension, this setup has a pair of wheels up front for steering and a tracked rear axle to improve cross-country performance. While limited in its carrying capacity, it is still cheaper than a fully-tracked design."
 squeezebore_adaptor:0 "Squeeze-bore Adaptor"
 squeezebore_adaptor_desc:0 "A special adaptor at the end of the gun lowers the diameter of the barrel and squeezes a shell down to a smaller caliber. This significantly increases muzzle velocity and thereby the penetration power of the gun. It does require special ammunition made from rare materials."
 armor_skirts:0 "Armor Skirts"
 armor_skirts_desc:0 "A set of thin metal plates mounted on the side of the vehicle, giving additional protection against anti-tank rifles and shaped charges."
 spaced_armor:0 "Spaced Armor"
 spaced_armor_desc:0 "Plates of Armor-Grade Metal are welded with little spacing to the front of any vulnerable areas, increasing overall thickness and shattering projectiles."
 track_armor:0 "Track Armor"
 track_armor_desc:0 "Track links are mounted to open armor spaces. They have limited use as spares but also increase the protection of the vehicle."
 dozer_blade:0 "Dozer Blade"
 dozer_blade_desc:0 "A dozer blade allows the vehicle to quickly build a fighting position in the field without the support of engineers."
 auto_loader:0 "Auto Loader"
 auto_loader_desc:0 "An auomatic mechanism that loads shells and allows the tank to keep a high rate of fire for a prolonged period of time."
 easy_maintenance:0 "Easy Maintenance"
 easy_maintenance_desc:0 "Hatches around the vehicle give access to many different components of the vehicle, and allow the crew to perform even complex maintenance fairly easily."
 additional_machine_guns:0 "Additional Machineguns"
 additional_machine_guns_desc:0 "A set of machineguns in sponsons and special pintle mounts give the vehicle improved defense against close-in infantry attack."
 additional_heavy_machine_guns:0 "Additional Heavy Machinegun"
 additional_heavy_machine_guns_desc:0 "Heavy Machine Guns can increase the tanks effectiveness when dealing with enemy infantry."
 
 sw_rangefinder:0 "Rangefinder"
 sw_rangefinder_desc:0 "Optical Rangefinders utilize trigonometry to enhance the human eye's range estimation. This allows tanks to engage at large distances accurately."
 sw_night_vision:0 "Night Vision Equipment"
 sw_night_vision_desc:0 "Tanks are equipped with infrared spotlights and vision ports, allowing the commander clear vision at night."
 sw_double_tracks:0 "Double Tracks"
 sw_double_tracks_desc:0 "The increased surface area of two sets of tracks allows heavy tanks to traverse rough terrain."

 tank_ap:0 "Armor Piercing"
 tank_ap_short:0 "AP"
 tank_ap_desc:0 "A solid steel projectile that can tear through enemy armor."
 tank_aphe:0 "Armor Piercing High Explosive"
 tank_aphe_short:0 "APHE"
 tank_aphe_desc:0 "This shell detonates after penetrating armor or concrete."
 tank_apcr:0 "Armor Piercing Composite Rigid"
 tank_apcr_short:0 "APCR"
 tank_apcr_desc:0 "A solid core and soft mantle transform this round into a sharp dart when hitting armor."
 tank_apds:0 "Armor Piercing Sabot Discarding"
 tank_apds_short:0 "APDS"
 tank_apds_desc:0 "When fired, the outer part of the shell is discarded, leaving only a high-speed dart with increased penetration."
 tank_heat:0 "High Explosive Anti Tank"
 tank_heat_short:0 "HEAT"
 tank_heat_desc:0 "Explosives propel a core of metal through enemy armor upon hitting."
 tank_he:0 "High Explosive"
 tank_he_short:0 "HE"
 tank_he_desc:0 "A thin-walled shell filled with explosives that detonate on impact."

 tank_smoke:0 "Smoke Canister"
 tank_smoke_desc:0 "Shells filled with Phosphorus and other flammable Chemicals release a thick, heavy cloud of smoke on impact, concealing advances."

