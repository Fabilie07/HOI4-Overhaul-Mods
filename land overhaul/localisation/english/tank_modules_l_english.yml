 ### EQUIPMENT MODULES ###
 
 ac_one_man_turret:0 "One Man Turret"
 ac_one_man_turret_desc:0 "A small turret barely large enough to hold a single crew member, who is tasked with aiming and loading the main armament as well as keeping watch for targets and threats."
 ac_two_man_turret:0 "Two Man Turret"
 ac_two_man_turret_desc:0 "A turret that allows for two crew members to share the work of operating the armament and observing the situation. It still does not allow for an effective division of labor amongst the crew."
 ac_open_top_turret:0 "Open-Top Turret"
 ac_open_top_turret_desc:0 "A fully rotating turret without an armoured roof, allowing excellent all-around vision."
 ac_gun_shield_turret:0 "Gun Shield"
 ac_gun_shield_turret_desc:0 "A traversable gun shield can house larger weapons, but it limits their arc of fire as well as offering less crew protection."

 ac_four_wheeled_suspension:0 "Four-Wheel Suspension"
 ac_four_wheeled_suspension_desc:0 "Four wheels allow for great maneuverability, but the armored car is less stable."
 ac_six_wheeled_suspension:0 "Six-Wheel Suspension"
 ac_six_wheeled_suspension_desc:0 "The weight is dispersed over more wheels, giving more flexibility in combat situations."
 ac_eight_wheeled_suspension:0 "Eight-Wheel Suspension"
 ac_eight_wheeled_suspension_desc:0 "A large number of wheels allow for heavier equipment."

 ac_riveted_armor:0 "Riveted Armor"
 ac_riveted_armor_desc:0 "Armor Plates bolted to the frame and held together by rivets driven into the edges. A very proven technology that is fairly cheap, but the rivetted edges provide weakpoints in the armor and might hurt the crew if the rivets are hit."
 ac_welded_armor:0 "Welded Armor"
 ac_welded_armor_desc:0 "Armor plates are welded to the chassis. A faster process than casting, while still providing good protection."
 
 ac_machine_gun:0 "Machine Gun"
 ac_machine_gun_desc:0 "A light weapon meant for engaging infantry."
 ac_machine_gun_2x:0 "2x Machine Gun"
 ac_machine_gun_2x_desc:0 "A light weapon meant for engaging infantry."
 ac_heavy_machine_gun:0 "Heavy Machine Gun"
 ac_heavy_machine_gun_desc:0 "Larger cartridges increase this MG's range and penetration."
 ac_heavy_machine_gun_2x:0 "2x Heavy Machine Gun"
 ac_heavy_machine_gun_2x_desc:0 "A set of heavy machine guns, capable of engaging both ground and air targets."
 ac_heavy_machine_gun_4x:0 "4x Heavy Machine Gun"
 ac_heavy_machine_gun_4x_desc:0 "A set of heavy machine guns, capable of engaging both ground and air targets."
 ac_auto_cannon:0 "Auto Cannon"
 ac_auto_cannon_desc:0 "An auto cannon, capable of firing a clip of rounds before reloading."
 ac_auto_cannon_2:0 "Improved Auto Cannon"
 ac_auto_cannon_2_desc:0 "A faster fire rate, magazine capacity and more powerful rounds increase this Auto Cannon's effectiveness."
 ac_small_cannon:0 "Small Cannon"
 ac_small_cannon_desc:0 "A cannon meant for engaging soft and armored targets."
 ac_small_cannon_2:0 "Improved Small Cannon"
 ac_small_cannon_2_desc:0 "Larger shells are more effective against all targets."
 ac_high_velocity_cannon:0 "High-Velocity Cannon"
 ac_high_velocity_cannon_desc:0 "A large AT rifle with great penetrating power."
 ac_close_support_gun:0 "Close Support Gun"
 ac_close_support_gun_desc:0 "The short breach allows large payloads to be delivered in cramped conditions. Is ineffective against armor."
 ac_medium_cannon:0 "Medium Cannon"
 ac_medium_cannon_desc:0 "A large caliber and barrel, providing both power and penetration."

 mech_machine_gun_mount:0 "Machine Gun Mount"
 mech_machine_gun_mount_desc:0 "A mount that can be used to affix infantry weapons to the chassis."
 mech_gun_shield_turret:0 "Gun Shield"
 mech_gun_shield_turret_desc:0 "A traversable gun shield can house larger weapons, but it limits their arc of fire as well as offering less crew protection."

 mech_wheeled_suspension:0 "Wheeled Suspension"
 mech_wheeled_suspension_desc:0 "A fully wheeled armored troop carrier is faster but provides less off-road benefits."
 mech_half_tracked_suspension:0 "Half-Track Suspension"
 mech_half_tracked_suspension_desc:0 "This suspension type uses a set of tracks to propel the vehicle and wheels in order to turn."
 mech_tracked_suspension:0 "Full Tracked Suspension"
 mech_tracked_suspension_desc:0 "Tracks can carry more weight than wheels and perform better on grass or mud."

 mech_machine_gun:0 "Machine Gun"
 mech_machine_gun_desc:0 "Light armament to defend the troop carrier."
 mech_machine_gun_2x:0 "2x Machine Gun"
 mech_machine_gun_2x_desc:0 "Light armament to defend the troop carrier."
 mech_heavy_machine_gun:0 "Heavy Machine Gun"
 mech_heavy_machine_gun_desc:0 "Light armament to defend the troop carrier."
 mech_auto_cannon:0 "Auto Cannon"
 mech_auto_cannon_desc:0 "Light armament to defend the troop carrier."
 mech_at_rifle:0 "Anti-Tank Rifle"
 mech_at_rifle_desc:0 "Light armament to defend the troop carrier."
 mech_anti_air_cannon:0 "Anti-Air Armament"
 mech_anti_air_cannon_desc:0 "Dedicated AA weaponry."
 mech_close_support_gun:0 "Close Support Gun"
 mech_close_support_gun_desc:0 "Heavy armament to defend the troop carrier and provide support."
 mech_small_cannon:0 "Small Cannon"
 mech_small_cannon_desc:0 "Heavy armament to defend the troop carrier and provide support."
 mech_medium_cannon:0 "Medium Cannon"
 mech_medium_cannon_desc:0 "Heavy armament to hunt enemy armored units."

 mech_expanded_troop_carrier:0 "Expanded Troop Capacity"
 mech_expanded_troop_carrier_desc:0 "A larger carry room can house an entire squad of infantry."
 mech_gun_port:0 "Gun Port"
 mech_gun_port_desc:0 "A hole in the side of the vehicle to allow the infantry to fire from inside."
 mech_armored_roof:0 "Armored Roof"
 mech_armored_roof_desc:0 "Rather than being open-top, APCs with armored roofs offer more protection."
 mech_larger_tank:0 "Large Fuel Tank"
 mech_larger_tank_desc:0 "In order to drive long distances without needing refueling, the fuel tanks are expanded."
 mech_mine_protection:0 "Mine Protection"
 mech_mine_protection_desc:0 "A thicker steel plate at the bottom of the vehicle helps mitigate the damage enemy mines cause."
 mech_fire_extinguisher:0 "Fire Extinguisher"
 mech_fire_extinguisher_desc:0 "Fires inside such a confined space can be deadly. A fire extinguisher can help combat this risk."
 mech_multi_fuel_engine:0 "Multi-Fuel Engine"
 mech_multi_fuel_engine_desc:0 "The engine can use gasoline, diesel and other forms of petrol to run."
 mech_shovel_equipment:0 "Shovel Equipment"
 mech_shovel_equipment_desc:0 "Additional trench digging equipment helps the infantry with digging the APC and themselves in."
 mech_amphibious_drive:0 "Amphibious Drive"
 mech_amphibious_drive_desc:0 "Propellers and floatation gear allow these APCs to cross rivers and shoreline waters under their own power."

 tank_gasoline_engine:0 "Basic Gasoline Engine"
 tank_gasoline_engine_desc:0 "An Engine running on gasoline will be faster for a given Engine Size, but the fuel will be much more prone to catching fire."
 tank_gasoline_engine_2:0 "Improved Gasoline Engine"
 tank_gasoline_engine_2_desc:0 "An Engine running on gasoline will be faster for a given Engine Size, but the fuel will be much more prone to catching fire."
 tank_gasoline_engine_3:0 "Advanced Gasoline Engine"
 tank_gasoline_engine_3_desc:0 "An Engine running on gasoline will be faster for a given Engine Size, but the fuel will be much more prone to catching fire."
 tank_modern_gasoline_engine:0 "Modern Gasoline Engine"
 tank_modern_gasoline_engine_desc:0 "An Engine running on gasoline will be faster for a given Engine Size, but the fuel will be much more prone to catching fire."
 tank_diesel_engine:0 "Basic Diesel Engine"
 tank_diesel_engine_desc:0 "An Engine running on Diesel fuel is more reliable than a gasoline engine, but not as fast for the same Engine Size."
 tank_diesel_engine_2:0 "Improved Diesel Engine"
 tank_diesel_engine_2_desc:0 "An Engine running on Diesel fuel is more reliable than a gasoline engine, but not as fast for the same Engine Size."
 tank_diesel_engine_3:0 "Advanced Diesel Engine"
 tank_diesel_engine_3_desc:0 "An Engine running on Diesel fuel is more reliable than a gasoline engine, but not as fast for the same Engine Size."
 tank_modern_diesel_engine:0 "Modern Diesel Engine"
 tank_modern_diesel_engine_desc:0 "An Engine running on Diesel fuel is more reliable than a gasoline engine, but not as fast for the same Engine Size."
 tank_petrol_electric_engine:0 "Basic Petrol-Electric Engine"
 tank_petrol_electric_engine_desc:0 "A combination of a petrol-driven engine providing power to an electric motor. Complex, expensive and unreliable, it does however offer unmatched performance in tactical movements."
 tank_petrol_electric_engine_2:0 "Improved Petrol-Electric Engine"
 tank_petrol_electric_engine_2_desc:0 "A combination of a petrol-driven engine providing power to an electric motor. Complex, expensive and unreliable, it does however offer unmatched performance in tactical movements."
 tank_gas_turbine_engine:0 "Gas Turbine"
 tank_gas_turbine_engine_desc:0 "An turbine developed from jet engines. High fuel consumption, but the highest speed of any engine at a given Engine Size."

 tank_riveted_armor:0 "Riveted Armor"
 tank_riveted_armor_desc:0 "Armor Plates bolted to the frame and held together by rivets driven into the edges. A very proven technology that is fairly cheap, but the rivetted edges provide weakpoints in the armor and might hurt the crew if the rivets are hit."
 tank_cast_armor:0 "Cast Armor"
 tank_cast_armor_desc:0 "The entire Chassis, including armor, is cast as a single unit. An expensive and time-consuming process that allows for much thicker armor with fewer weakpoints."
 tank_welded_armor:0 "Welded Armor"
 tank_welded_armor_desc:0 "Armor plates are welded to the chassis. A faster process than casting, while still providing good protection."
 tank_lq_welded_armor:0 "Low-Quality Welded Armor"
 tank_lq_welded_armor_desc:0 "These Armor Plates are joined by welding with regular steel. This bypasses the need for rare metals, but the resulting armor is more brittle and the weld seams may break or crack."
 tank_modern_welded_armor:0 "Modern Welded Armor"
 tank_modern_welded_armor_desc:0 "Improvements in manufacture processes make a more durable, sturdy set of Armor."
 NOR_tank_rikstanken_armor: "Makeshift Armor"
 NOR_tank_rikstanken_armor_desc: "Made out of sheets of iron instead of steel to save money. Better than no armor... Probably."

 tank_cast_turret_armor:0 "Multi-Type Armor"
 tank_cast_turret_armor_desc:0 "By welding the hull and only casting the turret, the production cost is reduced while ensuring the superior quality of armor."
 tank_modern_cast_turret_armor:0 "Modern Multi-Type Armor"
 tank_modern_cast_turret_armor_desc:0 "Better welding techniques and advancements in casting technology allow the two types of manufacture to be seamlessly merged."

 tank_torsion_bar_suspension:0 "Torsion Bar"
 tank_torsion_bar_suspension_desc:0 "A fairly reliable suspension system of metal bars fixed to the vehicle chassis that provides a smoother ride than other suspension types."
 tank_christie_suspension:0 "Christie Suspension"
 tank_christie_suspension_desc:0 "Developed by an American inventor, this supension allows for exceptionally high speeds."
 tank_bogie_suspension:0 "Bogie Suspension"
 tank_bogie_suspension_desc:0 "A simple and fairly cheap type of suspension in which the roadwheels are mounted individually, allowing them to be easily replaced if damaged."
 tank_interleaved_suspension:0 "Interleaved Roadwheels"
 tank_interleaved_suspension_desc:0 "By overlapping the roadwheels, more of them can be fit in the same length of the hull, thereby improving mobility as well as providing some additional protection in the flanks."
 tank_hvss_suspension:0 "HVSS Suspension"
 tank_hvss_suspension_desc:0 "Interlocking sets of bogies allow for very broad tracks, reducing ground pressure."

 tank_light_one_man_tank_turret:0 "One Man Turret"
 tank_light_one_man_tank_turret_desc:0 "A small turret barely large enough to hold a single crew member, who is tasked with aiming and loading the main armament as well as keeping watch for targets and threats."
 tank_light_two_man_tank_turret:0 "Two Man Turret"
 tank_light_two_man_tank_turret_desc:0 "A turret that allows for two crew members to share the work of operating the armament and observing the situation. It still does not allow for an effective division of labor amongst the crew."
 tank_light_three_man_tank_turret:0 "Three Man Turret"
 tank_light_three_man_tank_turret_desc:0 "A turret big enough for the three crew members to divide the tasks of loading and aiming the main armament as well as staying aware of the situation around them."
 tank_light_fixed_superstructure_turret:1 "Light Fixed Superstructure"
 tank_light_fixed_superstructure_turret_desc:0 "A fixed superstructure only allows the main armament to traverse in a small arc without turning the entire vehicle. However, it allows the vehicle to mount a bigger armament while being overall of smaller size, making the vehicle perfect for ambushes."
 tank_light_open_top_turret:0 "Open-Top Turret"
 tank_light_open_top_turret_desc:0 "A fully rotating turret without an armoured roof, allowing not only excellent all-around vision but also the mounting of larger guns due to it being less cramped."
 tank_medium_one_man_tank_turret:0 "One Man Turret"
 tank_medium_one_man_tank_turret_desc:0 "A small turret barely large enough to hold a single crew member, who is tasked with aiming and loading the main armament as well as keeping watch for targets and threats."
