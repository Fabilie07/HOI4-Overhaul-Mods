l_english:

 close_support_gun_tech:0 "Close Support Gun"
 close_support_gun_tech_desc:0 "Research shows that tank-mounted light artillery pieces might prove valuable."
 spg_ammo1:0 "Small Shaped Charges"
 spg_ammo1_desc:0 "Small projectiles can achieve greater anti-armor capacity by using shaped charges."
 medium_velocity_cannon_tech:0 "Multi-Purpose Cannon"
 medium_velocity_cannon_tech_desc:0 "Striking a balance between anti-armor and anti-infantry capabilities creates a very capable gun."
 medium_howitzer_tech:0 "Medium Howitzer"
 medium_howitzer_tech_desc:0 "Self-propelled Guns can fire and quickly move, as well as be armoured against shrapnel or small-arms."
 spg_ammo2:0 "Tank Howitzer Improvements"
 spg_ammo2_desc:0 "New ammunition types and more optimized guns increase the reliability and capacities of Self-propelled Guns."
 heavy_howitzer_tech:0 "Heavy Howitzer"
 heavy_howitzer_tech_desc:0 "Large-Caliber Projectiles can be devastating at all ranges."
 spg_ammo3:0 "Large Shaped Charges"
 spg_ammo3_desc:0 "Heavy Shaped Charges can punch through a lot of armor even at long ranges."

 small_cannon_tech:0 "Small Cannon"
 small_cannon_tech_desc:0 "Mounting cannons on tanks greatly increases their firepower."
 tank_ammo1:0 "Anti-Armor Improvements"
 tank_ammo1_desc:0 "New developments in Metalurgy allow for more powerful shells."
 small_cannon_tech2:0 "Improved Small Cannon"
 small_cannon_tech2_desc:0 "Increased Caliber and Muzzle Velocity elevates the firepower of a tank significantly."
 tank_ammo2:0 "Explosive Fillers"
 tank_ammo2_desc:0 "Filling armor-piercing shells with explosives allows them to detonate inside of enemy tanks or forts, increasing their damage."

 medium_cannon_tech:0 "Medium Cannon"
 medium_cannon_tech_desc:0 "Cannons of bigger calibers require larger turrets but the increase in firepower is well worth it."
 tank_ammo3:0 "Anti-Armor Improvements II"
 tank_ammo3_desc:0 "Larger caliber composite shells make up for lacking penetration on older guns."
 medium_cannon_tech2:0 "Improved Medium Cannon"
 medium_cannon_tech2_desc:0 "Larger cannons can deal with the rising threat of ever-advancing progress regarding heavy tanks."
 high_velocity_cannon_tech:0 "Velocity Improvements"
 high_velocity_cannon_tech_desc:0 "By lengthening both shells and barrels, more gun powder is burned, increasing accuracy and penetration."
 high_velocity_cannon_tech2:0 "Velocity Improvements II"
 high_velocity_cannon_tech2_desc:0 "By lengthening both shells and barrels, more gun powder is burned, increasing accuracy and penetration."
 high_velocity_cannon_tech3:0 "Velocity Improvements III"
 high_velocity_cannon_tech3_desc:0 "By lengthening both shells and barrels, more gun powder is burned, increasing accuracy and penetration."

 heavy_cannon_tech:0 "Heavy Cannon"
 heavy_cannon_tech_desc:0 "Large shells rip apart even strong armor and carry enough explosives to wipe out entire squads of infantry."
 heavy_cannon_tech2:0 "Heavy Cannon II"
 heavy_cannon_tech2_desc:0 "New breech designs allow for easier loading and less risk to the crew when firing the cannon."
 heavy_cannon_tech3:0 "Heavy Cannon III"
 heavy_cannon_tech3_desc:0 "Modern manufacturing enables more durable turret rings and gun fittings, reducing the structural strain from mounting such large cannons."
 heavy_cannon_tech4:0 "Heavy Cannon IV"
 heavy_cannon_tech4_desc:0 "Larger and more complex tanks can comfortably carry guns of sizes that were only able to be used by specialized vehicles before."
 
 super_heavy_cannon_tech:0 "Super Heavy Cannon"
 super_heavy_cannon_tech_desc:0 "These Cannons are often converted from Naval Guns, offering enormous firepower but putting a lot of strain on the chassis carrying them."
 super_heavy_cannon_tech2:0 "Super Heavy Cannon II"
 super_heavy_cannon_tech2_desc:0 "In order to get through the armor of modern Heavy Tanks, a gun of truly monstrous size is necessary."

 modern_cannon_tech:0 "Modern Cannon"
 modern_cannon_tech_desc:0 "New Ammunition requires reworked cannons to be fired to its greatest effect."
 modern_cannon_tech2:0 "Modern Cannon II"
 modern_cannon_tech2_desc:0 "Combining accuracy, firepower and fire rate, the newest cannons promise swift destruction of all manner of targets."

 auto_cannon_tech:0 "Rapid-Fire Weaponry"
 auto_cannon_tech_desc:0 "Fast-firing weapons are believed to be quite capable at dealing with most threats faced while providing infantry support."
 auto_cannon_tech2:0 "Rapid-Fire Weaponry II"
 auto_cannon_tech2_desc:0 "Self-propelled Anti-Air Vehicles seem to be an answer to the ever-growing threat of aircraft."
 auto_cannon_tech3:0 "Rapid-Fire Weaponry III"
 auto_cannon_tech3_desc:0 "Heavier Tank-mounted AA and AAA guns can destroy planes even at higher altitudes."

 quick_conversion_tech:0 "Quick Conversion Kits"
 quick_conversion_tech_desc:0 "Tanks carry snorkel equipment and waterproofing rubber caps to quickly traverse rivers and other shallow waters."
 intake_filter_tech:0 "Intake Filters"
 intake_filter_tech_desc:0 "The air that is being fed into the engine is filtered, preventing particles such as sand or mud from building up. This prevents overheating and choking of the engine."
 ammo_stowage_tech:0 "Ammunition Stowage"
 ammo_stowage_tech_desc:0 "Smarter internal layouts, especially regarding ammunition, can improve the survivability and effectiveness of armored fighting vehicles."
 field_modifications_tech:0 "Field Modifications"
 field_modifications_tech_desc:0 "When push comes to shove, not every tank is fit for every role. Giving crews the freedom to make simple modifications to their vehicles improves their flexibility."
 air_conditioning_tech:0 "Air Conditioning"
 air_conditioning_tech_desc:0 "Ventilation systems in tanks are crucial to prevent gas buildup from firing the gun or running the engine. By installing more sophisticated AC units, the crews can operate at maximum efficiency even in harsh environments."
 open_top_tech:0 "Roofless Turrets"
 open_top_tech_desc:0 "Many drawbacks of enclosed turrets can be bypassed by removing the roof."
 cruising_adjustment_tech:0 "Cross-Country Cruising"
 cruising_adjustment_tech_desc:0 "By building engines with operational range rather than high-end performance in mind, our mobile forces will be able to go large distances without needing resupply."
 advanced_suspension_tech:0 "Advanced Suspensions"
 advanced_suspension_tech_desc:0 "Heavy Vehicles need special shock dampening systems capable of reliably carrying tens of tons over rough terrain."
 widened_tracks_tech:0 "Widened Tracks"
 widened_tracks_tech_desc:0 "With increasing weight, the large ground pressure of tanks poses a real challenge. By widening the tracks, this pressure is reduced, preventing them from getting stuck in mud or loose earth."
 winter_tracks_tech:0 "Winter Track Extensions"
 winter_tracks_tech_desc:0 "Tanks tend to loose grip on wet soil or snow. Extending the track links sideways improves the grip in those surfaces, making maneuvering easier and less dangerous."
 advanced_optics_tech:0 "Sights Upgrades"
 advanced_optics_tech_desc:0 "A tank's optics are its eyes. They have notoriously bad visibility and situational awareness, so any improvement can make a huge difference."

 light_interdiction_tech:0 "Light Tank Interdiction"
 light_interdiction_tech_desc:0 "Light Tanks are built with the purposes of outflanking enemies as well as covering retreats in mind."
 light_recon_tech:0 "Light Tank Reconnaisance"
 light_recon_tech_desc:0 "New Light Tank Models are meant to mainly focus on spying and forward reconnaisance duties."
 light_recon_tech2:0 "Light Tank Maneuverability"
 light_recon_tech2_desc:0 "Light Tanks are designed with great acceleration and steering, making them much more viable in areas with restricted movement."
 medium_line_tech:0 "Medium Tank Line"
 medium_line_tech_desc:0 "Medium Tanks are designed to maintain an unbroken frontline in order to counter infiltration and cutoff tactics."
 medium_flexible_line_tech:0 "Flexible Medium Tank Line"
 medium_flexible_line_tech_desc:0 "Medium Tanks are designed to be fast, both to respond quickly to threats and cut off enemy troops."
 heavy_breakthrough_tech:0 "Heavy Breakthrough Tanks"
 heavy_breakthrough_tech_desc:0 "Stalemates occur all the time on the battlefield. Heavy Tanks are designed with the sole purpose of breaking them."
 
 armor_tech_5:0 "Early Cold-War Armor Protection"
 armor_tech_5_desc:0 "In the 1950s, armor design revolved around extremely well-protected Heavy Tanks and fast, light Tank Destroyers to counter them. To stay survivable, new layouts using spaced armor need to be used."
 armor_tech_6:0 "Basic Cold-War Armor Protection"
 armor_tech_6_desc:0 "With Shaped Charges nullifying conventional steel armor, new alternatives must be used. Composite Armor Plates using layers of Plastic and Ceramic can provide sufficient protection against them."
 engine_tech_5:0 "Early Cold-War Engine"
 engine_tech_5_desc:0 "Engine Technology has reached a new height during the war. Suddenly, dozen-ton behemoths can move as fast as 50km/h. New developments must focus on reliability at such scales."
 engine_tech_6:0 "Basic Cold-War Engine"
 engine_tech_6_desc:0 "In order for Tanks to operate in any terrain for extended periods of time, more powerful and efficient engines are needed. With them, the Main Battle Tank will become the defining weapon of the latter half of the 20th century."

 mechanized_aa_equipment_desc:0 "Anti-Air Guns mounted to an APC makes a cheaper alternative form of Self-Propelled AA. However fitting infantry inside as well is problematic."
 mechanized_destroyer_equipment_desc:0 "A mechanized chassis fitted with a powerful anti-tank gun creates a cheap, mobile anti-armor unit."
 armored_car_aa_equipment_desc:0 "Armored Cars with high-elevating machine guns or auto cannons can be used to defend ground units from air attacks."
 
 motorized_equipment_light:0 "Light Truck"
 motorized_equipment_light_desc:0 "With advancements in engine and suspension technologies, smaller vehicles can fulfill the roles of larger ones while being easier to produce and maintain. The only drawback is that they cannot carry as many people."
 motorized_equipment_light_2:0 "Improved Light Truck"
 motorized_equipment_light_3:0 "Advanced Light Truck"
 
 motorized_equipment_2:0 "Improved Truck"
 motorized_equipment_2_desc:0 "Capable of carrying more load through rough terrain, as well as many other small improvements, modern trucks are vital on the modern battlefield."
 motorized_equipment_3:0 "Advanced Truck"
 motorized_equipment_3_desc:0 "More powerful engines developed in the war give birth to a new class of Trucks with better mobility and terrain traversability."
 motorized_equipment_4:0 "Modern Truck"
 motorized_equipment_4_desc:0 "A focus on modularity and speed to support a modern Tank war are the defining features of modern Trucks."
 
 mechanized_equipment_desc: "Armored Troop Carriers, often times mounted with MGs or other weapons, offer protection against enemy attacks. Their main use is to push through enemy lines, with troops dismounting afterwards and attacking from the rear."
 mechanised_infantry_desc:0 "APCs equipped with floatation devices can cross rivers on their own and are very useful for amphibious operations."
 
 
 armor_modules: "Tank Modules"
 armor_modules_speed: "Tank Modules Research Speed"