l_english:

 infantry_equipment_4:0 "Early Cold War Infantry Equipment"
 infantry_equipment_5:0 "Basic Cold War Infantry Equipment"

 modern_infantry_weapons:0 "Early Cold War Infantry Weapons"
 modern_infantry_weapons2:0 "Basic Cold War Infantry Weapons"
 modern_lmg_tech:0 "Improved Infantry Equipment IV"
 modern_lmg_tech_desc:0 "Lightweight gear, equipment made from newly developed plastics and general ergonomic improvements prepare our infantry for a new form of war."
 
 infantry_at3:0 "Infantry Anti-Tank III"
 infantry_at3_desc:0 "Improved Shaped Charges make our small Anti-Tank Rockets deadly for even the most armored vehicles."
 infantry_at4:0 "Infantry Anti-Tank IV"
 infantry_at4_desc:0 "Squad AT Rockets with larger warheads and longer ranges increase their killing potential against enemy tanks. They are also becoming easier to produce and use."
 infantry_at5:0 "Infantry Anti-Tank V"
 infantry_at5_desc:0 "Faster Rockets increase both range and accuracy, while reloading of Portable AT Launcher becomes simpler."
 
 night_vision3:0 "Night Vision III"
 night_vision3_desc:0 "These new scopes no longer rely on Infrared Lamps to illuminate the dark, instead enhancing the surrounding light using phosphorescence."
 
 support_weapons5:0 "Support Weapons V"
 support_weapons5_desc:0 "With advancing technology, support fire weapons are becoming more flexible and easier to produce."
 support_weapons6:0 "Support Weapons VI"
 support_weapons6_desc:0 "New designs are drafted for a general-purpose machine gun, combining the capabilities of light, medium and heavy machine guns."
 support_weapons7:0 "Support Weapons VII"
 support_weapons7_desc:0 "Advancements in metallurgy and plastics allow mortars to be lighter and more precise."
 support_weapons8:0 "Support Weapons VIII"
 support_weapons8_desc:0 "Specially treated barrels allow for higher rates of fire, while retaining a shoulder-firing capability."

 
 # Support
 tech_engineers5:0 "Engineer Company V"
 tech_engineers5_desc:0 "An increased focus on Urban Warfare will be necessary for future warfare."
 tech_engineers6:0 "Engineer Company VI"
 tech_engineers6_desc:0 "The ability to quickly traverse difficult terrain opens up new strategic possibilities and fronts."
 tech_engineers7:0 "Engineer Company VII"
 tech_engineers7_desc:0 "Using modern equipment, barges, bridges and ditches can be quickly built and moved."
 tech_engineers8:0 "Engineer Company VIII"
 tech_engineers8_desc:0 "The Engineer's job is to protect weakspots an enemy might exploit. For this reason, they must be able to defend even the most exposed positions."
 tech_engineers9:0 "Engineer Company IX"
 tech_engineers9_desc:0 "With warfare between peers becoming ever more brutal, defending or taking strongholds is more important than ever."
 
 tech_recon5:0 "Recon Company V"
 tech_recon5_desc:0 "With global superpowers clashing against eachother, warfare is no longer a question of who has the larger army, but who can outmaneuver their opponent. Widespread recon is vital in achieving this victory."
 tech_recon6:0 "Recon Company VI"
 tech_recon6_desc:0 "Constant recon allows indirect Artillery fire to decimate enemy positions before they are taken."
 tech_recon7:0 "Recon Company VII"
 tech_recon7_desc:0 "Proper reconnaissance is vital to counter the increase of guerilla tactics in a new age of warfare."
 tech_recon8:0 "Recon Company VIII"
 tech_recon8_desc:0 "Modern equipment allows commanders to have a more complete picture of the battlefield than ever before, at any time."
 tech_recon9:0 "Recon Company IX"
 tech_recon9_desc:0 "Recon elements can communicate directly with each other, ensuring that all enemies are accounted for at all times."
 
 tech_military_police5:0 "Military Police V"
 tech_military_police5_desc:0 "Military Police fulfil not only occupation duties, but also ensure discipline and morale among our troops."
 tech_military_police6:0 "Military Police VI"
 tech_military_police6_desc:0 "Strengthening local powers and politicians that agree with our occupation allows for an orderly transition into civil life under our flag."
 tech_military_police7:0 "Military Police VII"
 tech_military_police7_desc:0 "By utilizing intelligence networks, we can strike rebellious networks before they become a threat."
 tech_military_police8:0 "Military Police VIII"
 tech_military_police8_desc:0 "A high standard of training among the military police prevents incidents from escalating or inciting the occupied population."
 tech_military_police9:0 "Military Police IX"
 tech_military_police9_desc:0 "The removal of our Military Occupation Forces must be well-prepared, to ease the way for a civilian organization to govern occupied territories."
 
 tech_maintenance_company5:0 "Maintenance Company V"
 tech_maintenance_company5_desc:0 "Mobile Workshops can perform more complex repairs near the frontline, without the need for factory repairs."
 tech_maintenance_company6:0 "Maintenance Company VI"
 tech_maintenance_company6_desc:0 "Regular, preventative maintenance of less reliable equipment reduces losses when it is most needed."
 tech_maintenance_company7:0 "Maintenance Company VII"
 tech_maintenance_company7_desc:0 "A policy to produce two spare parts for every critical piece of equipment allows them to be abundant when needed."
 tech_maintenance_company8:0 "Maintenance Company VIII"
 tech_maintenance_company8_desc:0 "Damaged or captured equipment is broken down into spare parts when repairs are inadvisable."
 tech_maintenance_company9:0 "Maintenance Company IX"
 tech_maintenance_company9_desc:0 "Equipment is kept servicable even in the most adverse environments, allowing units to continue fighting there."
 
 tech_field_hospital5:0 "Field Hospital V"
 tech_field_hospital5_desc:0 "Combat Rescue under fire has been one of the greatest challenges. Dedicated teams are used to rescue wounded soldiers in the line of fire."
 tech_field_hospital6:0 "Field Hospital VI"
 tech_field_hospital6_desc:0 "Search and Rescue is conducted even in the most adverse terrains and remote regions."
 tech_field_hospital7:0 "Field Hospital VII"
 tech_field_hospital7_desc:0 "Modern medicine and surgeries improve the chances and speed of a soldier recovering from serious injuries."
 tech_field_hospital8:0 "Field Hospital VIII"
 tech_field_hospital8_desc:0 "New procedures for hygiene and sterilization keep even busy field hospitals clean and free of germs."
 tech_field_hospital9:0 "Field Hospital IX"
 tech_field_hospital9_desc:0 "Regular medical examinations for enlisted men prevents ailments from being noticed too late."
 
 tech_logistics_company5:0 "Logistics Company V"
 tech_logistics_company5_desc:0 "Pre-stockpiling supplies before expected offensives allows units to fight for longer at full strength."
 tech_logistics_company6:0 "Logistics Company VI"
 tech_logistics_company6_desc:0 "New cooling methods allow for perishable foods and medicines to be transported over long distances."
 tech_logistics_company7:0 "Logistics Company VII"
 tech_logistics_company7_desc:0 "Careful planning of logistic routes and shipments prevent too much or too little being delivered at any time."
 tech_logistics_company8:0 "Logistics Company VIII"
 tech_logistics_company8_desc:0 "Delivering items that are considered luxury helps with increasing morale among the troops."
 tech_logistics_company9:0 "Logistics Company IX"
 tech_logistics_company9_desc:0 "Modern supply chains can be extended quickly, allowing for fast advances into enemy territory."
 
 tech_signal_company5:0 "Signal Company V"
 tech_signal_company5_desc:0 "Modern radios allow individual squads to exhange orders with their superiors while in the field."
 tech_signal_company6:0 "Signal Company VI"
 tech_signal_company6_desc:0 "Clear and efficient communication is drilled into every soldier carrying a radio device. This keeps sound clutter from occupying comms."
 tech_signal_company7:0 "Signal Company VII"
 tech_signal_company7_desc:0 "New technologies increase range while being harder to intercept. This allows easier communication without giving yourself away."
 tech_signal_company8:0 "Signal Company VIII"
 tech_signal_company8_desc:0 "Tight-knit communication between different branches elevates Combined Arms Warfare to the next level."
 tech_signal_company9:0 "Signal Company IX"
 tech_signal_company9_desc:0 "Signal companies are trained in counter-warfare as well, allowing them to intercept or jam enemy communications."
 